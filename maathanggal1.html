<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    font-family:'Noto Sans Tamil',sans-serif;

    background:#111D66;;

    display:flex;

    justify-content:center;

    align-items:flex-start;

    min-height:100vh;

    overflow-y:auto;

    overflow-x:hidden;

    padding:20px;

}


.app{

    width:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    max-width:800px;

    transform-style:preserve-3d;

}


/* =====================================================
   MAIN PAGE
===================================================== */

.book{

    position:relative;

    width:min(900px,100%);

    background:#F9F3E4;

    border-radius:30px;

    padding:40px;

    overflow:visible;

    box-shadow:
        0 10px 30px rgba(0,0,0,.25);

}



/* =====================================================
   RED BOOK SPINE
===================================================== */

.book::before{

    content:"";

    position:absolute;

    left:-10px;

    top:20px;

    bottom:20px;

    width:18px;

    background:#D40C02;

    border-radius:10px;

}



/* =====================================================
   DECORATIONS
===================================================== */

.swirl{

    position:absolute;

    left:18px;
    top:14px;

    width:80px;
    height:80px;

    border:6px solid #F2C94C;

    border-right-color:transparent;
    border-bottom-color:transparent;

    border-radius:50%;

    transform:rotate(-20deg);

}

.swirl::after{

    content:"";

    position:absolute;

    left:14px;
    top:14px;

    width:38px;
    height:38px;

    border:5px solid #F2C94C;

    border-right-color:transparent;
    border-bottom-color:transparent;

    border-radius:50%;

}



.curve-top{

    position:absolute;

    right:28px;
    top:18px;

    width:92px;
    height:26px;

    border-top:6px solid #F19DA5;

    border-radius:60px;

    transform:rotate(8deg);

}



.sparkle{

    position:absolute;

    right:32px;

    top:180px;

    width:36px;
    height:36px;

}

.sparkle::before,
.sparkle::after{

    content:"";

    position:absolute;

    background:#FF847C;

    border-radius:10px;

}

.sparkle::before{

    width:5px;

    height:100%;

    left:50%;

    transform:translateX(-50%);

}

.sparkle::after{

    width:100%;

    height:5px;

    top:50%;

    transform:translateY(-50%);

}



/* =====================================================
   PAGE TITLE
===================================================== */

.title{

    position:relative;

    width:fit-content;

    min-width:420px;

    margin:0 auto 20px;

    padding:12px 60px 12px 40px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:8px;

    background:#fff;

    color:#73160E;

    font-size:48px;

    font-weight:800;

    letter-spacing:0;

    border:2px solid #d0d0d0;

    box-shadow:0 4px 12px rgba(0,0,0,.15);

    cursor:pointer;

    transition:.25s;

}


.title:hover{

    transform:translateY(-2px);

}

.title .speaker-icon{

    position:absolute;

    right:14px;

    top:50%;

    transform:translateY(-50%);

    font-size:13px;

}



/* =====================================================
   MONTH SECTION
===================================================== */

.months-wrapper{

    display:flex;

    justify-content:space-between;

    gap:18px;

    margin-bottom:22px;

}



.card{

    flex:1;

    border-radius:26px;

    padding:16px;

    display:flex;

    flex-direction:column;

    gap:8px;

}



.pink{

    background:#F5CFD8;

}



.yellow{

    background:#F8E3A8;

}



/* =====================================================
   MONTH BUTTONS
===================================================== */

.month-btn{

    background:transparent;

    border:none;

    width:100%;

    font-family:inherit;

    font-size:27px;

    color:#111;

    padding:5px;

    border-radius:10px;

    cursor:pointer;

    transition:.25s;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:0;

}



.month-btn:hover{

    background:#fff;

    transform:translateY(-2px);

    box-shadow:0 4px 10px rgba(0,0,0,.12);

}



.month-btn.active{

    background:#FFF59A;

    color:#C62828;

}



/* Small Click Effect */

.month-btn:active{

    transform:scale(.96);

}


/* =====================================================
   AATHICHUDI HEADER
===================================================== */

.aathichudi-header{

    display:flex;
    justify-content:center;
    align-items:center;

    gap:14px;

    margin-bottom:14px;

}

.heading{

    background:#F7B9C8;

    color:#D12020;

    font-size:30px;

    font-weight:800;

    padding:6px 24px;

    border-radius:30px;

    border:2px solid #EF8FA6;

    text-shadow:1px 1px #fff;

    cursor:pointer;

    position:relative;

    font-family:inherit;

    transition:.25s;

}



.line{

    position:relative;

    width:48px;

    height:5px;

    background:#000;

    border-radius:10px;

}

.line::before,
.line::after{

    content:"";

    position:absolute;

    width:36px;

    height:5px;

    background:#000;

    border-radius:10px;

}

.left::before{

    top:-10px;

    left:0;

    transform:rotate(25deg);

}

.left::after{

    top:10px;

    left:0;

    transform:rotate(-25deg);

}

.right::before{

    top:-10px;

    right:0;

    transform:rotate(-25deg);

}

.right::after{

    top:10px;

    right:0;

    transform:rotate(25deg);

}



/* =====================================================
   AATHICHUDI CARD
===================================================== */

.aathichudi-card{

    background:#F8E4A8;

    border-radius:28px;

    padding:18px;

    display:flex;

    gap:18px;

}

.column{

    flex:1;

    display:flex;

    flex-direction:column;

    gap:6px;

}



/* =====================================================
   RULE BUTTONS
===================================================== */

.rule-btn{

    background:none;

    border:none;

    text-align:left;

    font-family:inherit;

    font-size:21px;

    line-height:1.28;

    padding:5px 6px;

    border-radius:8px;

    cursor:pointer;

    transition:.25s;

}

.rule-btn:hover{

    background:#fff;

    transform:translateX(5px);

    box-shadow:0 4px 10px rgba(0,0,0,.12);

}

.rule-btn.active{

    background:#FFF59A;

    color:#C62828;

}

.rule-btn:active{

    transform:scale(.97);

}


.speaker-btn{

    position:relative;

    border:2px solid rgba(0,0,0,.18);

    box-shadow:0 3px 8px rgba(0,0,0,.12);

}

.speaker-btn:hover{

    border-color:#D12020;

}

.speaker-icon{

    position:absolute;

    top:4px;

    right:6px;

    font-size:11px;

    opacity:.8;

    pointer-events:none;

}

.month-btn,
.rule-btn{

    transition:.25s;

}

.month-btn.active,
.rule-btn.active{

    background:#FFF59A;

    border-color:#E53935;

    color:#C62828;

    box-shadow:
        0 0 10px rgba(255,215,0,.8),
        0 0 18px rgba(255,215,0,.4);

}


.word{

    display:inline;

    margin:0;

    padding:2px 2px;

    border-radius:6px;

    transition:.25s;

}

.word.active{

    background:#FFF59A;

    color:#D50000;

    font-weight:700;

    box-shadow:0 0 8px rgba(255,215,0,.8);

}


/* =====================================================
   PAGE NUMBER
===================================================== */

.page-number{

    margin-top:12px;

    text-align:center;

    font-size:24px;

    font-weight:800;

    color:#8D64D8;

}



/* =====================================================
   NAVIGATION
===================================================== */

.navigation{

    margin-top:16px;

    display:flex;

    justify-content:space-between;

    align-items:center;

}

.nav-btn{

    width:60px;

    height:60px;

    border:none;

    border-radius:50%;

    background:#F9F3E4;

    font-size:28px;

    cursor:pointer;

    box-shadow:0 5px 15px rgba(0,0,0,.18);

    transition:.25s;

}

.nav-btn:hover{

    transform:scale(1.08);

}



.dots{

    display:flex;

    gap:10px;

}

.dot{

    width:12px;

    height:12px;

    border-radius:50%;

    background:#A8B0B0;

}

.dot.active{

    background:#19D400;

}


.highlight{

    display:inline-block;

    color:#111;

    transition:.25s;

}

.highlight.active{

    color:#ff0000;

    transform:scale(1.08);

    font-weight:700;

    text-shadow:0 0 5px rgba(255,0,0,.35);

}


/* ==========================
   PAGE FLIP
========================== */

.app{
    perspective:1500px;
    transform-style:preserve-3d;
    backface-visibility:hidden;
}

.flip-out-next{
    animation:flipNext .6s ease forwards;
    transform-origin:left center;
}

.flip-out-prev{
    animation:flipPrev .6s ease forwards;
    transform-origin:right center;
}

@keyframes flipNext{
    0%{
        transform:rotateY(0deg);
    }
    100%{
        transform:rotateY(-90deg);
    }
}

@keyframes flipPrev{
    0%{
        transform:rotateY(0deg);
    }
    100%{
        transform:rotateY(90deg);
    }
}

/* ===================================
   PAGE 33
   TAMIL MONTHS + AATHICHUDI
=================================== */

let currentAudio = null;
let currentButton = null;
let highlightTimers = [];


/* ==========================
   AUDIO TIMINGS
========================== */

const timings = {

    /* ---------- TITLE ---------- */

    "months.mp3":[0,1500],

    "aathichudi_title.mp3":[0,1000],


    /* ---------- MONTHS ---------- */

    "chithirai.mp3":[0,2000,3000,4000],

    "vaikasi.mp3":[0,2000,3000],

    "aani.mp3":[0,2000],

    "aadi.mp3":[0,2000],

    "aavani.mp3":[0,1800,2800],

    "purattasi.mp3":[0,2000,3000,4000,5000],

    "aippasi.mp3":[0,2000,3000,4000],

    "karthigai.mp3":[0,2000,3000,4000,5000],

    "margazhi.mp3":[0,2000,3000,4000],

    "theii.mp3":[0],

    "maasi.mp3":[0,2000],

    "panguni.mp3":[0,2000,3000,4000],


    /* ---------- AATHICHUDI ---------- */

    "aram.mp3":[0,1500,2500],

    "aaruvathu.mp3":[0,2500],

    "iyalvathu.mp3":[0,2500],

    "eevathu.mp3":[0,2500],

    "udaiyathu.mp3":[0,2500],

    "ookkamathu.mp3":[0,2500],

    "en_ezhuthu.mp3":[0,1600,2600],

    "erpathu.mp3":[0,2500],

    "aiyam.mp3":[0,1800,2800],

    "oppura.mp3":[0,2300],

    "othuvathu.mp3":[0,2500],

    "auviyam.mp3":[0,2000]

};


/* ==========================
   CLEAR HIGHLIGHTS
========================== */

function clearHighlights(button){

    if(!button) return;

    button.querySelectorAll(".highlight").forEach(word=>{

        word.classList.remove("active");

    });

}


/* ==========================
   CLEAR TIMERS
========================== */

function clearTimers(){

    highlightTimers.forEach(timer=>{

        clearTimeout(timer);

    });

    highlightTimers=[];

}


/* ==========================
   HIGHLIGHT WORDS
========================== */

function animateWords(button){

    clearTimers();

    clearHighlights(button);

    const words = button.querySelectorAll(".highlight");

    const audio = button.dataset.audio;

    const times = timings[audio];

    if(!times) return;

    times.forEach((time,index)=>{

        const timer = setTimeout(()=>{

            if(currentButton!==button) return;

            words.forEach(w=>{

                w.classList.remove("active");

            });

            if(words[index]){

                words[index].classList.add("active");

            }

        },time);

        highlightTimers.push(timer);

    });

}


/* ==========================
   STOP AUDIO
========================== */

function stopCurrent(){

    clearTimers();

    if(currentAudio){

        currentAudio.pause();

        currentAudio.currentTime=0;

        currentAudio=null;

    }

    if(currentButton){

        currentButton.classList.remove("active");

        clearHighlights(currentButton);

        currentButton=null;

    }

}


/* ==========================
   PLAY AUDIO
========================== */

document.querySelectorAll("[data-audio]").forEach(button=>{

    button.addEventListener("click",()=>{

        /* Click same button again = Stop */

        if(currentButton===button && currentAudio){

            stopCurrent();

            return;

        }

        stopCurrent();

        currentButton=button;

        currentAudio = new Audio(button.dataset.audio);

        button.classList.add("active");

        animateWords(button);

        currentAudio.play();

        currentAudio.onended=()=>{

            clearTimers();

            clearHighlights(button);

            button.classList.remove("active");

            currentAudio=null;

            currentButton=null;

        };

        currentAudio.onerror=()=>{

            console.log("Cannot load audio:",button.dataset.audio);

            stopCurrent();

        };

    });

}); 


const words = button.querySelectorAll(".highlight");

words.forEach(w=>w.classList.remove("active"));

if(timings[button.dataset.audio]){

    timings[button.dataset.audio].forEach((time,index)=>{

        setTimeout(()=>{

            words.forEach(w=>w.classList.remove("active"));

            if(words[index]){

                words[index].classList.add("active");

            }

        },time);

    });

}

/* ==========================
   SPACEBAR
========================== */

document.addEventListener("keydown",(e)=>{

    if(e.code!=="Space") return;

    e.preventDefault();

    if(!currentAudio) return;

    if(currentAudio.paused){

        currentAudio.play();

    }else{

        currentAudio.pause();

    }

});


/* ==========================
   ESC TO STOP
========================== */

document.addEventListener("keydown",(e)=>{

    if(e.key==="Escape"){

        stopCurrent();

    }

});


/* ==========================
   BEFORE UNLOAD
========================== */

window.addEventListener("beforeunload",()=>{

    stopCurrent();

});


/* ==========================
   PREVENT DOUBLE TAP ZOOM
========================== */

let lastTouchEnd=0;

document.addEventListener("touchend",(event)=>{

    const now=(new Date()).getTime();

    if(now-lastTouchEnd<=300){

        event.preventDefault();

    }

    lastTouchEnd=now;

},{passive:false});


/* ==========================
   KEYBOARD NAVIGATION
========================== */

const buttons=[...document.querySelectorAll("[data-audio]")];

buttons.forEach((btn,index)=>{

    btn.setAttribute("tabindex","0");

    btn.addEventListener("keydown",(e)=>{

        if(e.key==="ArrowDown"){

            e.preventDefault();

            if(buttons[index+1]){

                buttons[index+1].focus();

            }

        }

        if(e.key==="ArrowUp"){

            e.preventDefault();

            if(buttons[index-1]){

                buttons[index-1].focus();

            }

        }

        if(e.key==="Enter"){

            e.preventDefault();

            btn.click();

        }

    });

});


/* ==========================
   CLICK ANIMATION
========================== */

document.querySelectorAll(".speaker-btn").forEach(btn=>{

    btn.addEventListener("mousedown",()=>{

        btn.style.transform="scale(.96)";

    });

    btn.addEventListener("mouseup",()=>{

        btn.style.transform="";

    });

    btn.addEventListener("mouseleave",()=>{

        btn.style.transform="";

    });

    btn.addEventListener("touchstart",()=>{

        btn.style.transform="scale(.96)";

    },{passive:true});

    btn.addEventListener("touchend",()=>{

        btn.style.transform="";

    });

});


/* ==========================
   STOP AUDIO WHEN PAGE HIDES
========================== */

document.addEventListener("visibilitychange",()=>{

    if(document.hidden){

        stopCurrent();

    }

});


/* ==========================
   PAGE FLIP
========================== */

function nextPage(page,direction){

    stopCurrent();

    const app=document.querySelector(".app");

    app.classList.remove("flip-out-next","flip-out-prev");

    void app.offsetWidth;

    if(direction==="next"){

        app.classList.add("flip-out-next");

    }else{

        app.classList.add("flip-out-prev");

    }

    setTimeout(()=>{

        window.location.href=page;

    },600);

}


</script>
