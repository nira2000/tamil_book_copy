<!DOCTYPE html>
<html lang="ta">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAATHANGGAL</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: "Noto Sans Tamil", sans-serif;
    background: #111d66;

    display: flex;
    justify-content: center;
    align-items: flex-start;

    min-height: 100vh;

    overflow-x: hidden;

    padding: 18px;
}


/* =========================================================
   APP
========================================================= */

.app {
    width: 100%;
    max-width: 800px;

    display: flex;
    flex-direction: column;
    align-items: center;

    perspective: 1500px;
    transform-style: preserve-3d;
}


/* =========================================================
   BOOK
========================================================= */

.book {
    position: relative;

    width: min(800px, 100%);

    background: #f9f3e4;

    border-radius: 28px;

    padding: 24px 28px 14px;

    overflow: hidden;

    box-shadow:
        0 10px 30px rgba(0,0,0,.25);
}


/* =========================================================
   RED BOOK SPINE
========================================================= */

.book::before {
    content: "";

    position: absolute;

    left: 0;
    top: 12px;
    bottom: 12px;

    width: 7px;

    background: #d40c02;

    border-radius: 8px;
}


/* =========================================================
   TOP DECORATION
========================================================= */

.swirl {
    position: absolute;

    left: 14px;
    top: 12px;

    width: 80px;
    height: 80px;

    border: 6px solid #f2c94c;

    border-right-color: transparent;
    border-bottom-color: transparent;

    border-radius: 50%;

    transform: rotate(-20deg);

    opacity: .75;
}

.swirl::after {
    content: "";

    position: absolute;

    left: 14px;
    top: 14px;

    width: 38px;
    height: 38px;

    border: 5px solid #f2c94c;

    border-right-color: transparent;
    border-bottom-color: transparent;

    border-radius: 50%;
}


.curve-top {
    position: absolute;

    right: 25px;
    top: 15px;

    width: 90px;
    height: 35px;

    border-top: 7px solid #efa2aa;

    border-radius: 70px;

    transform: rotate(8deg);

    opacity: .8;
}


/* =========================================================
   CALENDAR STICKER
========================================================= */

.calendar-sticker {
    position: absolute;

    right: 22px;
    top: 390px;

    width: 95px;
    height: auto;

    z-index: 5;

    pointer-events: none;

    transform: rotate(3deg);
}


/* =========================================================
   TITLE
========================================================= */

.title {
    position: relative;

    width: fit-content;
    min-width: 420px;

    margin: 8px auto 22px;

    padding: 8px 46px 9px 38px;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #fff;

    color: #8e1e0c;

    font-size: 45px;
    font-weight: 800;

    border: 2px solid #d2d2d2;

    border-radius: 7px;

    box-shadow:
        0 4px 10px rgba(0,0,0,.16);

    cursor: pointer;

    transition: .25s;

    z-index: 6;
}

.title:hover {
    transform: translateY(-2px);
}

.title .speaker-icon {
    position: absolute;

    right: 10px;
    top: 50%;

    transform: translateY(-50%);

    font-size: 13px;
}


/* =========================================================
   MONTHS
========================================================= */

.months-wrapper {
    display: flex;

    justify-content: space-between;

    gap: 18px;

    margin-bottom: 18px;

    position: relative;

    z-index: 6;
}

.card {
    flex: 1;

    padding: 13px 15px;

    display: flex;
    flex-direction: column;

    gap: 5px;

    border-radius: 24px;
}

.pink {
    background: #f4ced7;
}

.yellow {
    background: #f7dfa0;
}


/* =========================================================
   MONTH BUTTONS
========================================================= */

.month-btn {
    position: relative;

    width: 100%;

    min-height: 35px;

    background: rgba(255,255,255,.18);

    border: 2px solid rgba(80,80,80,.30);

    border-radius: 12px;

    font-family: inherit;

    font-size: 20px;

    color: #111;

    padding: 3px 27px 3px 8px;

    cursor: pointer;

    display: flex;

    justify-content: center;
    align-items: center;

    line-height: 1.15;

    transition: .2s;
}

.month-btn:hover {
    background: rgba(255,255,255,.65);
}

.month-btn:active {
    transform: scale(.97);
}


/* =========================================================
   ACTIVE BUTTON
========================================================= */

.month-btn.active {
    background: rgba(255,255,255,.18);

    color: #111;

    border-color: rgba(80,80,80,.30);

    box-shadow: none;
}


/* =========================================================
   SPEAKER
========================================================= */

.speaker-icon {
    position: absolute;

    right: 7px;
    top: 50%;

    transform: translateY(-50%);

    font-size: 11px;

    opacity: .75;

    pointer-events: none;
}


/* =========================================================
   RED WORD HIGHLIGHT
========================================================= */

.highlight {
    background: transparent !important;

    color: inherit;

    font-weight: inherit;

    padding: 0;
    margin: 0;

    letter-spacing: 0;
    word-spacing: 0;

    transition: color .15s ease;
}

.highlight.active {
    background: transparent !important;

    color: #d32f2f !important;

    font-weight: 700;

    box-shadow: none;
}


/* =========================================================
   AATHICHUDI HEADER
========================================================= */

.aathichudi-header {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 13px;

    margin: 2px 0 10px;

    position: relative;

    z-index: 6;
}

.heading {
    position: relative;

    background: #f6b8c8;

    color: #8f1c0b;

    font-size: 31px;

    font-weight: 800;

    padding: 4px 25px;

    border-radius: 28px;

    border: 2px solid #e98fa8;

    box-shadow:
        inset 0 3px 0 rgba(255,255,255,.5),
        0 2px 5px rgba(0,0,0,.12);

    cursor: pointer;

    font-family: inherit;

    line-height: 1.25;
}


/* =========================================================
   DECORATIVE LINES
========================================================= */

.line {
    position: relative;

    width: 42px;
    height: 5px;

    background: #000;

    border-radius: 10px;
}

.line::before,
.line::after {
    content: "";

    position: absolute;

    width: 32px;
    height: 5px;

    background: #000;

    border-radius: 10px;
}

.left::before {
    top: -10px;
    left: 0;

    transform: rotate(25deg);
}

.left::after {
    top: 10px;
    left: 0;

    transform: rotate(-25deg);
}

.right::before {
    top: -10px;
    right: 0;

    transform: rotate(-25deg);
}

.right::after {
    top: 10px;
    right: 0;

    transform: rotate(25deg);
}


/* =========================================================
   AATHICHUDI CARD
========================================================= */

.aathichudi-card {
    background: #bce8ae;

    border-radius: 27px;

    padding: 13px 17px;

    display: flex;

    gap: 15px;

    position: relative;

    z-index: 6;
}

.column {
    flex: 1;

    display: flex;

    flex-direction: column;

    gap: 5px;
}


/* =========================================================
   AATHICHUDI BUTTONS
========================================================= */

.rule-btn {
    position: relative;

    width: 100%;

    background: rgba(255,255,255,.20);

    border: 2px solid rgba(80,80,80,.30);

    border-radius: 12px;

    text-align: left;

    font-family: inherit;

    font-size: 20px;

    line-height: 1.28;

    padding: 4px 30px 4px 8px;

    cursor: pointer;

    color: #111;

    transition: .2s;
}

.rule-btn:hover {
    background: rgba(255,255,255,.55);

    transform: translateX(3px);
}

.rule-btn:active {
    transform: scale(.97);
}

.rule-btn.active {
    background: rgba(255,255,255,.20);

    color: #111;

    border-color: rgba(80,80,80,.30);

    box-shadow: none;
}


/* =========================================================
   STAR
========================================================= */

.rule-btn .star {
    color: #8da51b;

    font-size: 22px;

    margin-right: 3px;

    display: inline-block;
}


/* =========================================================
   PAGE NUMBER
========================================================= */

.page-number {
    margin-top: 8px;

    text-align: center;

    font-size: 20px;

    font-weight: 800;

    color: #805bd2;

    position: relative;

    z-index: 6;
}


/* =========================================================
   NAVIGATION
========================================================= */

.navigation {
    width: 100%;

    margin-top: 14px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 0 5px;
}

.nav-btn {
    width: 46px;
    height: 46px;

    border: none;

    border-radius: 50%;

    background: #f9f3e4;

    font-size: 25px;

    cursor: pointer;

    box-shadow:
        0 4px 12px rgba(0,0,0,.18);

    transition: .2s;
}

.nav-btn:hover {
    transform: scale(1.08);
}

.nav-btn:active {
    transform: scale(.94);
}

.dots {
    display: flex;

    gap: 7px;
}

.dot {
    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #9fa9a8;
}

.dot.active {
    background: #19d400;
}


/* =========================================================
   PAGE FLIP
========================================================= */

.flip-out-next {
    animation: flipNext .6s ease forwards;

    transform-origin: left center;
}

.flip-out-prev {
    animation: flipPrev .6s ease forwards;

    transform-origin: right center;
}

@keyframes flipNext {

    0% {
        transform: rotateY(0deg);
    }

    100% {
        transform: rotateY(-90deg);
    }

}

@keyframes flipPrev {

    0% {
        transform: rotateY(0deg);
    }

    100% {
        transform: rotateY(90deg);
    }

}




/* =========================================================
   MOBILE ONLY
   DESKTOP IS NOT TOUCHED
   NO SCROLLING
========================================================= */

@media (max-width: 768px) {

    /* ==============================
       SCREEN
    ============================== */

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;

        overflow: hidden;
        overscroll-behavior: none;
    }

    body {
        height: 100dvh;
        min-height: 100dvh;

        display: flex;
        justify-content: center;
        align-items: stretch;

        background: #111d66;
    }


    /* ==============================
       APP
    ============================== */

    .app {
        width: 100%;
        max-width: 520px;

        height: 100dvh;
        min-height: 0;

        margin: 0 auto;
        padding: 4px 7px;

        display: flex;
        flex-direction: column;
        align-items: center;

        gap: 3px;

        overflow: hidden;
    }


    /* ==============================
       BOOK
    ============================== */

    .book {
        width: 100%;

        flex: 1 1 auto;
        min-height: 0;

        margin: 0;

        padding:
            6px
            8px
            3px
            11px;

        border-radius: 17px;

        overflow: hidden;

        display: flex;
        flex-direction: column;
    }


    /* ==============================
       RED SPINE
    ============================== */

    .book::before {
        width: 6px;

        left: 0;
        top: 9px;
        bottom: 9px;

        border-radius: 6px;
    }


    /* ==============================
       DECORATIONS
    ============================== */

    .swirl {
        left: -8px;
        top: -8px;

        transform: scale(.42);
        transform-origin: top left;

        z-index: 2;
    }

    .curve-top {
        right: -7px;
        top: 3px;

        transform: scale(.52);
        transform-origin: top right;

        z-index: 2;
    }

    .calendar-sticker {
        right: -8px;
        top: 285px;

        width: 58px;

        transform: rotate(3deg);

        z-index: 8;
    }


    /* ==============================
       TITLE
    ============================== */

    .title {
        position: relative;

        width: 100%;
        max-width: 100%;
        min-width: 0;

        flex: 0 0 auto;

        margin: 3px auto 7px;

        padding: 6px 28px 6px 10px;

        display: flex;
        justify-content: center;
        align-items: center;

        text-align: center;

        font-size: clamp(21px, 6.2vw, 29px);
        line-height: 1.15;

        border-radius: 10px;

        z-index: 10;
    }


    .title .speaker-icon {
        right: 7px;
        font-size: 9px;
    }


    /* ==============================
       MONTHS AREA
    ============================== */

    .months-wrapper {
        width: 100%;

        flex: 0 0 auto;

        display: flex;

        gap: clamp(6px, 2vw, 9px);

        margin-bottom: 7px;

        position: relative;

        z-index: 10;
    }


    /* ==============================
       MONTH CARDS
    ============================== */

    .card {
        flex: 1;

        min-width: 0;

        padding:
            6px
            7px;

        gap: 4px;

        border-radius: 15px;
    }


    /* ==============================
       MONTH BUTTONS
    ============================== */

    .month-btn {
        width: 100%;

        height: clamp(25px, 6vw, 30px);

        padding:
            1px
            22px
            1px
            4px;

        font-size: clamp(12px, 3.5vw, 16px);

        line-height: 1;

        border-width: 1.5px;
        border-radius: 9px;

        display: flex;
        align-items: center;
        justify-content: center;

        white-space: nowrap;
    }

    .month-btn .speaker-icon {
        right: 4px;
        font-size: 8px;
    }


    /* ==============================
       AATHICHUDI HEADER
    ============================== */

    .aathichudi-header {
        width: 100%;

        flex: 0 0 auto;

        display: flex;
        justify-content: center;
        align-items: center;

        gap: 7px;

        margin-bottom: 6px;

        position: relative;

        z-index: 10;
    }


    /* ==============================
       SIDE LINES
    ============================== */

    .line {
        width: 23px;
        height: 3px;

        flex: 0 0 23px;
    }

    .line::before,
    .line::after {
        width: 16px;
        height: 3px;
    }

    .left::before {
        top: -6px;
    }

    .left::after {
        top: 6px;
    }

    .right::before {
        top: -6px;
    }

    .right::after {
        top: 6px;
    }


    /* ==============================
       AATHICHUDI TITLE
    ============================== */

    .heading {
        flex: 0 0 auto;

        font-size: clamp(19px, 5.8vw, 25px);

        line-height: 1.1;

        padding:
            5px
            15px;

        border-radius: 22px;

        white-space: nowrap;
    }

    .heading .speaker-icon {
        right: 5px;
        font-size: 8px;
    }


    /* ==============================
       GREEN AATHICHUDI CARD

       THIS NOW USES THE EMPTY
       SPACE AT THE BOTTOM
    ============================== */

    .aathichudi-card {
        width: 100%;

        /*
           IMPORTANT:
           Allow the green section to expand
           and fill the remaining book space.
        */
        flex: 1 1 auto;

        min-height: 0;

        padding:
            7px
            8px;

        gap: 6px;

        border-radius: 16px;

        overflow: hidden;

        position: relative;

        z-index: 7;

        display: flex;
    }


    /* ==============================
       GREEN COLUMNS
    ============================== */

    .aathichudi-card .column {
        flex: 1 1 0;

        min-width: 0;
        min-height: 0;

        display: flex;
        flex-direction: column;

        /*
           Distribute the buttons vertically
           throughout the available green area.
        */
        justify-content: space-between;

        gap: 5px;
    }


    /* ==============================
       GREEN BUTTONS
    ============================== */

    .aathichudi-card .rule-btn {
        width: 100%;

        flex: 0 0 auto;

        height: clamp(27px, 6.8vw, 33px);

        min-height: 27px;

        padding:
            1px
            21px
            1px
            4px;

        font-size: clamp(10.5px, 3.1vw, 14px);

        line-height: 1;

        border-width: 1.5px;

        border-radius: 8px;

        white-space: nowrap;

        overflow: hidden;

        display: flex;
        align-items: center;

        text-align: left;
    }

    .aathichudi-card .rule-btn .star {
        flex: 0 0 auto;

        font-size: clamp(10px, 2.9vw, 13px);

        margin-right: 3px;
    }

    .aathichudi-card .rule-btn .speaker-icon {
        right: 4px;
        font-size: 7px;
    }


    /* ==============================
       PAGE NUMBER
       STAYS AT THE BOTTOM
    ============================== */

    .page-number {
        width: 100%;

        flex: 0 0 auto;

        /*
           Keeps page number at the
           bottom of the book.
        */
        margin:
            4px
            0
            0;

        padding: 0;

        text-align: center;

        font-size: 14px;
        line-height: 1.1;

        z-index: 10;
    }


    /* ==============================
       NAVIGATION
    ============================== */

    .navigation {
        width: 100%;

        flex: 0 0 38px;

        height: 38px;
        min-height: 38px;

        margin: 0;

        padding:
            0
            2px
            1px;

        display: flex;
        justify-content: space-between;
        align-items: center;

        overflow: hidden;
    }


    /* ==============================
       NAV BUTTONS
    ============================== */

    .nav-btn {
        width: 34px;
        height: 34px;

        min-width: 34px;
        min-height: 34px;

        font-size: 18px;

        flex: 0 0 34px;
    }


    /* ==============================
       DOTS
    ============================== */

    .dots {
        display: flex;

        gap: 5px;

        align-items: center;
        justify-content: center;
    }

    .dot {
        width: 7px;
        height: 7px;
    }


    /* ==============================
       TOUCH DEVICES
    ============================== */

    .title:hover,
    .month-btn:hover,
    .rule-btn:hover,
    .nav-btn:hover {
        transform: none;
    }
}


</style>

</head>


<body>

<script src="pin-protection.js"></script>

<div class="book">

    <!-- DECORATIONS -->

    <div class="swirl"></div>
    <div class="curve-top"></div>

    <img src="calendar.png" class="calendar-sticker" alt="">


    <!-- =====================================================

    ====================================================== -->

    <button class="title speaker-btn"

        <span class="highlight">தமிழ்</span>

    <div class="months-wrapper">


        <!-- LEFT / PINK -->

        <div class="card pink">

                <span class="highlight">சித்</span>

                <span class="speaker-icon">🔊</span>

            </button>

            <button class="month-btn speaker-btn"

                <span class="highlight">கை</span>

                <span class="speaker-icon">🔊</span>

            </button>


            <button class="month-btn speaker-btn"
                    data-audio="margazhi.mp3">

                <span class="highlight">மார்</span>
                <span class="highlight">க</span>
                <span class="highlight">ழி</span>

                <span class="speaker-icon">🔊</span>

            </button>


            <button class="month-btn speaker-btn"
                    data-audio="theii.mp3">

                <span class="highlight">தை</span>

                <span class="speaker-icon">🔊</span>

            </button>


            <button class="month-btn speaker-btn"
                    data-audio="maasi.mp3">

                <span class="highlight">மா</span>
                <span class="highlight">சி</span>

                <span class="speaker-icon">🔊</span>

            </button>


            <button class="month-btn speaker-btn"
                    data-audio="panguni.mp3">

                <span class="highlight">பங்</span>
                <span class="highlight">கு</span>
                <span class="highlight">னி</span>

                <span class="speaker-icon">🔊</span>

            </button>


        </div>

    </div>



    <!-- =====================================================
         AATHICHUDI HEADER
    ====================================================== -->

    <div class="aathichudi-header">

        <div class="line left"></div>


        <button class="heading speaker-btn"
                data-audio="aathichudi_title.mp3">

            <span class="highlight">ஆத்தி</span>
            <span class="highlight">சூடி</span>

            <span class="speaker-icon">🔊</span>

        </button>


        <div class="line right"></div>

    </div>



    <!-- =====================================================
         AATHICHUDI
    ====================================================== -->

    <div class="aathichudi-card">


        <!-- LEFT COLUMN -->

<script>

/* =========================================================
   AUDIO
========================================================= */

let currentAudio = null;
let currentButton = null;
let highlightTimers = [];


/* =========================================================
   AUDIO TIMINGS
========================================================= */

const timings = {

    "months.mp3":[0,1500],

    "aathichudi_title.mp3":[0,1000],

    "chithirai.mp3":[0,2000,3000,4000],

    "vaikasi.mp3":[0,2000,3000],

    "aani.mp3":[0,2000],

    "aadi.mp3":[0,2000],

    "aavani.mp3":[0,1800,2800],

    "purattasi.mp3":[0,2000,3000,4000,5000],

    "aippasi.mp3":[0,2000,3000,4000],

    "karthigai.mp3":[0,2000,3000,4000,5000],

    "margazhi.mp3":[0,2000,3000,4000],

    "theii.mp3":[0],

    "maasi.mp3":[0,2000],

    "panguni.mp3":[0,2000,3000,4000],

    "aram.mp3":[0,1500,2500],

    "aaruvathu.mp3":[0,2500],

    "iyalvathu.mp3":[0,2500],

    "eevathu.mp3":[0,2500],

    "udaiyathu.mp3":[0,2500],

    "ookkamathu.mp3":[0,2500],

    "en_ezhuthu.mp3":[0,1600,2600],

    "erpathu.mp3":[0,2500],

    "aiyam.mp3":[0,1800,2800],

    "oppura.mp3":[0,2300],

    "othuvathu.mp3":[0,2500],

    "auviyam.mp3":[0,2000]

};


/* =========================================================
   CLEAR HIGHLIGHTS
========================================================= */

function clearHighlights(button) {

    if (!button) return;

    button.querySelectorAll(".highlight").forEach(word => {

        word.classList.remove("active");

    });

}


/* =========================================================
   CLEAR TIMERS
========================================================= */

function clearTimers() {

    highlightTimers.forEach(timer => {

        clearTimeout(timer);

    });

    highlightTimers = [];

}


/* =========================================================
   ANIMATE WORDS
========================================================= */

function animateWords(button) {

    clearTimers();

    clearHighlights(button);

    const words =
        button.querySelectorAll(".highlight");

    const audio =
        button.dataset.audio;

    const times =
        timings[audio];

    if (!times) return;


    times.forEach((time,index) => {

        const timer = setTimeout(() => {

            if (currentButton !== button) return;

            words.forEach(word => {

                word.classList.remove("active");

            });


            if (words[index]) {

                words[index].classList.add("active");

            }

        },time);


        highlightTimers.push(timer);

    });

}


/* =========================================================
   STOP CURRENT AUDIO
========================================================= */

function stopCurrent() {

    clearTimers();


    if (currentAudio) {

        currentAudio.pause();

        currentAudio.currentTime = 0;

        currentAudio = null;

    }


    if (currentButton) {

        currentButton.classList.remove("active");

        clearHighlights(currentButton);

        currentButton = null;

    }

}


/* =========================================================
   PLAY AUDIO
========================================================= */

document.querySelectorAll("[data-audio]").forEach(button => {

    button.addEventListener("click", () => {


        /* SAME BUTTON = STOP */

        if (
            currentButton === button &&
            currentAudio
        ) {

            stopCurrent();

            return;

        }


        stopCurrent();


        currentButton = button;

        currentAudio =
            new Audio(button.dataset.audio);


        button.classList.add("active");


        animateWords(button);


        currentAudio.play().catch(() => {

            console.log(
                "Audio playback was blocked:",
                button.dataset.audio
            );

        });


        currentAudio.onended = () => {

            clearTimers();

            clearHighlights(button);

            button.classList.remove("active");

            currentAudio = null;

            currentButton = null;

        };


        currentAudio.onerror = () => {

            console.log(
                "Cannot load audio:",
                button.dataset.audio
            );

            stopCurrent();

        };

    });

});


/* =========================================================
   SPACEBAR
========================================================= */

document.addEventListener("keydown", e => {

    if (e.code !== "Space") return;

    e.preventDefault();

    if (!currentAudio) return;


    if (currentAudio.paused) {

        currentAudio.play();

    } else {

        currentAudio.pause();

    }

});


/* =========================================================
   ESC = STOP
========================================================= */

document.addEventListener("keydown", e => {

    if (e.key === "Escape") {

        stopCurrent();

    }

});


/* =========================================================
   BEFORE UNLOAD
========================================================= */

window.addEventListener("beforeunload", () => {

    stopCurrent();

});


/* =========================================================
   PREVENT DOUBLE TAP ZOOM
========================================================= */

let lastTouchEnd = 0;

document.addEventListener(
    "touchend",
    event => {

        const now =
            new Date().getTime();

        if (
            now - lastTouchEnd <= 300
        ) {

            event.preventDefault();

        }

        lastTouchEnd = now;

    },
    {passive:false}
);


/* =========================================================
   KEYBOARD NAVIGATION
========================================================= */

const buttons = [
    ...document.querySelectorAll("[data-audio]")
];


buttons.forEach((btn,index) => {

    btn.setAttribute("tabindex","0");


    btn.addEventListener("keydown", e => {


        if (e.key === "ArrowDown") {

            e.preventDefault();

            if (buttons[index + 1]) {

                buttons[index + 1].focus();

            }

        }


        if (e.key === "ArrowUp") {

            e.preventDefault();

            if (buttons[index - 1]) {

                buttons[index - 1].focus();

            }

        }


        if (e.key === "Enter") {

            e.preventDefault();

            btn.click();

        }

    });

});


/* =========================================================
   CLICK ANIMATION
========================================================= */

document.querySelectorAll(".speaker-btn")
.forEach(btn => {


    btn.addEventListener("mousedown", () => {

        btn.style.transform = "scale(.96)";

    });


    btn.addEventListener("mouseup", () => {

        btn.style.transform = "";

    });


    btn.addEventListener("mouseleave", () => {

        btn.style.transform = "";

    });


    btn.addEventListener(
        "touchstart",
        () => {

            btn.style.transform =
                "scale(.96)";

        },
        {passive:true}
    );


    btn.addEventListener(
        "touchend",
        () => {

            btn.style.transform = "";

        }
    );

});


/* =========================================================
   STOP AUDIO WHEN PAGE HIDDEN
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (document.hidden) {

            stopCurrent();

        }

    }
);


/* =========================================================
   PAGE FLIP
========================================================= */

function nextPage(page,direction) {

    stopCurrent();


    const app =
        document.querySelector(".app");


    app.classList.remove(
        "flip-out-next",
        "flip-out-prev"
    );


    void app.offsetWidth;


    if (direction === "next") {

        app.classList.add(
            "flip-out-next"
        );

    } else {

        app.classList.add(
            "flip-out-prev"
        );

    }


    setTimeout(() => {

        window.location.href = page;

    },600);

}

</script>
