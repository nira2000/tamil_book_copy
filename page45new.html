/* ===========================================
   PAGE 45 - TAMIL DIGITAL BOOK
=========================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Noto Sans Tamil',sans-serif;
    background:#1b2c73;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

/* ========================================= */

/* ===========================================
   PAGE CONTAINER
=========================================== */

.page-container{

    position:relative;

    width:100%;
    max-width:900px;

    background:#fffef8;

    border:8px solid #f2d8a0;

    border-radius:30px;

    padding:30px 35px;

    box-shadow:0 10px 25px rgba(0,0,0,.15);

}

/* RED SPINE */

.page-container::before{

    content:"";

    position:absolute;

    left:10px;

    top:22px;

    bottom:22px;

    width:10px;

    background:#D40C02;

    border-radius:8px;

}

/* ===========================================
   LESSON
=========================================== */

.lesson-number{

    font-size:26px;

    font-weight:700;

    margin-bottom:10px;

}

/* ===========================================
   TITLE
=========================================== */

.title-box{

    width:fit-content;

    margin:0 auto 30px;

    padding:10px 24px;

    background:#fff3c9;

    border:3px solid #d6a54f;

    border-radius:14px;

}

.title-box h1{

    font-size:42px;

    font-weight:700;

}

/* ===========================================
   WORD GRID
=========================================== */

.word-grid{
    display:grid;
    grid-template-columns:repeat(3,220px);
    justify-content:center;
    column-gap:45px;
    row-gap:8px;
}

/* ===========================================
   BUTTONS
=========================================== */

.word-btn{

    width:220px;

    height:62px;

    border:none;

    border-radius:10px;

    font-family:'Noto Sans Tamil',sans-serif;

    font-size:24px;

    font-weight:600;

    cursor:pointer;

    border:2px solid rgba(0,0,0,.18);

    box-shadow:0 4px 8px rgba(0,0,0,.12);

    transition:.25s;

}

.word-btn:hover{

    transform:translateY(-2px);

}

/* ===========================================
   COLOURS
=========================================== */

.green{

    background:#7fd567;

}

.green-light{

    background:#b8f762;

}

.yellow{

    background:#ffef9c;

}

.blue{

    background:#64d2e5;

}

.orange{

}


/* ===========================
   COLOUR GROUP SPACING
=========================== */


/* Gap before YELLOW section */

/* ===========================================
   NAVIGATION

.navigation{

    align-items:center;

}

.nav-btn{

.nav-btn:hover{

<script>
    

const buttons = document.querySelectorAll(".word-btn");

let currentAudio = null;
let currentButton = null;
let timers = [];




const timings = {

    // ==========================
    // GREEN
    // ==========================

    "45audiogreen1.mp3":[0,1200],              // த | டி

    "45audiogreen2.mp3":[0,2000,3000],          // ப | ட் | டு

    "45audiogreen3.mp3":[0,2000,3000],          // ம | ட | ம்

    "45audiogreen4.mp3":[0,2000],             // தா | டி

    "45audiogreen5.mp3":[0,1800,2500],         // பா | ட் | டி

    "45audiogreen6.mp3":[0,1000,2500],         // மா | ட | ம்

    "45audiogreen7.mp3":[0,2000,3000],         // தி | க | தி

    "45audiogreen8.mp3":[0,2000],              // பி | தா

    "45audiogreen9.mp3":[0,2000,3000,4000],    // மி | டு | க் | கு

    "45audiogreen10.mp3":[0,2000],             // தீ | மை

    "45audiogreen11.mp3":[0,2500],             // பீ | மா

    "45audiogreen12.mp3":[0,2000],             // மீ | சை


    "45audiogreen13.mp3":[0,2000,3000,4000],

    "45audiogreen14.mp3":[0,2000,3000],

    "45audiogreen15.mp3":[0,2000,3000],

    "45audiogreen16.mp3":[0,2000,3000,4000],

    "45audiogreen17.mp3":[0,2000,3000],

    "45audiogreen18.mp3":[0,2000,3000],






    // ==========================
    // YELLOW
    // ==========================

    "45audioyellow1.mp3":[0,2000,3000,4000],   // தெ |ப் | ப | ம்

    "45audioyellow2.mp3":[0,2000,3000],        // பெ |ட் | டி

    "45audioyellow3.mp3":[0,2000,3000],        // மெ |ட் | டி

    "45audioyellow4.mp3":[0,2000,3000],        // தே | ச | ம்

    "45audioyellow5.mp3":[0,2000,3000],        // பே |த் | தி

    "45audioyellow6.mp3":[0,2000],             // மே | தை

    "45audioyellow7.mp3":[0,2000],             // க | தை

    "45audioyellow8.mp3":[0,2000],             // ச | பை

    "45audioyellow9.mp3":[0,2000],             // சு | மை



    // ==========================
    // BLUE
    // ==========================

    "45audioblue1.mp3":[0,2000,3000],          // தொ |ட் | டி

    "45audioblue2.mp3":[0,2000,3000],          // பொ |ட் | டி

    "45audioblue3.mp3":[0,2000,3000],          // மொ |ட் | டை

    "45audioblue4.mp3":[0,2000],               // தோ | டு

    "45audioblue5.mp3":[0,2000,3000],          // போ |ட் | டி

    "45audioblue6.mp3":[0,2000,4000,5000],     // மோ | த | க | ம்

    "45audioblue7.mp3":[0],                   // தெள...

    "45audioblue8.mp3":[0,2000,3000,4000],     // பெள |த் | த | ம்

    "45audioblue9.mp3":[0],                   // மொ...



    // ==========================
    // ORANGE
    // ==========================

    "45audiored1.mp3":[0,2000,3000],           // தா |த் | தா

    "45audiored2.mp3":[0,2000,3000],           // பா |ப் | பா

    "45audiored3.mp3":[0,1500,2500]            // பொ |ம் | மை

};


// ===========================================
// LETTER HIGHLIGHT
// ===========================================

function clearHighlight(button){

    if(!button) return;

    button.querySelectorAll("span").forEach(span=>{

        span.classList.remove("active");

    });

}


function animateLetters(button,audioFile,duration){

    clearHighlight(button);

    timers.forEach(timer=>clearTimeout(timer));

    timers=[];

    const letters=button.querySelectorAll("span");

    if(letters.length===0) return;

    // ===========================================
    // CUSTOM TIMINGS
    // ===========================================

    if(timings[audioFile]){

        timings[audioFile].forEach((time,index)=>{

            if(index>=letters.length) return;

            const timer=setTimeout(()=>{

                letters.forEach(l=>l.classList.remove("active"));

                letters[index].classList.add("active");

            },time);

            timers.push(timer);

        });

    }

    // ===========================================
    // AUTOMATIC (if no custom timing exists)
    // ===========================================

    else{

        const delay=duration/letters.length;

        letters.forEach((letter,index)=>{

            const timer=setTimeout(()=>{

                letters.forEach(l=>l.classList.remove("active"));

                letter.classList.add("active");

            },index*delay);

            timers.push(timer);

        });

    }

}


// ===========================================
// BUTTON CLICK
// ===========================================

buttons.forEach(button=>{

    button.addEventListener("click",function(){

        const audioFile=this.dataset.audio;

        // Stop same audio
        if(
            currentAudio &&
            currentButton===this &&
            !currentAudio.paused
        ){

            currentAudio.pause();
            currentAudio.currentTime=0;

            this.classList.remove("playing");

            clearHighlight(this);

            timers.forEach(timer=>clearTimeout(timer));

            timers=[];

            currentAudio=null;
            currentButton=null;

            return;

        }

        // Stop previous audio
        if(currentAudio){

            currentAudio.pause();
            currentAudio.currentTime=0;

        }

        // Remove old highlights
        buttons.forEach(btn=>{

            btn.classList.remove("playing");

            clearHighlight(btn);

        });

        timers.forEach(timer=>clearTimeout(timer));

        timers=[];

        // New audio
        currentAudio=new Audio(audioFile);

        currentButton=this;

        this.classList.add("playing");

        currentAudio.onloadedmetadata=()=>{

            animateLetters(
                this,
                audioFile,
                currentAudio.duration*1000
            );

        };



        currentAudio.play();

        // Audio finished
        currentAudio.onended=()=>{

            this.classList.remove("playing");

            clearHighlight(this);

            timers.forEach(timer=>clearTimeout(timer));

            timers=[];

            currentAudio=null;
            currentButton=null;

        };

        // Audio error
        currentAudio.onerror=()=>{

            alert("Audio file not found:\n"+audioFile);

            this.classList.remove("playing");

            clearHighlight(this);

            timers.forEach(timer=>clearTimeout(timer));

            timers=[];

            currentAudio=null;
            currentButton=null;

        };

    });

});

// ===========================================
// KEYBOARD STOP
// ===========================================

document.addEventListener("keydown",function(e){

    if(e.code==="Space"){

        if(currentAudio){

            currentAudio.pause();
            currentAudio.currentTime=0;

            if(currentButton){

                currentButton.classList.remove("playing");

                clearHighlight(currentButton);

            }

            timers.forEach(timer=>clearTimeout(timer));

            timers=[];

            currentAudio=null;
            currentButton=null;

        }

    }

});

// ===========================================
// PAGE NAVIGATION
// ===========================================

function nextPage(page,direction){

    const book=document.querySelector(".container");

    if(direction==="next"){

        book.classList.add("flip-out-next");

    }else{

        book.classList.add("flip-out-prev");

    }

    setTimeout(()=>{

        window.location.href=page;

    },600);

}




</script>
</div>
