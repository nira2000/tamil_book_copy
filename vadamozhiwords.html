<!DOCTYPE html>
<html lang="ta">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VADAMOZHI WORDS</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

/* ===========================
   RESET
=========================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:"Noto Sans Tamil",sans-serif;
    background:#111D66;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
    perspective:1500px;
}


/* ===========================
   APP / BOOK
=========================== */

.app{
    width:100%;
    max-width:950px;
}

.header{
    color:white;
    text-align:center;
    font-size:15px;
    font-weight:bold;
    margin-bottom:6px;
    text-shadow:
        0 0 8px white,
        0 0 15px #4FC3F7;
}

.book{
    position:relative;
    background:#F8F1E4;
    border-radius:28px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.book::before{
    content:"";
    position:absolute;
    left:-10px;
    top:25px;
    bottom:25px;
    width:18px;
    background:#D40C02;
    border-radius:12px;
}

.book-content{
    display:flex;
    justify-content:center;
    align-items:flex-start;
}

.page{
    width:900px;
    min-height:1270px;
    position:relative;
    overflow:hidden;
    padding:25px 35px 25px;
    background:#8FD5EE;
    color:#000;
}


/* ===========================
   TOP-LEFT SPIRAL
=========================== */

.page::before{
    content:"";
    position:absolute;
    width:250px;
    height:250px;
    left:-145px;
    top:-75px;
    border:22px solid rgba(68,126,190,.48);
    border-radius:50%;
    box-shadow:
        42px 18px 0 -5px rgba(68,126,190,.48),
        78px 42px 0 -10px rgba(68,126,190,.48),
        105px 68px 0 -15px rgba(68,126,190,.48);
    z-index:0;
    pointer-events:none;
}


/* ===========================
   BOTTOM-RIGHT SWIRL
=========================== */

.page::after{
    content:"";
    position:absolute;
    width:155px;
    height:155px;
    right:-80px;
    bottom:-65px;
    border:10px solid rgba(75,177,255,.55);
    border-radius:48% 52% 48% 52%;
    transform:rotate(-35deg);
    box-shadow:
        -22px 10px 0 -2px rgba(75,177,255,.55),
        -42px 23px 0 -4px rgba(75,177,255,.55),
        -62px 37px 0 -6px rgba(75,177,255,.55);
    z-index:0;
    pointer-events:none;
}


/* ===========================
   TITLE SPEECH BUBBLE
=========================== */

.title{
    position:relative;
    z-index:2;

    width:390px;
    min-height:150px;

    margin:0 auto 28px;

    background:#FFF7D8;

    border:7px solid #0757B8;
    border-radius:58% 48% 55% 45% / 55% 52% 48% 45%;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:18px 35px 24px;

    font-size:42px;
    line-height:1.25;
    font-weight:700;
    text-align:center;

    color:#000;

    box-shadow:10px 8px 0 #0757B8;
}


/* speech bubble tail */

.title::after{
    content:"";
    position:absolute;
    left:22px;
    bottom:-24px;
    width:48px;
    height:38px;
    background:#FFF7D8;
    border-left:7px solid #0757B8;
    border-bottom:7px solid #0757B8;
    transform:skewX(-28deg) rotate(-18deg);
    border-radius:0 0 0 16px;
}


/* pink decorative stroke */

.title::before{
    content:"";
    position:absolute;
    inset:-18px -18px -28px -18px;
    border:5px solid #F23D9A;
    border-right-color:transparent;
    border-bottom-color:transparent;
    border-radius:55% 45% 50% 60%;
    transform:rotate(4deg);
    z-index:-1;
}


/* ===========================
   ORANGE DECORATIVE MARKS
=========================== */

.star1,
.star2,
.star3,
.star4{
    position:absolute;
    z-index:3;
    color:#FF9D00;
    font-size:42px;
    font-family:Arial,sans-serif;
}

.star1{
    top:20px;
    left:245px;
}

.star2{
    top:45px;
    left:220px;
}

.star3{
    top:85px;
    right:205px;
}

.star4{
    top:55px;
    right:180px;
}


/* ===========================
   OLD CORNER IMAGE HIDDEN
=========================== */

.corner{
    display:none;
}


/* ===========================
   GRID
=========================== */

.grid{
    position:relative;
    z-index:2;

    width:100%;

    display:grid;
    grid-template-columns:repeat(3,1fr);

    border:2px solid #111;
    background:#8FD5EE;
}


/* ===========================
   CARD
=========================== */

.card{
    height:260px;

    border-right:2px solid #111;
    border-bottom:2px solid #111;

    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;

    padding:18px 10px 18px;

    background:#8FD5EE;
}

.card:nth-child(3n){
    border-right:none;
}

.card:nth-last-child(-n+3){
    border-bottom:none;
}


/* ===========================
   IMAGE
=========================== */

.card img{
    width:170px;
    height:155px;

    object-fit:contain;

    user-select:none;
    pointer-events:none;
}


/* ===========================
   WORD BUTTON
=========================== */

.word{
    width:205px;
    min-height:55px;

    border:3px solid #111;
    border-radius:5px;

    background:#8FD5EE;

    font-size:29px;
    line-height:1;

    font-weight:700;

    display:flex;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    transition:.2s;

    padding:5px 30px;

    position:relative;
}

.word:hover{
    background:#A7E0F3;
    transform:translateY(-2px);
}

.word:active{
    transform:scale(.96);
    background:#7CC8E5;
}


/* ===========================
   LETTER HIGHLIGHT
=========================== */

.letter{
    display:inline;
    padding:0;
    margin:0;
    border-radius:3px;
    transition:.2s;
}

.letter.active{
    color:#D50000;
    font-weight:700;
}


/* ===========================
   SPEAKER
=========================== */

.speaker{
    position:relative;
}

.speaker::after{
    content:"🔊";
    position:absolute;
    top:3px;
    right:5px;
    font-size:14px;
    pointer-events:none;
}

/* ===========================
   SMALLER SPECIFIC WORDS ONLY
=========================== */

.word[data-audio="tajmahal.mp3"],
.word[data-audio="krismas.mp3"],
.word[data-audio="hanuman.mp3"],
.word[data-audio="krishna.mp3"]{
    font-size:22px;
}

.word-space{
    display:inline;
    width:10px;
}

/* ===========================
   PAGE NUMBER
=========================== */

.page-number{
    position:relative;
    z-index:5;

    margin-top:8px;

    text-align:center;

    font-size:25px;
    line-height:1;

    color:#23498B;
    font-weight:700;
}


/* ===========================
   NAVIGATION
=========================== */

.navigation{
    margin-top:20px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.nav-btn{
    width:65px;
    height:65px;

    border:none;
    border-radius:50%;

    background:#F8F1E4;

    font-size:30px;

    cursor:pointer;

    box-shadow:0 5px 15px rgba(0,0,0,.25);

    transition:.3s;
}

.nav-btn:hover{
    transform:scale(1.08);
}

.dots{
    display:flex;
    gap:10px;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#999;
}

.dot.active{
    background:#00ff40;
}


/* ===========================
   FLIP
=========================== */

.flip-out-next{
    animation:flipNext .6s ease forwards;
    transform-origin:left center;
}

.flip-out-prev{
    animation:flipPrev .6s ease forwards;
    transform-origin:right center;
}

@keyframes flipNext{
    from{
        transform:rotateY(0deg);
        opacity:1;
    }
    to{
        transform:rotateY(-120deg);
        opacity:0;
    }
}

@keyframes flipPrev{
    from{
        transform:rotateY(0deg);
        opacity:1;
    }
    to{
        transform:rotateY(120deg);
        opacity:0;
    }
}


/* =========================================================
   MOBILE FIX — VADAMOZHI WORDS PAGE
   Uses the REAL HTML class names: .app, .book, .book-content, .page
========================================================= */
@media (max-width: 768px) {
    html, body {
        width: 100%;
        height: 100%;
        min-height: 0;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }

    body {
        height: 100dvh;
        min-height: 0;
        display: flex;
        align-items: stretch;
        justify-content: center;
        padding: 5px 5px 3px;
        perspective: none;
    }

    .app {
        width: 100%;
        max-width: 520px;
        height: 100%;
        max-height: 100dvh;
        min-height: 0;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .header {
        flex: 0 0 auto;
        margin: 0 0 5px;
        padding: 0 2px;

        line-height: 1.2;
        white-space: nowrap;
    }

    .book {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        padding: 7px 6px 5px 12px;
        border-radius: 22px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .book::before {
        left: -1px;
        top: 18px;
        bottom: 18px;
        width: 10px;
        border-radius: 0 8px 8px 0;
    }

    .book-content {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
    }

    /* Keep the original 900 × 1270 page artwork and scale it as one unit. */
    .page {
        width: 900px;
        min-width: 900px;
        height: 1270px;
        min-height: 1270px;
        flex: 0 0 900px;
        padding: 25px 35px;
        overflow: hidden;
        transform-origin: top center;
        position: relative;
    }

    .title {
        width: 390px;
        min-height: 150px;
        margin: 0 auto 28px;
        padding: 18px 35px 24px;
        font-size: 42px;
    }

    .grid {
        width: 100%;
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .card {
        height: 260px;
        min-width: 0;
        padding: 18px 10px;
    }

    .card img {
        width: 170px;
        height: 155px;
        max-width: 100%;
        object-fit: contain;
    }

    .word {
        width: 205px;
        max-width: 100%;
        min-height: 55px;
        font-size: 29px;
    }

    .page-number {
        flex: 0 0 auto;
        margin-top: 3px;
        font-size: 16px;
        line-height: 1.1;
        text-align: center;
    }

    .navigation {
        flex: 0 0 42px;
        height: 42px;
        min-height: 42px;
        width: 100%;
        margin: 2px 0 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 3px;
    }

    .nav-btn {
        width: 35px;
        height: 35px;
        flex: 0 0 35px;
        font-size: 19px;
    }

    .dots {
        gap: 6px;
        align-items: center;
    }

    .dot {
        width: 7px;
        height: 7px;
        flex: 0 0 7px;
    }

    .word:hover,
    .nav-btn:hover {
        transform: none;
    }
}



/* =========================================================
   MOBILE FIX — USE THE REAL PAGE 43 CLASS NAMES
   Desktop styles above remain unchanged.
========================================================= */
@media (max-width: 768px) {
    html, body {
        width: 100%;
        height: 100%;
        min-height: 0;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }

    body {
        height: 100dvh;
        min-height: 100dvh;

        display: flex;

        gap: 3px;
        overflow: hidden;
    }

    .header {
        flex: 0 0 auto;
        margin: 0;
        padding: 1px 0 3px;
        font-size: clamp(12px, 3.7vw, 16px);
        line-height: 1.2;
        white-space: nowrap;
    }

    .book {
        width: 100%;
        flex: 1 1 0;
        min-height: 0;
        margin: 0;
        padding: 7px 7px 4px 12px;
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .book::before {
        left: 0;
        top: 8px;
        bottom: 8px;
        width: 6px;
    }

    .book-content {
        width: 100%;
        flex: 1 1 0;
        min-height: 0;
        display: flex;
        justify-content: center;
        align-items: stretch;
        overflow: hidden;
    }

    /* The real artwork element is .page, not .page-container. */
    .page {
        position: relative;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        flex: 1 1 auto;
        margin: 0;
        padding: 8px 7px 6px;
        overflow: hidden;
        transform: none !important;
        transform-origin: top center !important;
        display: flex;
        flex-direction: column;
        gap: 0;
    }

    .title {
        width: min(78%, 290px);
        min-height: 0;
        flex: 0 0 auto;
        margin: 7px auto 12px;
        padding: 8px 17px 10px;
        border-width: 4px;
        font-size: clamp(20px, 6vw, 28px);
        line-height: 1.15;
    }

    .title::after {
        bottom: -16px;
        width: 32px;
        height: 25px;
        border-left-width: 4px;
        border-bottom-width: 4px;
    }

    .title::before {
        inset: -10px -10px -16px;
        border-width: 3px;
    }

    .star1, .star2, .star3, .star4 {
        font-size: clamp(18px, 6vw, 28px);
    }

    .star1 { top: 10px; left: 25%; }
    .star2 { top: 28px; left: 20%; }
    .star3 { top: 35px; right: 18%; }
    .star4 { top: 18px; right: 22%; }

    .grid {
        width: 100%;
        flex: 1 1 0;
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-rows: repeat(4, minmax(0, 1fr));
        overflow: hidden;
        border: 1.5px solid #111;
    }

    .card {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        padding: 4px 3px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        gap: 3px;
        overflow: hidden;
        border-right: 1.5px solid #111;
        border-bottom: 1.5px solid #111;
    }

    .card:nth-child(3n) { border-right: 0; }
    .card:nth-last-child(-n+3) { border-bottom: 0; }

    .card img {
        display: block;
        width: 100%;
        max-width: 95px;
        height: auto;
        max-height: calc(100% - 32px);
        min-height: 0;
        flex: 1 1 auto;
        object-fit: contain;
    }

    .word {
        width: 92%;
        min-width: 0;
        min-height: 25px;
        height: clamp(25px, 7vw, 32px);
        flex: 0 0 auto;
        padding: 3px 15px 3px 3px;
        border-width: 2px;
        border-radius: 4px;
        font-size: clamp(10px, 3.1vw, 14px);
        line-height: 1.05;
        white-space: nowrap;
        overflow: hidden;
    }

    .word[data-audio="tajmahal.mp3"],
    .word[data-audio="krismas.mp3"],
    .word[data-audio="hanuman.mp3"],
    .word[data-audio="krishna.mp3"] {
        font-size: clamp(8px, 2.4vw, 11px);
    }

    .speaker::after {
        top: 2px;
        right: 2px;
        font-size: 8px;
    }

    .page-number {
        flex: 0 0 auto;
        margin: 3px 0 0;
        padding: 0;
        font-size: 15px;
        line-height: 1.1;
        text-align: center;
    }

    .navigation {
        flex: 0 0 40px;
        width: 100%;
        margin: 0;
        padding: 0 2px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        overflow: visible;
    }

    .nav-btn {
        width: 35px;
        height: 35px;
        flex: 0 0 35px;
        font-size: 19px;
    }

    .dots { gap: 6px; align-items: center; }
    .dot { width: 7px; height: 7px; }

    .word:hover, .nav-btn:hover { transform: none; }
}

</style>

</head>

<script>

function nextPage(page,direction){

    const app=document.querySelector(".app");

    if(direction==="next")
        app.classList.add("flip-out-next");
    else
        app.classList.add("flip-out-prev");

    setTimeout(()=>{
        window.location.href=page;
    },600);

}


/* ==========================================
   AUDIO + INDIVIDUAL LETTER TIMINGS
========================================== */

let currentAudio = null;
let currentButton = null;
let highlightTimers = [];


const timings = {

    "jannal.mp3":[
        0,
        1500,
        2500,
        3500
    ],

    "pushpam.mp3":[
        0,
        1800,
        3000,
        4000
    ],

    "pustagam.mp3":[
        0,
        2000,
        3200,
        4200,
        5200
    ],

    "jadi.mp3":[
        0,
        2000,
        3200
    ],

    "tajmahal.mp3":[
        0,
        2000,
        3200,
        4200,
        5200
    ],

    "vesti.mp3":[
        0,
        1800,
        2800,
        3600
    ],

    "pakshi.mp3":[
        0,
        1800,
        3000
    ],

    "krismas.mp3":[
        0,
        2000,
        3000,
        4000,
        5500,
        6500
    ],

    "sarpam.mp3":[
        0,
        1600,
        3000,
        4000,
        5000
    ],

    "roja.mp3":[
        0,
        1800
    ],

    "hanuman.mp3":[
        0,
        2000,
        3000,
        4000
    ],

    "krishna.mp3":[
        0,
        2000,
        3000,
        4500,
        5500
    ]

};



/* ==========================================
   CLEAR HIGHLIGHTS
========================================== */

function clearLetterHighlights(button){

    if(!button) return;

    button.querySelectorAll(".letter").forEach(letter=>{

        letter.classList.remove("active");

    });

}


/* ==========================================
   CLEAR TIMERS
========================================== */

function clearHighlightTimers(){

    highlightTimers.forEach(timer=>{

        clearTimeout(timer);

    });

    highlightTimers=[];

}


/* ==========================================
   START LETTER HIGHLIGHT
========================================== */

function startLetterHighlight(button){

    clearLetterHighlights(button);

    clearHighlightTimers();


    const letters =
        button.querySelectorAll(".letter");


    if(letters.length===0) return;


    const audioFile =
        button.dataset.audio;


    const buttonTimings =
        timings[audioFile];


    if(!buttonTimings) return;


    /*
       Highlight each letter
       according to your timing.
    */

    buttonTimings.forEach((time,index)=>{

        const timer=setTimeout(()=>{

            if(currentButton!==button) return;


            /*
               IMPORTANT:
               We DO NOT remove
               previous highlights.
            */

            if(letters[index]){

                letters[index].classList.add("active");

            }

        },time);


        highlightTimers.push(timer);

    });

}


/* ==========================================
   STOP AUDIO
========================================== */

function stopCurrent(){

    clearHighlightTimers();


    if(currentAudio){

        currentAudio.pause();

        currentAudio.currentTime=0;

    }


    if(currentButton){

        clearLetterHighlights(currentButton);

    }


    currentAudio=null;

    currentButton=null;

}


/* ==========================================
   WORD BUTTONS
========================================== */

const words =
    document.querySelectorAll(".word");


words.forEach(button=>{

    button.addEventListener("click",function(){

        const audioFile =
            this.dataset.audio;


        /* ==========================
           SAME BUTTON = STOP
        ========================== */

        if(
            currentButton===this &&
            currentAudio &&
            !currentAudio.paused
        ){

            stopCurrent();

            return;

        }


        /* ==========================
           STOP PREVIOUS
        ========================== */

        stopCurrent();


        /* ==========================
           CREATE AUDIO
        ========================== */

        currentAudio =
            new Audio(audioFile);

        currentButton=this;


        /* ==========================
           PLAY AUDIO
        ========================== */

        currentAudio.play();


        /* ==========================
           START HIGHLIGHT
        ========================== */

        startLetterHighlight(this);


        /* ==========================
           AUDIO FINISHED
        ========================== */

        currentAudio.onended=function(){

            clearHighlightTimers();


            clearLetterHighlights(
                button
            );


            currentAudio=null;

            currentButton=null;

        };

    });

});


/* ==========================================
   MOBILE PAGE FIT
========================================== */

function fitPage(){
    const page = document.querySelector(".page");
    if(!page) return;

    if(window.innerWidth <= 768){
        /* Mobile CSS lays out the actual .page directly; do not scale it. */
        page.style.transform = "none";
        page.style.transformOrigin = "top center";
        return;
    }

    page.style.transform = "";
    page.style.transformOrigin = "";
}

window.addEventListener(
    "load",
    fitPage
);


window.addEventListener(
    "resize",
    fitPage
);

</script>
