<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Page 34</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{
    font-family:Arial,sans-serif;
    background:#111D66;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    perspective:1500px;
}

.flip-out-next{
    animation:flipNext .6s ease forwards;
    transform-origin:left center;
}

.flip-out-prev{
    animation:flipPrev .6s ease forwards;
    transform-origin:right center;
}



@keyframes flipNext{

    0%{
        transform:rotateY(0deg);
        opacity:1;
    }

    100%{
        transform:rotateY(-120deg);
        opacity:0;
    }
}

@keyframes flipPrev{

    0%{
        transform:rotateY(0deg);
        opacity:1;
    }

    100%{
        transform:rotateY(120deg);
        opacity:0;
    }
}



/* MAIN APP */

.app{
    width:100%;
    max-width:800px;
    transform-style:preserve-3d;
}

/* HEADER */

.header{
    color:white;
    text-align:center;
    font-size:40px;
    font-weight:bold;
    margin-bottom:15px;

    text-shadow:
        0 0 5px rgba(255,255,255,0.7),
        0 0 12px #4FC3F7,
        0 0 24px #4FC3F7,
        0 0 36px #4FC3F7;

    animation: glowPulse 3s ease-in-out infinite;
}


@keyframes glowPulse{

    0%{
        text-shadow:
            0 0 5px #fff,
            0 0 10px #4FC3F7,
            0 0 20px #4FC3F7;
    }

    50%{
        text-shadow:
            0 0 10px #fff,
            0 0 25px #4FC3F7,
            0 0 50px #4FC3F7,
            0 0 70px #4FC3F7;
    }

    100%{
        text-shadow:
            0 0 5px #fff,
            0 0 10px #4FC3F7,
            0 0 20px #4FC3F7;
    }

}

/* BOOK */

.book{
    position:relative;
    background:#f8f1e4;
    border-radius:30px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

/* RED SPINE */

.book::before{
    content:"";
    position:absolute;
    left:-10px;
    top:25px;
    bottom:25px;
    width:20px;
    background:#D40C02
;
    border-radius:10px;
}

/* CONTENT TITLE */

.page-title{
    text-align:center;
    font-size:40px;
    font-weight:bold;
    margin-bottom:25px;
}

/* CARD */

.audio-card {
        width: 100%;
        background: #efe6d8;
        border: 2px solid #d9a23c;
        border-radius: 12px;
        padding: 8px 10px;
        margin: 0 0 7px;
        cursor: pointer;
        transition: .25s;
    }

.audio-card:hover{
    transform:translateY(-3px);
    box-shadow:0 6px 15px rgba(0,0,0,.15);
}

.card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.card-title{
    font-size:38px;
    font-weight:bold;
}


.card-image{
    width:250px;
    height:auto;
    object-fit:contain;
}


.card-content{
    line-height:1.9;
    color:#333;
    font-size:30px;
    font-weight:500;
}

.audio-badge {
    text-align: right;
    margin-top: 8px;
    font-size: 22px;
    line-height: 1;
    pointer-events: none;
}

/* PAGE NUMBER */

.page-number{
    text-align:center;
    color:#9d68d3;
    font-size:22px;
    font-weight:bold;
    margin-top:10px;
}

/* NAVIGATION */

.navigation{
    margin-top:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.nav-btn{
    width:65px;
    height:65px;
    border:none;
    border-radius:50%;
    background:#f8f1e4;
    font-size:28px;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.nav-btn:hover{
    transform:scale(1.05);
}

.dots{
    display:flex;
    gap:10px;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#8da4a4;
}

.dot.active{
    background:#1CFF00;
}

.word {
    transition: 0.3s;
    padding: 0;
    margin: 0;
    border-radius: 0;
}

.highlight {
    background: transparent !important;
    color: #d32f2f;
    font-weight: bold;
    padding: 0;
    margin: 0;
    letter-spacing: 0;
    word-spacing: 0;
}


/* Hanging Board */

.title-board{
    position:relative;
    width:100%;
    display:flex;
    justify-content:center;
    margin-bottom:25px;
    margin-top:-25px;
}

.board {
    position: relative;
    background: #A8D65C;
    color: #000000;
    font-size: 34px;
    font-weight: bold;
    padding: 12px 24px;
    border: 3px solid #000000;
    border-radius: 0;
    text-align: center;
    line-height: 1.3;
    box-shadow: none;
}

.board::before,
.board::after{
    content:"";
    position:absolute;
    width:2px;
    height:18px;
    background:#444;
    top:-18px;
}

.board::before{
    left:18px;
}

.board::after{
    right:18px;
}

.pin {
    position: absolute;
    width: 15px;
    height: 23px;
    background: #30205F;
    border: 2px solid #17112B;
    border-radius: 2px;
    top: -7px;
    z-index: 5;
    transform: rotate(-8deg);
}

.pin.left {
    left: calc(50% - 72px);
}

.pin.right {
    right: calc(50% - 72px);
    transform: rotate(9deg);
}


.title-highlight {
    background: transparent !important;
    color: #d32f2f;
    border-radius: 0;
    padding: 0;
    transition: .3s;
}






/* =========================================================
   MOBILE ONLY — PAGE 36
   DESKTOP IS NOT TOUCHED
   NO SCROLLING
========================================================= */

@media (max-width: 768px) {

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
    }

    body {
        height: 100dvh;
        min-height: 100dvh;
        background: #111d66;
    }

    /* =========================
       APP
    ========================= */

    .app {
        width: 100%;
        max-width: 520px;
        height: 100dvh;
        min-height: 0;

        margin: 0 auto;
        padding: 4px 7px;

        display: flex;
        flex-direction: column;
        align-items: center;

        gap: 3px;
        overflow: hidden;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
        flex: 0 0 auto;
        margin: 0 0 2px;
        padding: 0;

        font-size: 14px;
        line-height: 1.2;
    }

    /* =========================
       BOOK
    ========================= */

    .book {
        width: 100%;
        flex: 1 1 auto;
        min-height: 0;

        margin: 0;

        padding:
            8px
            9px
            3px
            13px;

        border-radius: 17px;

        display: flex;
        flex-direction: column;

        overflow: hidden;
    }

    /* RED SPINE */

    .book::before {
        width: 6px;
        left: 0;
        top: 9px;
        bottom: 9px;
        border-radius: 6px;
    }

    /* =========================
       BOOK CONTENT
    ========================= */

    .book-content {
        width: 100%;
        flex: 1 1 auto;
        min-height: 0;

        display: flex;
        flex-direction: column;

        overflow: hidden;
    }

    /* =========================
       GREEN TITLE BOARD
    ========================= */

    .title-board {
        flex: 0 0 auto;

        margin:
            3px
            auto
            9px;
    }

    .board {
        font-size: clamp(22px, 6vw, 30px);
        line-height: 1.12;

        padding:
            5px
            16px;

        border-width: 2px;
    }

    .pin {
        width: 12px;
        height: 19px;
        top: -6px;
    }

    .pin.left {
        left: calc(50% - 62px);
    }

    .pin.right {
        right: calc(50% - 62px);
    }

    /* =========================
       AUDIO CARDS
       MAKE THEM USE MORE SPACE
    ========================= */

    .audio-card {
        width: 100%;

        flex: 1 1 0;
        min-height: 0;

        margin: 0 0 7px;

        padding:
            9px
            9px
            7px;

        border-radius: 11px;

        display: flex;
        flex-direction: column;

        overflow: hidden;
    }

    .audio-card:last-of-type {
        margin-bottom: 0;
    }

    /* =========================
       CARD HEADER
    ========================= */

    .card-header {
        flex: 0 0 auto;

        margin-bottom: 5px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        gap: 6px;
    }

    .card-title {
        font-size: clamp(20px, 5.5vw, 27px);
        line-height: 1.1;
    }

    /* =========================
       CARD IMAGE
    ========================= */

    .card-image {
        width: 110px;
        max-width: 110px;
        max-height: 100px;
        height: auto;
        object-fit: contain;
        flex: 0 0 110px;
    }

    /* =========================
       CARD TEXT
    ========================= */

    .card-content {
        flex: 1 1 auto;
        min-height: 0;

        font-size: clamp(14px, 3.7vw, 17px);

        line-height: 1.35;

        overflow: hidden;
        overflow-wrap: normal;
        word-break: normal;
    }

    /* =========================
       SPEAKER
    ========================= */

    .audio-badge {
        flex: 0 0 auto;

        font-size: 17px;

        margin-top: 4px;

        line-height: 1;
    }

    /* =========================
       PAGE NUMBER
       STAYS AT BOTTOM
    ========================= */

    .page-number {
        width: 100%;

        flex: 0 0 auto;

        margin:
            3px
            0
            0;

        padding: 0;

        text-align: center;

        font-size: 15px;
        line-height: 1.2;

        z-index: 20;
    }

    /* =========================
       NAVIGATION
    ========================= */

    .navigation {
        width: 100%;

        flex: 0 0 39px;

        height: 39px;
        min-height: 39px;

        margin: 0;

        padding:
            0
            2px
            1px;

        display: flex;

        justify-content: space-between;
        align-items: center;

        overflow: hidden;
    }

    /* =========================
       NAV BUTTONS
    ========================= */

    .nav-btn {
        width: 34px;
        height: 34px;

        min-width: 34px;
        min-height: 34px;

        font-size: 18px;

        flex: 0 0 34px;
    }

    /* =========================
       DOTS
    ========================= */

    .dots {
        display: flex;

        gap: 5px;

        align-items: center;
        justify-content: center;
    }

    .dot {
        width: 7px;
        height: 7px;
    }

    /* =========================
       DECORATIONS
    ========================= */

    .swirl {
        left: -8px;
        top: -8px;

        transform: scale(.42);
        transform-origin: top left;

        z-index: 2;
    }

    .curve-top {
        right: -7px;
        top: 3px;

        transform: scale(.52);
        transform-origin: top right;

        z-index: 2;
    }

    /* =========================
       NO TOUCH HOVER MOVEMENT
    ========================= */

    .audio-card:hover,
    .nav-btn:hover {
        transform: none;
    }
}


</style>

</head>
<body>

<script src="pin-protection.js"></script>


<div class="app">

    <div class="header">
        📚 Tamil e-Book • தமிழ் எழுத்துகள்
    </div>

    <div class="book">

        <div class="book-content">

            <div class="title-board">

                <div class="board">

            <div class="audio-card" onclick="toggleAudio1()">

                    <span class="word">இவள்</span>
                    <span class="word">பாப்பா.</span><br>

                    <span class="word">இவள்</span>
                    <span class="word">என்</span>
                    <span class="word">பாப்பா.</span><br>

                    <span class="word">இவள்</span>
                    <span class="word">என்</span>
                    <span class="word">குட்டிப்</span>
                    <span class="word">பாப்பா.</span><br>

                </div>

        <!-- CARD 2 -->

        <div class="audio-card" onclick="toggleAudio2()">

            <div class="card-header">

                <div class="card-title">
                    <span id="houseTitle">வீடு</span>
                </div>

                <img src="page34pic2.png" class="card-image" alt="வீடு">

            </div>

            <div class="card-content" id="houseText">

                <span class="word">இது</span>
                <span class="word">வீடு.</span><br>

                <span class="word">இது</span>
                <span class="word">என்</span>
                <span class="word">அப்பாவின்</span>
                <span class="word">வீடு.</span><br>

                <span class="word">இந்த</span>

                <span class="word">இரண்டு</span>

        <div class="page-number">37</div>

    </div>

</div>

    <div class="navigation">

        <button class="nav-btn"
            onclick="nextPage('page33.html','prev')">
            ❮
        </button>

        <div class="dots">
            <div class="dot"></div>
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <button class="nav-btn"
            onclick="nextPage('page35.html','next')">
            ❯
        </button>

    </div>

</div>

<audio id="audioPlayer1">
    <source src="audio34_1.mp3" type="audio/mpeg">
</audio>

<audio id="audioPlayer2">
    <source src="audio34_2.mp3" type="audio/mpeg">
</audio>

<script src="swipe.js"></script>

<script>

// ===========================================
// VARIABLES
// ===========================================

let highlightTimers = [];
let titleTimer = null;

const audio1 = document.getElementById("audioPlayer1");
const audio2 = document.getElementById("audioPlayer2");

const babyTitle = document.getElementById("babyTitle");
const houseTitle = document.getElementById("houseTitle");

// ===========================================
// CLEAR PARAGRAPH HIGHLIGHTS
// ===========================================

function clearHighlights(container){

    container.querySelectorAll(".word").forEach(word=>{

        word.classList.remove("highlight");

    });

}

// ===========================================
// CLEAR TITLE HIGHLIGHTS
// ===========================================

function clearTitleHighlights(){

    babyTitle.classList.remove("title-highlight");
    houseTitle.classList.remove("title-highlight");

    if(titleTimer){

        clearTimeout(titleTimer);
        titleTimer = null;

    }

}

// ===========================================
// ANIMATE PARAGRAPH
// ===========================================

function animateWords(container,speed,startDelay){

    highlightTimers.forEach(timer=>clearTimeout(timer));

    highlightTimers=[];

    const words=container.querySelectorAll(".word");

    clearHighlights(container);

    words.forEach((word,index)=>{

        const timer=setTimeout(()=>{

            words.forEach(w=>w.classList.remove("highlight"));

            word.classList.add("highlight");

        },startDelay+(index*speed));

        highlightTimers.push(timer);

    });

}

// ===========================================
// STOP PARAGRAPH
// ===========================================

function stopHighlights(){

    highlightTimers.forEach(timer=>clearTimeout(timer));

    highlightTimers=[];

    clearHighlights(document.getElementById("babyText"));
    clearHighlights(document.getElementById("houseText"));

}

// ===========================================
// STOP EVERYTHING
// ===========================================

function stopAllAudio(){

    audio1.pause();
    audio2.pause();

    audio1.currentTime=0;
    audio2.currentTime=0;

    stopHighlights();

    clearTitleHighlights();

}

// ===========================================
// CARD 1 - பாப்பா
// ===========================================

function toggleAudio1(){

    if(!audio1.paused){

        stopAllAudio();
        return;

    }

    stopAllAudio();

    babyTitle.classList.add("title-highlight");

    titleTimer = setTimeout(()=>{

        babyTitle.classList.remove("title-highlight");

    },1700);

    audio1.play();

    animateWords(

        document.getElementById("babyText"),

        1400,

        2000

    );

}

// ===========================================
// CARD 2 - வீடு
// ===========================================

function toggleAudio2(){

    if(!audio2.paused){

        stopAllAudio();
        return;

    }

    stopAllAudio();

    houseTitle.classList.add("title-highlight");

    titleTimer = setTimeout(()=>{

        houseTitle.classList.remove("title-highlight");

    },1700);

    audio2.play();

    animateWords(

        document.getElementById("houseText"),

        1400,

        2000

    );

}



/* =========================
   AUDIO ENDED
========================= */

audio1.addEventListener("ended",()=>{

    stopHighlights();
    clearTitleHighlights();

});

audio2.addEventListener("ended",()=>{

    stopHighlights();
    clearTitleHighlights();

});

/* =========================
   PAGE FLIP
========================= */

function nextPage(page,direction){

    const app=document.querySelector(".app");

    app.classList.remove("flip-out-next","flip-out-prev");

    void app.offsetWidth;

    if(direction==="next"){

        app.classList.add("flip-out-next");

    }
    else{

        app.classList.add("flip-out-prev");

    }

    setTimeout(()=>{

        window.location.href=page;

    },600);

}

</script>
