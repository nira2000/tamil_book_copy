/* ===========================================
   PAGE 43 - TAMIL DIGITAL BOOK
=========================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Noto Sans Tamil',sans-serif;
    background:#1b2c73;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

/* ========================================= */

/* ===========================================
   PAGE CONTAINER
=========================================== */

.page-container{

    position:relative;

    width:100%;
    max-width:900px;

    background:#fffef8;

    border:8px solid #f2d8a0;

    border-radius:30px;

    padding:30px 35px;

    box-shadow:0 10px 25px rgba(0,0,0,.15);

}

/* RED SPINE */

.page-container::before{

    content:"";

    position:absolute;

    left:10px;

    top:22px;

    bottom:22px;

    width:10px;

    background:#D40C02;

    border-radius:8px;

}

/* ===========================================
   LESSON
=========================================== */

.lesson-number{

    font-size:26px;

    font-weight:700;

    margin-bottom:10px;

}

/* ===========================================
   TITLE
=========================================== */

.title-box{

    width:fit-content;

    margin:0 auto 30px;

    padding:10px 24px;

    background:#fff3c9;

    border:3px solid #d6a54f;

    border-radius:14px;

}

.title-box h1{

    font-size:42px;

    font-weight:700;

}

/* ===========================================
   WORD GRID
=========================================== */

.word-grid{

    display:grid;

    grid-template-columns:220px 220px;

    justify-content:center;

    column-gap:60px;

    row-gap:8px;

}

/* ===========================================
   BUTTONS
=========================================== */

.word-btn{

    width:220px;

    height:62px;

    border:none;

    border-radius:10px;

    font-family:'Noto Sans Tamil',sans-serif;

    font-size:24px;

    font-weight:600;

    cursor:pointer;

    border:2px solid rgba(0,0,0,.18);

    box-shadow:0 4px 8px rgba(0,0,0,.12);

    transition:.25s;

    position: relative;

}

.word-btn:hover{

    transform:translateY(-2px);

}

.speaker::after{

    content:"🔊";

    position:absolute;

    top:4px;
    right:5px;

    font-size:12px;

    pointer-events:none;

}

/* ===========================================
   COLOURS
=========================================== */

.green{

    background:#7fd567;

}

.green-light{

    background:#b8f762;

}

.yellow{

    background:#ffef9c;

}

.blue{

    background:#64d2e5;

}

.orange{

    background:#ff9c74;

}

/* ===========================================
   GAP BETWEEN COLOUR GROUPS
=========================================== */

.word-grid button:nth-child(13),
.word-grid button:nth-child(14){

    margin-top:40px;

}

.word-grid button:nth-child(19),
.word-grid button:nth-child(20){

    margin-top:16px;

}

.word-grid button:nth-child(25),
.word-grid button:nth-child(26){

    margin-top:14px;

}

/* ===========================================
   PAGE NUMBER
=========================================== */

.page-number{

    margin-top:24px;

    text-align:center;

    color:#7a42d5;

    font-size:24px;

    font-weight:bold;

}

/* ===========================================
   NAVIGATION
=========================================== */

.navigation{

    margin-top:16px;

    display:flex;

    justify-content:space-between;

    align-items:center;

}

.nav-btn{

    width:56px;

    height:56px;

    border:none;

    border-radius:50%;

    background:#fff8ea;

    font-size:26px;

    cursor:pointer;

    box-shadow:0 4px 10px rgba(0,0,0,.15);

    transition:.25s;

}

.nav-btn:hover{

    transform:scale(1.05);

}

.dots{

    display:flex;

    gap:10px;

}

.dot{

    width:10px;

    height:10px;

    border-radius:50%;

    background:#bbb;

}

.dot.active{

    background:#35ff2d;

}


/* ===========================================
   LETTER HIGHLIGHT
=========================================== */

.word-btn span{

    display:inline-block;

    color:#111;

    transition:all .25s ease;

}

.word-btn span.active{

    color:#ff0000;

    font-weight:700;

    transform:scale(1.12);

    text-shadow:0 0 5px rgba(255,0,0,.35);

}


/* ==========================================
   PAGE FLIP
========================================== */

.flip-out-next{
    animation:flipNext .6s ease forwards;
    transform-origin:left center;
}

.flip-out-prev{
    animation:flipPrev .6s ease forwards;
    transform-origin:right center;
}

@keyframes flipNext{

    from{
        transform:rotateY(0deg);
    }

    to{
        transform:rotateY(-90deg);
    }

}

@keyframes flipPrev{

    from{
        transform:rotateY(0deg);
    }

    to{
        transform:rotateY(90deg);
    }

}

<script>
    

const buttons = document.querySelectorAll(".word-btn");

let currentAudio = null;
let currentButton = null;
let timers = [];





const timings = {

    // ==========================
    // GREEN
    // ==========================

    "ragreen1.mp3":[0,2000,3000],          // ம | ரம்
    "ragreen2.mp3":[0,2000,3200],          // அ | றம்
    "ragreen3.mp3":[0,2000,3500,4500],          // ந | ரி
    "ragreen4.mp3":[0,2200,3000],          // இ | றால்
    "ragreen5.mp3":[0,2000],          // nari
    "ragreen6.mp3":[0,1800],          // கு | றி
    "ragreen7.mp3":[0,2000,3000,4000],          // kiridam
    "ragreen8.mp3":[0,2000,3000,4200,5200],          // புற் | றீசல்
    "ragreen9.mp3":[0,2000,3500,4500],          //marunthu
    "ragreen10.mp3":[0,2000],         // நூ | று
    "ragreen11.mp3":[0,2000,3200,4300], //rubini
    "ragreen12.mp3":[0,1800,3000,4000],         // sitrur


    // ==========================
    // YELLOW
    // ==========================

    "rayellow1.mp3":[0,1800,3000,4500,5500,6800],         // பன்னி | ரெண்டு
    "rayellow2.mp3":[0,1500,2500,4000,5300,6500],         // சிற் | றெறும்பு
    "rayellow3.mp3":[0,2000],         // ரே | கை
    "rayellow4.mp3":[0,2000,3500,4500,5800,7000],         // சிரிக் | கிறேன்
    "rayellow5.mp3":[0,1800],         // தி | ரை
    "rayellow6.mp3":[0,1800],         // சி | றை


    // ==========================
    // BLUE
    // ==========================

    "rablue1.mp3":[0,2000,3000,4500],           // ரொ | க்கம்
    "rablue2.mp3":[0,2000,3000,4500,5500],           // மற்றொன் | று
    "rablue3.mp3":[0,2000,3000],           // ரோ | கிணி
    "rablue4.mp3":[0,2000,3000,4000,5500,6500],           // கர் | ணன்
    "rablue5.mp3":[0,2000,3500,4800,5800],                // rauthiram
    "rablue6.mp3":[0],                // rau


    // ==========================
    // ORANGE
    // ==========================

    "rared1.mp3":[0,1800,3000,4000],            // காற் | று
    "rared2.mp3":[0,2000,3200]             // kaatru

};


// ===========================================
// LETTER HIGHLIGHT
// ===========================================

function clearHighlight(button){

    if(!button) return;

    button.querySelectorAll("span").forEach(span=>{

        span.classList.remove("active");

    });

}


function animateLetters(button,audioFile,duration){

    clearHighlight(button);

    timers.forEach(timer=>clearTimeout(timer));

    timers=[];

    const letters=button.querySelectorAll("span");

    if(letters.length===0) return;

    // ===========================================
    // CUSTOM TIMINGS
    // ===========================================

    if(timings[audioFile]){

        timings[audioFile].forEach((time,index)=>{

            if(index>=letters.length) return;

            const timer=setTimeout(()=>{

                letters[index].classList.add("active");

            },time);

            timers.push(timer);

        });

    }

    // ===========================================
    // AUTOMATIC (if no custom timing exists)
    // ===========================================

    else{

        const delay=duration/letters.length;

        letters.forEach((letter,index)=>{

            const timer=setTimeout(()=>{

                letters.forEach(l=>l.classList.remove("active"));

                letter.classList.add("active");

            },index*delay);

            timers.push(timer);

        });

    }

}


// ===========================================
// BUTTON CLICK
// ===========================================

buttons.forEach(button=>{

    button.addEventListener("click",function(){

        const audioFile=this.dataset.audio;

        // Stop same audio
        if(
            currentAudio &&
            currentButton===this &&
            !currentAudio.paused
        ){

            currentAudio.pause();
            currentAudio.currentTime=0;

            this.classList.remove("playing");

            clearHighlight(this);

            timers.forEach(timer=>clearTimeout(timer));

            timers=[];

            currentAudio=null;
            currentButton=null;

            return;

        }

        // Stop previous audio
        if(currentAudio){

            currentAudio.pause();
            currentAudio.currentTime=0;

        }

        // Remove old highlights
        buttons.forEach(btn=>{

            btn.classList.remove("playing");

            clearHighlight(btn);

        });

        timers.forEach(timer=>clearTimeout(timer));

        timers=[];

        // New audio
        currentAudio=new Audio(audioFile);

        currentButton=this;

        this.classList.add("playing");

        currentAudio.onloadedmetadata=()=>{

            animateLetters(
                this,
                audioFile,
                currentAudio.duration*1000
            );

        };



        currentAudio.play();

        // Audio finished
        currentAudio.onended=()=>{

            this.classList.remove("playing");

            clearHighlight(this);

            timers.forEach(timer=>clearTimeout(timer));

            timers=[];

            currentAudio=null;
            currentButton=null;

        };

        // Audio error
        currentAudio.onerror=()=>{

            alert("Audio file not found:\n"+audioFile);

            this.classList.remove("playing");

            clearHighlight(this);

            timers.forEach(timer=>clearTimeout(timer));

            timers=[];

            currentAudio=null;
            currentButton=null;

        };

    });

});

// ===========================================
// KEYBOARD STOP
// ===========================================

document.addEventListener("keydown",function(e){

    if(e.code==="Space"){

        if(currentAudio){

            currentAudio.pause();
            currentAudio.currentTime=0;

            if(currentButton){

                currentButton.classList.remove("playing");

                clearHighlight(currentButton);

            }

            timers.forEach(timer=>clearTimeout(timer));

            timers=[];

            currentAudio=null;
            currentButton=null;

        }

    }

});

// ===========================================
// PAGE NAVIGATION
// ===========================================

function nextPage(page,direction){

    const book=document.querySelector(".page-wrapper");

    if(direction==="next"){

        book.classList.add("flip-out-next");

    }else{

        book.classList.add("flip-out-prev");

    }

    setTimeout(()=>{

        window.location.href=page;

    },600);

}




</script>
