<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VADAMOZHI</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:"Noto Sans Tamil","Latha","Arial Unicode MS",sans-serif;
    background:#91d8f2;
    color:#000;
    overflow-x:hidden;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    padding:22px 14px;
}

.app{
    width:min(1180px,100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    perspective:1600px;
}


/* =========================
   BOOK
========================= */

.book{
    width:100%;
    position:relative;
    background:#fffdf3;
    border-radius:32px;
    padding:34px 40px 22px 48px;
    box-shadow:0 14px 34px rgba(0,0,0,.20);
    transform-style:preserve-3d;
    overflow:visible;
}


/* RED BOOK SPINE */

.book::before{
    content:"";
    position:absolute;
    left:-3px;
    top:18px;
    bottom:18px;
    width:11px;
    background:#c91616;
    border-radius:10px 0 0 10px;
    box-shadow:inset -3px 0 0 rgba(90,0,0,.28);
}


/* =========================
   PAGE TITLE
========================= */

.title-area{
    display:flex;
    justify-content:center;
    margin-bottom:28px;
}

.title{
    position:relative;
    border:5px solid #000;
    border-radius:60px;
    background:#ff3d91;
    box-shadow:0 6px 0 #000;
    padding:9px 42px 13px;
    min-width:360px;
    text-align:center;
    font-size:46px;
    line-height:1.1;
    font-weight:900;
    cursor:pointer;
    transition:.2s ease;
}

.title:hover{
    transform:translateY(-2px);
}

.title:active{
    transform:scale(.98);
}

.title .spark{
    position:absolute;
    color:#ff8a00;
    font-family:Arial,sans-serif;
    font-size:28px;
    pointer-events:none;
}

.spark.s1{
    left:-38px;
    top:-26px;
}

.spark.s2{
    right:-38px;
    top:-17px;
}

.spark.s3{
    left:-70px;
    top:24px;
}

.spark.s4{
    right:-70px;
    top:30px;
}


/* =========================
   TOP TABLE AREA
========================= */

.image-area{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0 auto 28px;
}

.image-button{
    width:min(1000px,100%);
    border:0;
    padding:0;
    background:transparent;
    cursor:pointer;
    border-radius:8px;
}

.image-button img{
    width:100%;
    max-height:330px;
    object-fit:contain;
    display:block;
    border-radius:4px;
    transition:.2s ease;
}

.image-button:hover img{
    transform:scale(1.01);
}

.image-button:active img{
    transform:scale(.99);
}


/* =========================
   WORD TABLE
========================= */

.words-area{
    width:min(760px,100%);
    margin:0 auto;
    position:relative;
}


/* RIBBON */

.ribbon{
    position:absolute;
    left:-62px;
    top:-24px;
    width:105px;
    height:145px;
    z-index:5;
    pointer-events:none;
}

.ribbon-top{
    position:absolute;
    width:78px;
    height:45px;
    background:#ed1979;
    border-radius:50% 50% 45% 45%;
    left:10px;
    top:0;
    transform:rotate(-10deg);
}

.ribbon-top::before,
.ribbon-top::after{
    content:"";
    position:absolute;
    width:22px;
    height:55px;
    background:#ed1979;
    top:25px;
}

.ribbon-top::before{
    left:0;
    transform:rotate(18deg);
}

.ribbon-top::after{
    right:0;
    transform:rotate(-18deg);
}

.ribbon-tail-left,
.ribbon-tail-right{
    position:absolute;
    width:22px;
    height:100px;
    background:#ed1979;
    top:34px;
}

.ribbon-tail-left{
    left:23px;
    transform:rotate(8deg);
    clip-path:polygon(
        0 0,
        100% 0,
        85% 75%,
        45% 100%,
        35% 68%
    );
}

.ribbon-tail-right{
    left:54px;
    transform:rotate(-5deg);
    clip-path:polygon(
        0 0,
        100% 0,
        70% 100%,
        35% 72%
    );
}


/* WORD TABLE */

.word-table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
    border:5px solid #0756b5;
    background:#91d8f2;
}

.word-table th,
.word-table td{
    border:4px solid #0756b5;
    padding:0;
}

.word-table th{
    height:78px;
    background:#91d8f2;
    text-align:center;
    vertical-align:middle;
    font-size:38px;
    font-weight:900;
}

.word-table td{
    height:72px;
}

.word-button{
    width:100%;
    height:100%;
    min-height:72px;
    border:0;
    background:transparent;
    color:#000;
    font-family:inherit;
    font-size:34px;
    font-weight:500;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:5px 38px 5px 12px;
    transition:.18s ease;
}

.word-button:hover{
    background:rgba(255,255,255,.18);
}

.word-button:active{
    transform:scale(.98);
}

.word-button span{
    display:inline-block;
    color:#111;
    transition:all .25s ease;
}

.word-button span.active{
    color:#ff0000;
    font-weight:700;
    transform:scale(1.12);
    text-shadow:0 0 5px rgba(255,0,0,.35);
}

.word-button.playing{
    background:rgba(255,255,255,.22);
}

.audio-dot{
    position:absolute;
    right:10px;
    top:9px;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#ff3d91;
    opacity:0;
    transform:scale(.5);
}

.word-button.playing .audio-dot{
    opacity:1;
    transform:scale(1);
    animation:pulse .8s infinite alternate;
}

@keyframes pulse{
    from{
        transform:scale(.8);
    }

    to{
        transform:scale(1.3);
    }
}


/* =========================
   FLOWERS
========================= */

.flowers{
    width:100%;
    height:55px;
    margin-top:10px;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    overflow:hidden;
    pointer-events:none;
}

.flower{
    position:relative;
    width:28px;
    height:44px;
    margin:0 3px;
}

.flower::before{
    content:"🌸";
    position:absolute;
    font-size:27px;
    top:0;
    left:0;
}

.flower::after{
    content:"";
    position:absolute;
    width:2px;
    height:23px;
    background:#319b42;
    left:14px;
    top:26px;
}

.flower:nth-child(2){
    transform:scale(.8);
}

.flower:nth-child(3){
    transform:scale(1.15);
}

.flower:nth-child(4){
    transform:scale(.9);
}

.flower:nth-child(5){
    transform:scale(1.1);
}

.flower:nth-child(6){
    transform:scale(.8);
}

.flower:nth-child(7){
    transform:scale(1.15);
}

.flower:nth-child(8){
    transform:scale(.9);
}

.flower:nth-child(9){
    transform:scale(1.1);
}

.flower:nth-child(10){
    transform:scale(.85);
}


/* =========================
   PAGE NUMBER
========================= */

.page-number{
    text-align:center;
    margin-top:6px;
    font-size:24px;
    line-height:1;
    font-weight:800;
    color:#29427e;
}


/* =========================
   NAVIGATION
========================= */

.navigation{
    width:100%;
    margin-top:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 2px;
}

.nav-btn{
    width:50px;
    height:50px;
    border:0;
    border-radius:50%;
    background:#fffdf3;
    color:#111;
    font-size:24px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 5px 14px rgba(0,0,0,.18);
    transition:.2s ease;
}

.nav-btn:hover{
    transform:scale(1.08);
}

.nav-btn:active{
    transform:scale(.94);
}

.dots{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#aeb5b5;
}

.dot.active{
    background:#18c900;
}


/* =========================
   PAGE FLIP
========================= */

.flip-out-next{
    animation:flipNext .6s ease forwards;
    transform-origin:left center;
}

.flip-out-prev{
    animation:flipPrev .6s ease forwards;
    transform-origin:right center;
}

@keyframes flipNext{
    0%{
        transform:rotateY(0);
    }

    100%{
        transform:rotateY(-90deg);
    }
}

@keyframes flipPrev{
    0%{
        transform:rotateY(0);
    }

    100%{
        transform:rotateY(90deg);
    }
}


/* =========================
   TOP INTERACTIVE VADAMOZHI TABLE
========================= */

.top-vadamozhi-wrap{
    width:min(1080px,100%);
    margin:0 auto;
}

.top-vadamozhi-table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
    border:3px solid #111;
    background:#fff84f;
}

.top-vadamozhi-table td{
    height:64px;
    padding:0 4px;
    border:2px solid #111;
    background:#fff84f;
    overflow:hidden;
}

.top-vadamozhi-table .top-head td{
    height:52px;
    padding:0 4px;
    background:#f3b5d1;
}

.top-vadamozhi-table .blue-cell{
    background:#11a8df;
}

.top-vadamozhi-table button{
    width:100%;
    height:100%;
    min-height:0;
    padding:2px 3px;
    margin:0;
    border:0;
    background:transparent;
    color:#000;
    font-family:inherit;
    font-size:22px;
    font-weight:600;
    line-height:1;
    white-space:nowrap;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}

.top-vadamozhi-table .top-head button{
    font-size:21px;
    font-weight:800;
}

.top-vadamozhi-table button:hover{
    background:rgba(255,255,255,.28);
}

.top-vadamozhi-table button:active{
    transform:scale(.94);
}

.top-vadamozhi-table button.playing{
    background:#ff3030;
    color:#fff;
}

.top-vadamozhi-wrap .letter{
    display:inline;
    padding:0;
    margin:0;
    border-radius:4px;
}

.top-vadamozhi-wrap .letter.highlighted{
    background:#ff3030;
    color:#fff;
}


/* =========================
   PINK HEADER SPEAKERS
========================= */

.top-head button{
    position:relative;
}

.top-speaker{
    font-family:Arial,sans-serif;
    font-size:12px;
    line-height:1;
    margin-left:3px;
    vertical-align:middle;
    pointer-events:none;
}


/* =========================
   ONLY YELLOW COLUMNS 10, 11, 12
   DESKTOP
========================= */
.top-vadamozhi-table tr.family-row td:nth-child(9),
.top-vadamozhi-table tr.family-row td:nth-child(10),
.top-vadamozhi-table tr.family-row td:nth-child(11),
.top-vadamozhi-table tr.family-row td:nth-child(12){
    font-size:19px;
}

.top-vadamozhi-table tr.family-row td:nth-child(9) span,
.top-vadamozhi-table tr.family-row td:nth-child(10) span,
.top-vadamozhi-table tr.family-row td:nth-child(11) span,
.top-vadamozhi-table tr.family-row td:nth-child(12) span{
    font-size:19px;
}


/* =========================
   FAMILY ROWS
========================= */

.family-cell{
    position:relative;
    text-align:center;
    vertical-align:middle;
    font-family:inherit;
    font-size:22px;
    font-weight:600;
    color:#000;
    transition:background .2s ease,color .2s ease;
}

.family-cell > span:first-child{
    display:inline-block;
}

.family-start{
    width:100%;
    height:100%;
    min-height:0;
    padding:0 22px 0 3px;
    border:0;
    background:transparent;
    color:#000;
    font-family:inherit;
    font-size:22px;
    font-weight:600;
    cursor:pointer;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.family-speaker{
    position:absolute;
    right:3px;
    top:50%;
    transform:translateY(-50%);
    font-family:Arial,sans-serif;
    font-size:12px;
    line-height:1;
    pointer-events:none;
}

.family-start.playing{
    background:rgba(255,48,48,.16);
}

.family-cell.highlighted{
    background:#ff3030 !important;
    color:#fff !important;
}

.family-cell.highlighted .family-start{
    color:#fff;
}


/* =========================================================
   MOBILE
   ONE MOBILE SECTION ONLY
========================================================= */

@media(max-width:700px){

    body{
        padding:3px 5px 2px;
        overflow:hidden;
    }

    .app{
        width:100%;
        height:100dvh;
        min-height:0;
        display:flex;
        flex-direction:column;
    }


    /* BOOK */

    .book{
        width:100%;
        height:calc(100dvh - 6px);
        min-height:0;
        flex:0 0 auto;
        padding:8px 6px 5px 12px;
        border-radius:20px;
        overflow:hidden;
        display:flex;
        flex-direction:column;
    }

    .book::before{
        width:6px;
        left:-2px;
        top:10px;
        bottom:10px;
    }


    /* TITLE */

    .title-area{
        flex:0 0 58px;
        height:58px;
        margin-bottom:4px;
    }

    .title{
        width:auto;
        max-width:88%;
        min-width:0;
        height:52px;
        min-height:52px;
        padding:5px 18px 7px;
        font-size:23px;
        line-height:1.05;
        border-width:3px;
        box-shadow:0 3px 0 #000;
    }

    .title .spark{
        font-size:15px;
    }

    .spark.s1{
        left:-20px;
        top:-10px;
    }

    .spark.s2{
        right:-20px;
        top:-7px;
    }

    .spark.s3{
        left:-28px;
        top:15px;
    }

    .spark.s4{
        right:-28px;
        top:17px;
    }


    /* TOP TABLE */

    .image-area{
        flex:0 0 116px;
        height:116px;
        min-height:116px;
        margin:0 0 5px;
        overflow:hidden;
        display:flex;
        align-items:stretch;
    }

    .top-vadamozhi-wrap{
        width:100%;
        height:100%;
        overflow:hidden;
    }

    .top-vadamozhi-table{
        width:100%;
        height:100%;
        border-width:1px;
        table-layout:fixed;
    }

    .top-vadamozhi-table td{
        height:auto;
        padding:0 1px;
        border-width:1px;
    }

    .top-vadamozhi-table .top-head td{
        height:auto;
        padding:0 1px;
    }

    .top-vadamozhi-table button{
        width:100%;
        height:100%;
        min-height:0;
        padding:1px 0;
        font-size:10px;
        line-height:1;
        white-space:nowrap;
        overflow:hidden;
    }

    .top-vadamozhi-table .top-head button{
        font-size:9px;
    }


    /* PINK HEADER SPEAKERS */

    .top-speaker{
        font-size:7px;
        margin-left:1px;
    }


    /* ONLY YELLOW COLUMNS 10, 11, 12
       MOBILE */
    .top-vadamozhi-table tr.family-row td:nth-child(9),
    .top-vadamozhi-table tr.family-row td:nth-child(10),
    .top-vadamozhi-table tr.family-row td:nth-child(11),
    .top-vadamozhi-table tr.family-row td:nth-child(12){
        font-size:8px;
    }

    .top-vadamozhi-table tr.family-row td:nth-child(9) span,
    .top-vadamozhi-table tr.family-row td:nth-child(10) span,
    .top-vadamozhi-table tr.family-row td:nth-child(11) span,
    .top-vadamozhi-table tr.family-row td:nth-child(12) span{
        font-size:8px;
    }


    /* WORD TABLE */

    .words-area{
        flex:1 1 auto;
        min-height:0;
        width:100%;
        display:flex;
        flex-direction:column;
        overflow:hidden;
    }

    .ribbon{
        display:none;
    }

    .word-table{
        width:100%;
        height:100%;
        flex:1 1 auto;
        min-height:0;
        border-width:2px;
        table-layout:fixed;
    }

    .word-table th,
    .word-table td{
        border-width:1.5px;
    }

    .word-table th{
        height:30px;
        font-size:16px;
        line-height:1;
    }

    .word-table td{
        height:auto;
    }

    .word-button{
        width:100%;
        height:100%;
        min-height:0;
        padding:1px 20px 1px 3px;
        font-size:15px;
        line-height:1;
        white-space:nowrap;
        overflow:hidden;
    }

    .letter{
        display:inline;
        padding:0;
        margin:0;
    }

    .audio-dot{
        right:3px;
        top:3px;
        width:5px;
        height:5px;
    }


    /* FLOWERS */

    .flowers{
        flex:0 0 22px;
        height:22px;
        margin:1px 0 0;
        overflow:hidden;
    }

    .flower{
        width:22px;
        height:30px;
        margin:0 -2px;
        transform:scale(.52)!important;
    }


    /* PAGE NUMBER */

    .page-number{
        flex:0 0 18px;
        height:18px;
        margin:0;
        font-size:14px;
        line-height:18px;
    }


    /* NAVIGATION */

    .navigation{
        flex:0 0 34px;
        height:34px;
        width:100%;
        margin:1px 0 0;
        padding:0 2px;
        display:flex;
        align-items:center;
        justify-content:space-between;
    }

    .nav-btn{
        width:30px;
        height:30px;
        font-size:15px;
        padding:0;
    }

    .dots{
        gap:6px;
    }

    .dot{
        width:7px;
        height:7px;
    }


    /* FAMILY ROWS */

    .family-cell{
        font-size:10px;
    }

    .family-start{
        font-size:10px;
        padding:0 11px 0 1px;
    }

    .family-speaker{
        right:1px;
        font-size:5px;
    }

}

</style>
</head>

<body>

<div class="app">

    <div class="book">

        <div class="title-area">
            <button class="title" data-audio="vadamozhi.mp3" aria-label="வடமொழி சொற்கள்">
                <span class="spark s1">✦</span>
                <span class="spark s2">✦</span>
                <span class="spark s3">✦</span>
                <span class="spark s4">✦</span>
                <span class="title-word">கிரந்த எழுத்துகள்</span>
            </button>
        </div>

        <div class="image-area">

            <div class="top-vadamozhi-wrap">

                <table class="top-vadamozhi-table">
                    <tbody>

                        <tr class="top-head">
                            <td><button data-audio="a.mp3">அ <span class="top-speaker">🔊</span></button></td>
                            <td><button data-audio="aa.mp3">ஆ <span class="top-speaker">🔊</span></button></td>
                            <td><button data-audio="i.mp3">இ <span class="top-speaker">🔊</span></button></td>
                            <td><button data-audio="ii.mp3">ஈ <span class="top-speaker">🔊</span></button></td>
                            <td><button data-audio="u.mp3">உ <span class="top-speaker">🔊</span></button></td>
                            <td><button data-audio="uu.mp3">ஊ <span class="top-speaker">🔊</span></button></td>
                            <td><button data-audio="e.mp3">எ <span class="top-speaker">🔊</span></button></td>
                            <td><button data-audio="ee.mp3">ஏ <span class="top-speaker">🔊</span></button></td>
                            <td><button data-audio="ai.mp3">ஐ <span class="top-speaker">🔊</span></button></td>
                            <td><button data-audio="o.mp3">ஒ <span class="top-speaker">🔊</span></button></td>
                            <td><button data-audio="oo.mp3">ஓ <span class="top-speaker">🔊</span></button></td>
                            <td><button data-audio="au.mp3">ஔ <span class="top-speaker">🔊</span></button></td>
                            <td><button data-audio="ak.mp3">ஃ <span class="top-speaker">🔊</span></button></td>
                        </tr>

                        <!-- J FAMILY -->
                        <tr class="family-row" data-family="ja">
                            <td class="family-cell">
                                <button class="family-start" data-family-audio="jafamily.mp3">
                                    <span>ஜ</span>
                                    <span class="family-speaker">🔊</span>
                                </button>
                            </td>
                            <td class="family-cell"><span>ஜா</span></td>
                            <td class="family-cell"><span>ஜி</span></td>
                            <td class="family-cell"><span>ஜீ</span></td>
                            <td class="family-cell"><span>ஜு</span></td>
                            <td class="family-cell"><span>ஜூ</span></td>
                            <td class="family-cell"><span>ஜெ</span></td>
                            <td class="family-cell"><span>ஜே</span></td>
                            <td class="family-cell"><span>ஜை</span></td>
                            <td class="family-cell"><span>ஜொ</span></td>
                            <td class="family-cell"><span>ஜோ</span></td>
                            <td class="family-cell"><span>ஜௌ</span></td>
                            <td class="family-cell blue-cell"><span>ஜ்</span></td>
                        </tr>

<script>

const audioPlayer = document.getElementById("audioPlayer");


/* =========================================================
   NORMAL WORD TABLE + TITLE AUDIO
========================================================= */

const buttons = document.querySelectorAll(".word-button");
const titleButton = document.querySelector(".title");
const vowelButtons = document.querySelectorAll(
    ".top-vadamozhi-table .top-head button"
);

let activeButton = null;
let activeTitleButton = null;
let activeVowelButton = null;

let highlightTimer = null;


/* =========================================================
   TAMIL GRAPHEME SPLITTER
========================================================= */

function splitTamilWord(text){

    const specialPattern = /ஸ்ரீ|க்ஷ[ாிீுூெேைொோௌ]?/g;

    const segmenter =
        typeof Intl !== "undefined" && Intl.Segmenter
            ? new Intl.Segmenter("ta", {
                granularity:"grapheme"
            })
            : null;

    const result = [];
    let lastIndex = 0;
    let match;

    while((match = specialPattern.exec(text)) !== null){

        /* Normal Tamil text before the special unit */
        const normalText =
            text.slice(lastIndex, match.index);

        if(normalText){

            if(segmenter){

                for(const item of segmenter.segment(normalText)){
                    result.push(item.segment);
                }

            }else{

                result.push(...normalText);

            }
        }

        /* Keep ஸ்ரீ or க்ஷ + vowel together */
        result.push(match[0]);

        lastIndex = match.index + match[0].length;
    }

    /* Remaining text */
    const remainingText = text.slice(lastIndex);

    if(remainingText){

        if(segmenter){

            for(const item of segmenter.segment(remainingText)){
                result.push(item.segment);
            }

        }else{

            result.push(...remainingText);

        }
    }

    return result;
}


/* =========================================================
   GET WORD TEXT
========================================================= */

function getButtonText(button){

    const clone = button.cloneNode(true);

    clone.querySelectorAll(".audio-dot").forEach(el=>{
        el.remove();
    });

    return clone.textContent
        .replace(/\s+/g," ")
        .trim();
}


/* =========================================================
   PREPARE ONLY WORD-TABLE BUTTONS
========================================================= */

function prepareButton(button){

    if(button.dataset.prepared) return;

    const text = getButtonText(button);

    const letters = splitTamilWord(text);

    button.innerHTML = "";

    const wrapper = document.createElement("span");

    wrapper.className = "letter-wrapper";

    letters.forEach(letter=>{

        const span = document.createElement("span");

        span.className = "letter";

        span.textContent = letter;

        wrapper.appendChild(span);

    });

    button.appendChild(wrapper);


    /* AUDIO DOT */

    const dot = document.createElement("span");

    dot.className = "audio-dot";

    button.appendChild(dot);


    button.dataset.prepared = "true";
}


/* Prepare ONLY bottom word-table buttons */

buttons.forEach(prepareButton);


/* =========================================================
   RESET WORD BUTTON
========================================================= */

function resetButton(button){

    if(!button) return;

    button.classList.remove("playing");

    button.querySelectorAll(".letter").forEach(letter=>{
        letter.classList.remove("active");
    });
}


/* =========================================================
   RESET TITLE
========================================================= */

function resetTitle(){

    if(activeTitleButton){

        activeTitleButton.classList.remove("playing");

        activeTitleButton = null;
    }
}


/* =========================================================
   RESET PINK HEADER BUTTON
========================================================= */

function resetVowelButton(){

    if(activeVowelButton){

        activeVowelButton.classList.remove("playing");

        activeVowelButton = null;
    }
}


/* =========================================================
   STOP CURRENT AUDIO
========================================================= */

function stopCurrentAudio(){

    clearInterval(highlightTimer);

    highlightTimer = null;


    audioPlayer.pause();

    audioPlayer.currentTime = 0;


    /* Reset word table */

    if(activeButton){

        resetButton(activeButton);

        activeButton = null;
    }


    /* Reset title */

    resetTitle();


    /* Reset pink header */

    resetVowelButton();
}


/* =========================================================
   WORD TABLE HIGHLIGHTING
========================================================= */

function startHighlighting(button){

    const letters = button.querySelectorAll(".letter");

    if(!letters.length) return;


    /*
       Get timings from data-times.

       Example:

       data-times="0,0.35,0.70,1.05"

       These values are in SECONDS.
    */

    let times = (button.dataset.times || "")
        .split(",")
        .map(Number)
        .filter(n => !Number.isNaN(n));


    /* =====================================================
       AUTOMATIC TIMING
       If no data-times exists
    ===================================================== */

    if(times.length === 0){

        const duration =
            Number.isFinite(audioPlayer.duration) &&
            audioPlayer.duration > 0
                ? audioPlayer.duration
                : 2;

        const interval = duration / letters.length;

        times = letters.map((_,i)=>{

            return i * interval;

        });
    }


    /* =====================================================
       MAKE SURE EVERY LETTER HAS A TIMING
    ===================================================== */

    while(times.length < letters.length){

        const last = times.length
            ? times[times.length - 1]
            : 0;

        times.push(last + 0.4);
    }


    clearInterval(highlightTimer);


    let index = 0;


    /* First letter starts immediately */

    letters[index].classList.add("active");


    /* =====================================================
       CHECK AUDIO TIME
    ===================================================== */

    highlightTimer = setInterval(()=>{

        if(!activeButton || audioPlayer.paused){

            return;
        }


        const currentTime = audioPlayer.currentTime;


        /*
           Keep previous letters active.

           Example:

           Letter 1 → red

           Letter 2 → red
           Letter 1 stays red

           Letter 3 → red
           Letter 1 + 2 stay red
        */

        while(
            index + 1 < letters.length &&
            currentTime >= times[index + 1]
        ){

            index++;

            letters[index].classList.add("active");
        }

    },30);
}


/* =========================================================
   WORD TABLE CLICK
========================================================= */

buttons.forEach(button=>{

    button.addEventListener("click",()=>{

        const audioFile = button.dataset.audio;


        /* Click same word = stop */

        if(
            activeButton === button &&
            !audioPlayer.paused
        ){

            stopCurrentAudio();

            return;
        }


        /* Stop anything currently playing */

        stopCurrentAudio();


        activeButton = button;

        button.classList.add("playing");


        audioPlayer.src = audioFile;

        audioPlayer.currentTime = 0;


        audioPlayer.play().then(()=>{

            startHighlighting(button);

        }).catch(error=>{

            console.log(
                "Audio could not play:",
                error
            );

            resetButton(button);

            activeButton = null;
        });

    });

});


/* =========================================================
   TITLE AUDIO
   TITLE DOES NOT USE WORD HIGHLIGHTING
========================================================= */

if(titleButton){

    titleButton.addEventListener("click",()=>{

        const audioFile = titleButton.dataset.audio;


        /* Click same title = stop */

        if(
            activeTitleButton === titleButton &&
            !audioPlayer.paused
        ){

            stopCurrentAudio();

            return;
        }


        /* Stop anything currently playing */

        stopCurrentAudio();


        activeTitleButton = titleButton;

        titleButton.classList.add("playing");


        audioPlayer.src = audioFile;

        audioPlayer.currentTime = 0;


        audioPlayer.play().catch(error=>{

            console.log(
                "Title audio could not play:",
                error
            );

            resetTitle();
        });

    });

}


/* =========================================================
   TOP PINK HEADER
   EACH BUTTON REMAINS INDIVIDUAL
========================================================= */

vowelButtons.forEach(button=>{

    button.addEventListener("click",()=>{

        const audioFile = button.dataset.audio;


        /* Click same vowel = stop */

        if(
            activeVowelButton === button &&
            !audioPlayer.paused
        ){

            stopCurrentAudio();

            return;
        }


        /* Stop anything currently playing */

        stopCurrentAudio();


        activeVowelButton = button;

        button.classList.add("playing");


        audioPlayer.src = audioFile;

        audioPlayer.currentTime = 0;


        audioPlayer.play().catch(error=>{

            console.log(
                "Vowel audio could not play:",
                error
            );

            resetVowelButton();
        });

    });

});


/* =========================================================
   FAMILY ROWS
   J / SHA / SA / HA / KSHA
========================================================= */

const familyRows =
    document.querySelectorAll(".family-row");

let activeFamilyRow = null;

let familyTimer = null;

let familyIndex = 0;


/* =========================================================
   FAMILY HIGHLIGHT TIMINGS
   13 numbers = 13 cells
========================================================= */

const familyHighlightTimes = {

    ja:[
        0,
        1.00,
        2.00,
        3.00,
        4.00,
        5.00,
        6.00,
        7.00,
        8.00,
        9.00,
        10.00,
        11.00,
        12.00
    ],

    sha:[
        0,
        1.50,
        2.50,
        3.20,
        4.00,
        4.80,
        5.60,
        6.60,
        7.40,
        8.40,
        9.20,
        10.20,
        11.20
    ],

    ssa:[
        0,
        1.50,
        2.50,
        3.00,
        4.00,
        4.50,
        5.50,
        6.20,
        7.20,
        8.20,
        8.90,
        9.90,
        10.90
    ],

    ha:[
        0,
        1.50,
        2.30,
        3.00,
        4.00,
        4.50,
        5.50,
        6.20,
        7.20,
        8.20,
        8.80,
        9.80,
        10.80
    ],

    ksha:[
        0,
        1.30,
        2.30,
        3.30,
        4.30,
        5.30,
        6.30,
        7.00,
        8.00,
        9.00,
        10.00,
        11.00,
        12.00
    ]

};


/* =========================================================
   RESET FAMILY
========================================================= */

function resetFamily(row){

    if(!row) return;


    row.querySelectorAll(".family-cell")
        .forEach(cell=>{

            cell.classList.remove("highlighted");

        });


    const button =
        row.querySelector(".family-start");


    if(button){

        button.classList.remove("playing");

    }
}


/* =========================================================
   RESET ALL FAMILIES
========================================================= */

function resetAllFamilies(){

    clearInterval(familyTimer);

    familyTimer = null;


    familyRows.forEach(resetFamily);


    activeFamilyRow = null;

    familyIndex = 0;
}


/* =========================================================
   HIGHLIGHT FAMILY
========================================================= */

function highlightFamily(row,index){

    const cells =
        row.querySelectorAll(".family-cell");


    cells.forEach((cell,i)=>{

        if(i <= index){

            cell.classList.add("highlighted");

        }else{

            cell.classList.remove("highlighted");

        }

    });
}


/* =========================================================
   START FAMILY HIGHLIGHT
========================================================= */

function startFamilyHighlight(row){

    clearInterval(familyTimer);


    const familyName =
        row.dataset.family;


    const cells =
        row.querySelectorAll(".family-cell");


    const times =
        familyHighlightTimes[familyName];


    if(!times || !cells.length) return;


    familyIndex = 0;


    highlightFamily(row,0);


    familyTimer = setInterval(()=>{

        if(
            audioPlayer.paused ||
            activeFamilyRow !== row
        ){

            return;
        }


        const currentTime =
            audioPlayer.currentTime;


        while(
            familyIndex + 1 < cells.length &&
            familyIndex + 1 < times.length &&
            currentTime >= times[familyIndex + 1]
        ){

            familyIndex++;

            highlightFamily(
                row,
                familyIndex
            );
        }

    },30);
}


/* =========================================================
   FAMILY BUTTON CLICK
========================================================= */

familyRows.forEach(row=>{

    const button =
        row.querySelector(".family-start");


    if(!button) return;


    button.addEventListener("click",()=>{


        /* Click same family = stop */

        if(
            activeFamilyRow === row &&
            !audioPlayer.paused
        ){

            stopCurrentAudio();

            resetAllFamilies();

            return;
        }


        /* Stop everything else */

        stopCurrentAudio();

        resetAllFamilies();


        activeFamilyRow = row;

        familyIndex = 0;


        button.classList.add("playing");


        const audioFile =
            button.dataset.familyAudio;


        audioPlayer.src = audioFile;

        audioPlayer.currentTime = 0;


        audioPlayer.play().then(()=>{

            startFamilyHighlight(row);

        }).catch(error=>{

            console.log(
                "Family audio could not play:",
                error
            );

            resetAllFamilies();
        });

    });

});


/* =========================================================
   AUDIO FINISHED
   CLEAR ALL HIGHLIGHTS
========================================================= */

audioPlayer.addEventListener("ended",()=>{


    /* Word table */

    clearInterval(highlightTimer);

    highlightTimer = null;


    if(activeButton){

        resetButton(activeButton);

        activeButton = null;
    }


    /* Title */

    resetTitle();


    /* Pink header */

    resetVowelButton();


    /* Family */

    clearInterval(familyTimer);

    familyTimer = null;


    if(activeFamilyRow){

        resetFamily(activeFamilyRow);

        activeFamilyRow = null;
    }


    familyIndex = 0;

});


/* =========================================================
   PAGE NAVIGATION
========================================================= */

function nextPage(page,direction){

    stopCurrentAudio();

    resetAllFamilies();


    const book =
        document.querySelector(".book");


    book.classList.remove(
        "flip-out-next",
        "flip-out-prev"
    );


    void book.offsetWidth;


    if(direction === "next"){

        book.classList.add(
            "flip-out-next"
        );

    }else{

        book.classList.add(
            "flip-out-prev"
        );

    }


    setTimeout(()=>{

        window.location.href = page;

    },600);

}

</script>

</body>
