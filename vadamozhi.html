<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VADAMOZHI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:"Noto Sans Tamil","Latha","Arial Unicode MS",sans-serif;
    background:#91d8f2;
    color:#000;
    overflow-x:hidden;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    padding:22px 14px;
}

.app{
    width:min(1180px,100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    perspective:1600px;
}

.book{
    width:100%;
    position:relative;
    background:#fffdf3;
    border-radius:32px;
    padding:34px 40px 22px 48px;
    box-shadow:0 14px 34px rgba(0,0,0,.20);
    transform-style:preserve-3d;
    overflow:visible;
}

/* RED BOOK SPINE */
.book::before{
    content:"";
    position:absolute;
    left:-3px;
    top:18px;
    bottom:18px;
    width:11px;
    background:#c91616;
    border-radius:10px 0 0 10px;
    box-shadow:inset -3px 0 0 rgba(90,0,0,.28);
}

/* PAGE TITLE */
.title-area{
    display:flex;
    justify-content:center;
    margin-bottom:28px;
}

.title{
    position:relative;
    border:5px solid #000;
    border-radius:60px;
    background:#ff3d91;
    box-shadow:0 6px 0 #000;
    padding:9px 42px 13px;
    min-width:360px;
    text-align:center;
    font-size:46px;
    line-height:1.1;
    font-weight:900;
    cursor:pointer;
    transition:.2s ease;
}

.title:hover{transform:translateY(-2px)}
.title:active{transform:scale(.98)}

.title .spark{
    position:absolute;
    color:#ff8a00;
    font-family:Arial,sans-serif;
    font-size:28px;
    pointer-events:none;
}

.spark.s1{left:-38px;top:-26px}
.spark.s2{right:-38px;top:-17px}
.spark.s3{left:-70px;top:24px}
.spark.s4{right:-70px;top:30px}

/* TOP TABLE IMAGE */
.image-area{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0 auto 28px;
}

.image-button{
    width:min(1000px,100%);
    border:0;
    padding:0;
    background:transparent;
    cursor:pointer;
    border-radius:8px;
}

.image-button img{
    width:100%;
    max-height:330px;
    object-fit:contain;
    display:block;
    border-radius:4px;
    transition:.2s ease;
}

.image-button:hover img{
    transform:scale(1.01);
}

.image-button:active img{
    transform:scale(.99);
}

/* WORD TABLE */
.words-area{
    width:min(760px,100%);
    margin:0 auto;
    position:relative;
}

/* RIBBON */
.ribbon{
    position:absolute;
    left:-62px;
    top:-24px;
    width:105px;
    height:145px;
    z-index:5;
    pointer-events:none;
}

.ribbon-top{
    position:absolute;
    width:78px;
    height:45px;
    background:#ed1979;
    border-radius:50% 50% 45% 45%;
    left:10px;
    top:0;
    transform:rotate(-10deg);
}

.ribbon-top::before,
.ribbon-top::after{
    content:"";
    position:absolute;
    width:22px;
    height:55px;
    background:#ed1979;
    top:25px;
}

.ribbon-top::before{left:0;transform:rotate(18deg)}
.ribbon-top::after{right:0;transform:rotate(-18deg)}

.ribbon-tail-left,
.ribbon-tail-right{
    position:absolute;
    width:22px;
    height:100px;
    background:#ed1979;
    top:34px;
}

.ribbon-tail-left{
    left:23px;
    transform:rotate(8deg);
    clip-path:polygon(0 0,100% 0,85% 75%,45% 100%,35% 68%);
}

.ribbon-tail-right{
    left:54px;
    transform:rotate(-5deg);
    clip-path:polygon(0 0,100% 0,70% 100%,35% 72%);
}

.word-table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
    border:5px solid #0756b5;
    background:#91d8f2;
}

.word-table th,
.word-table td{
    border:4px solid #0756b5;
    padding:0;
}

.word-table th{
    height:78px;
    background:#91d8f2;
    text-align:center;
    vertical-align:middle;
    font-size:38px;
    font-weight:900;
}

.word-table td{
    height:72px;
}

.word-button{
    width:100%;
    height:100%;
    min-height:72px;
    border:0;
    background:transparent;
    color:#000;
    font-family:inherit;
    font-size:34px;
    font-weight:500;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:5px 38px 5px 12px;
    transition:.18s ease;
}

.word-button:hover{
    background:rgba(255,255,255,.18);
}

.word-button:active{
    transform:scale(.98);
}

.letter{
    display:inline;
    padding:0;
    margin:0;
    border-radius:6px;
    transition:background .18s ease,color .18s ease;
}

.letter.highlighted{
    background:#ff3030;
    color:#fff;
}

.word-button.playing{
    background:rgba(255,255,255,.22);
}

.audio-dot{
    position:absolute;
    right:10px;
    top:9px;
    width:10px;
    height:10px;
    border-radius:50%;
    background:#ff3d91;
    opacity:0;
    transform:scale(.5);
}

.word-button.playing .audio-dot{
    opacity:1;
    transform:scale(1);
    animation:pulse .8s infinite alternate;
}

@keyframes pulse{
    from{transform:scale(.8)}
    to{transform:scale(1.3)}
}

/* FLOWERS */
.flowers{
    width:100%;
    height:55px;
    margin-top:10px;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    overflow:hidden;
    pointer-events:none;
}

.flower{
    position:relative;
    width:28px;
    height:44px;
    margin:0 3px;
}

.flower::before{
    content:"🌸";
    position:absolute;
    font-size:27px;
    top:0;
    left:0;
}

.flower::after{
    content:"";
    position:absolute;
    width:2px;
    height:23px;
    background:#319b42;
    left:14px;
    top:26px;
}

.flower:nth-child(2){transform:scale(.8)}
.flower:nth-child(3){transform:scale(1.15)}
.flower:nth-child(4){transform:scale(.9)}
.flower:nth-child(5){transform:scale(1.1)}
.flower:nth-child(6){transform:scale(.8)}
.flower:nth-child(7){transform:scale(1.15)}
.flower:nth-child(8){transform:scale(.9)}
.flower:nth-child(9){transform:scale(1.1)}
.flower:nth-child(10){transform:scale(.85)}

/* PAGE NUMBER */
.page-number{
    text-align:center;
    margin-top:6px;
    font-size:24px;
    line-height:1;
    font-weight:800;
    color:#29427e;
}

/* NAVIGATION */
.navigation{
    width:100%;
    margin-top:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 2px;
}

.nav-btn{
    width:50px;
    height:50px;
    border:0;
    border-radius:50%;
    background:#fffdf3;
    color:#111;
    font-size:24px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 5px 14px rgba(0,0,0,.18);
    transition:.2s ease;
}

.nav-btn:hover{transform:scale(1.08)}
.nav-btn:active{transform:scale(.94)}

.dots{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#aeb5b5;
}

.dot.active{background:#18c900}

/* FLIP */
.flip-out-next{
    animation:flipNext .6s ease forwards;
    transform-origin:left center;
}

.flip-out-prev{
    animation:flipPrev .6s ease forwards;
    transform-origin:right center;
}

@keyframes flipNext{
    0%{transform:rotateY(0)}
    100%{transform:rotateY(-90deg)}
}

@keyframes flipPrev{
    0%{transform:rotateY(0)}
    100%{transform:rotateY(90deg)}
}

/* MOBILE */
@media(max-width:700px){

    body{
        padding:3px 5px 2px;
        overflow:hidden;
    }

    .app{
        width:100%;
        height:100dvh;
        min-height:0;
        display:flex;
        flex-direction:column;
    }

    .book{
        width:100%;
        height:calc(100dvh - 6px);
        min-height:0;
        flex:0 0 auto;
        padding:8px 6px 5px 12px;
        border-radius:20px;
        overflow:hidden;
        display:flex;
        flex-direction:column;
    }

    .book::before{
        width:6px;
        left:-2px;
        top:10px;
        bottom:10px;
    }

    /* TITLE */
    .title-area{
        flex:0 0 58px;
        height:58px;
        margin-bottom:4px;
    }

    .title{
        width:auto;
        max-width:88%;
        min-width:0;
        height:52px;
        min-height:52px;
        padding:5px 18px 7px;
        font-size:23px;
        line-height:1.05;
        border-width:3px;
        box-shadow:0 3px 0 #000;
    }

    .title .spark{
        font-size:15px;
    }

    .spark.s1{left:-20px;top:-10px}
    .spark.s2{right:-20px;top:-7px}
    .spark.s3{left:-28px;top:15px}
    .spark.s4{right:-28px;top:17px}

    /* TOP INTERACTIVE TABLE */
    .image-area{
        flex:0 0 116px;
        height:116px;
        min-height:116px;
        margin:0 0 5px;
        overflow:hidden;
        display:flex;
        align-items:stretch;
    }

    .top-vadamozhi-wrap{
        width:100%;
        height:100%;
        overflow:hidden;
    }

    .top-vadamozhi-table{
        width:100%;
        height:100%;
        border-width:1px;
        table-layout:fixed;
    }

    .top-vadamozhi-table td{
        height:auto;
        border-width:1px;
        padding:0;
    }

    .top-vadamozhi-table .top-head td{
        height:auto;
    }

    .top-vadamozhi-table button,
    .top-vadamozhi-table .top-head button{
        width:100%;
        height:100%;
        min-height:0;
        padding:0;
        line-height:1;
        white-space:nowrap;
        overflow:hidden;
        font-size:8px;
        font-weight:700;
    }

    .top-vadamozhi-table .top-head button{
        font-size:8px;
        font-weight:800;
    }

    /* WORD TABLE */
    .words-area{
        flex:1 1 auto;
        min-height:0;
        width:100%;
        display:flex;
        flex-direction:column;
        overflow:hidden;
    }

    .ribbon{
        display:none;
    }

    .word-table{
        width:100%;
        height:100%;
        flex:1 1 auto;
        min-height:0;
        border-width:2px;
        table-layout:fixed;
    }

    .word-table th,
    .word-table td{
        border-width:1.5px;
    }

    .word-table th{
        height:30px;
        font-size:16px;
        line-height:1;
    }

    .word-table td{
        height:auto;
    }

    .word-button{
        width:100%;
        height:100%;
        min-height:0;
        padding:1px 20px 1px 3px;
        font-size:15px;
        line-height:1;
        white-space:nowrap;
        overflow:hidden;
    }

    .letter{
        display:inline;
        padding:0;
        margin:0;
    }
    .audio-dot{
        right:3px;
        top:3px;
        width:5px;
        height:5px;
    }

    /* FLOWERS */
    .flowers{
        flex:0 0 22px;
        height:22px;
        margin:1px 0 0;
        overflow:hidden;
    }

    .flower{
        width:22px;
        height:30px;
        margin:0 -2px;
        transform:scale(.52)!important;
    }

    /* PAGE NUMBER */
    .page-number{
        flex:0 0 18px;
        height:18px;
        margin:0;
        font-size:14px;
        line-height:18px;
    }

    /* NAVIGATION */
    .navigation{
        flex:0 0 34px;
        height:34px;
        width:100%;
        margin:1px 0 0;
        padding:0 2px;
        display:flex;
        align-items:center;
        justify-content:space-between;
    }

    .nav-btn{
        width:30px;
        height:30px;
        font-size:15px;
        padding:0;
    }

    .dots{
        gap:6px;
    }

    .dot{
        width:7px;
        height:7px;
    }
}

@media(max-width:380px){
    .title{font-size:21px}
    .top-vadamozhi-table button,
    .top-vadamozhi-table .top-head button{font-size:7px}
    .word-table th{font-size:15px}
    .word-button{font-size:14px}
}

}

}

.top-vadamozhi-table button:hover{

}

<audio id="audioPlayer" preload="auto"></audio>

<script>
const audioPlayer = document.getElementById("audioPlayer");
const buttons = document.querySelectorAll(".word-button, .title, .top-vadamozhi-table button");
let activeButton = null;
let highlightTimer = null;

function splitTamilWord(text){
    if(typeof Intl !== "undefined" && Intl.Segmenter){
        const segmenter = new Intl.Segmenter("ta",{granularity:"grapheme"});
        return [...segmenter.segment(text)].map(item=>item.segment);
    }
    return [...text];
}

function getButtonText(button){
    const clone = button.cloneNode(true);
    clone.querySelectorAll(".audio-dot,.spark").forEach(el=>el.remove());
    return clone.textContent.replace(/\s+/g," ").trim();
}

function prepareButton(button){
    if(button.dataset.prepared) return;

    const text = getButtonText(button);
    const letters = splitTamilWord(text);

    button.innerHTML = "";

    const wrapper = document.createElement("span");
    wrapper.className = "letter-wrapper";

    letters.forEach(letter=>{
        const span = document.createElement("span");
        span.className = "letter";
        span.textContent = letter;
        wrapper.appendChild(span);
    });

    button.appendChild(wrapper);

    if(button.classList.contains("title")){
        const sparkPositions = ["s1","s2","s3","s4"];
        sparkPositions.forEach(pos=>{
            const s = document.createElement("span");
            s.className = "spark " + pos;
            s.textContent = "✦";
            button.appendChild(s);
        });
    }

    const dot = document.createElement("span");
    dot.className = "audio-dot";
    button.appendChild(dot);

    button.dataset.prepared = "true";
}

buttons.forEach(prepareButton);

function resetButton(button){
    if(!button) return;
    button.classList.remove("playing");
    button.querySelectorAll(".letter").forEach(letter=>{
        letter.classList.remove("highlighted");
    });
}

function stopCurrentAudio(){
    clearInterval(highlightTimer);
    highlightTimer = null;

    audioPlayer.pause();
    audioPlayer.currentTime = 0;

    if(activeButton) resetButton(activeButton);
    activeButton = null;
}

function highlightLetter(button,index){
    const letters = button.querySelectorAll(".letter");

    letters.forEach((letter,i)=>{
        if(i <= index){
            letter.classList.add("highlighted");
        }
    });
}

function startHighlighting(button){
    const letters = button.querySelectorAll(".letter");
    if(!letters.length) return;

    let times = (button.dataset.times || "")
        .split(",")
        .map(Number)
        .filter(n=>!Number.isNaN(n));

    if(times.length === 0){
        const duration = Number.isFinite(audioPlayer.duration) && audioPlayer.duration > 0
            ? audioPlayer.duration
            : 2;
        const interval = duration / letters.length;
        times = letters.map((_,i)=>i * interval);
    }

    while(times.length < letters.length){
        const last = times.length ? times[times.length-1] : 0;
        times.push(last + 0.4);
    }

    clearInterval(highlightTimer);

    let index = 0;
    highlightLetter(button,index);

    highlightTimer = setInterval(()=>{
        if(!activeButton || audioPlayer.paused) return;

        const currentTime = audioPlayer.currentTime;

        while(index + 1 < letters.length && currentTime >= times[index + 1]){
            index++;
            highlightLetter(button,index);
        }
    },30);
}

buttons.forEach(button=>{
    button.addEventListener("click",()=>{
        const audioFile = button.dataset.audio;

        if(activeButton === button && !audioPlayer.paused){
            stopCurrentAudio();
            return;
        }

        stopCurrentAudio();

        activeButton = button;
        button.classList.add("playing");

        audioPlayer.src = "audio/" + audioFile;
        audioPlayer.currentTime = 0;

        audioPlayer.play()
            .then(()=>{
                startHighlighting(button);
            })
            .catch(error=>{
                console.log("Audio could not play:",error);
                button.classList.remove("playing");
            });
    });
});

audioPlayer.addEventListener("ended",()=>{
    clearInterval(highlightTimer);
    highlightTimer = null;

    if(activeButton){
        activeButton.querySelectorAll(".letter").forEach(letter=>{
            letter.classList.add("highlighted");
        });
        activeButton.classList.remove("playing");
    }

    activeButton = null;
});

function nextPage(page,direction){
    stopCurrentAudio();

    const book = document.querySelector(".book");
    book.classList.remove("flip-out-next","flip-out-prev");
    void book.offsetWidth;

    if(direction === "next"){
        book.classList.add("flip-out-next");
    }else{
        book.classList.add("flip-out-prev");
    }

    setTimeout(()=>{
        window.location.href = page;
    },600);
}
</script>
