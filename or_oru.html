<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ஓர் மற்றும் ஒரு</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:'Noto Sans Tamil',sans-serif;
    background:#63DCEB;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    min-height:100vh;

    overflow-x:hidden;

    padding:20px;
}


/* =====================================================
   APP
===================================================== */

.app{
    width:100%;
    max-width:1000px;

    display:flex;
    flex-direction:column;
    align-items:center;

    transform-style:preserve-3d;
}


/* =====================================================
   BOOK
===================================================== */

.book{
    position:relative;

    width:min(900px,100%);

    background:#FFFDF5;

    border-radius:40px;

    padding:35px 45px 25px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.18);

    overflow:visible;

    transform-style:preserve-3d;
}


/* =====================================================
   SCALLOPED WHITE BORDER
===================================================== */

.book::before{
    content:"";

    position:absolute;

    inset:-14px;

    z-index:-1;

    background:#FFFDF5;

    border-radius:45px;

    box-shadow:
        0 0 0 2px rgba(255,255,255,.3);
}


/* =====================================================
   TOP HEADING
===================================================== */

.main-heading{
    text-align:center;

    font-size:34px;

    line-height:1.35;

    font-weight:600;

    color:#000;

    margin-bottom:20px;
}

.main-heading .red{
    color:#FF2929;
}


/* =====================================================
   PINK SECTION
===================================================== */

.or-section{

    background:#F7D2ED;

    border-radius:25px;

    padding:16px 20px 20px;

    margin-bottom:20px;

    border:2px solid #E29BDF;
}


/* =====================================================
   GREEN SECTION
===================================================== */

.oru-section{

    background:#E3F5D7;

    border-radius:25px;

    padding:16px 20px 20px;

    border:2px solid #A9D98E;
}


/* =====================================================
   SECTION HEADING
===================================================== */

.section-heading{

    text-align:center;

    font-size:28px;

    line-height:1.35;

    font-weight:600;

    color:#000;

    margin-bottom:14px;

    border:none;

    background:transparent;

    font-family:'Noto Sans Tamil',sans-serif;

    cursor:pointer;

    width:100%;

    position:relative;

    padding:0;
}

.section-heading .red{
    color:#FF2929;
}


/* =====================================================
   WORD GRID
===================================================== */

.word-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    column-gap:55px;

    row-gap:8px;
}


/* =====================================================
   WORD BUTTON
===================================================== */

.word-btn{

    position:relative;

    width:100%;

    min-height:58px;

    border:none;

    border-radius:15px;

    padding:7px 18px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:8px;

    font-family:'Noto Sans Tamil',sans-serif;

    font-size:27px;

    font-weight:500;

    color:#000;

    cursor:pointer;

    transition:.2s;

    box-shadow:
        0 4px 8px rgba(0,0,0,.12);
}


/* =====================================================
   PINK BUTTONS
===================================================== */

.or-section .word-btn{

    background:#E6B9E6;

    border:2px solid #C95AD8;
}


/* =====================================================
   GREEN BUTTONS
===================================================== */

.oru-section .word-btn{

    background:#BCE5A9;

    border:2px solid #8BC86C;
}


/* =====================================================
   BUTTON HOVER
===================================================== */

.word-btn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 6px 12px rgba(0,0,0,.16);
}


/* =====================================================
   BUTTON CLICK
===================================================== */

.word-btn:active{

    transform:scale(.97);
}


/* =====================================================
   AUDIO PLAYING
===================================================== */

.word-btn.playing{

    box-shadow:
        0 0 0 3px rgba(255,255,255,.8),
        0 5px 14px rgba(0,0,0,.18);
}


/* =====================================================
   SPEAKER ICON
===================================================== */

.speaker-icon{

    position:absolute;

    top:5px;
    right:7px;

    font-size:11px;

    opacity:.65;

    pointer-events:none;
}


/* =====================================================
   WORD HIGHLIGHT
===================================================== */

.highlight{

    display:inline-block;

    color:#000;

    transition:.25s;
}


/* =====================================================
   ACTIVE RED WORD
===================================================== */

.highlight.active{

    color:#FF1E1E;

    font-weight:800;

    transform:scale(1.07);

    text-shadow:
        0 0 5px rgba(255,0,0,.25);
}


/* =====================================================
   PAGE NUMBER
===================================================== */

.page-number{

    text-align:center;

    margin-top:15px;

    font-size:22px;

    font-weight:800;

    color:#8D64D8;
}


/* =====================================================
   NAVIGATION
===================================================== */

.navigation{

    width:min(900px,100%);

    margin-top:16px;

    padding:0 8px;

    display:flex;

    justify-content:space-between;

    align-items:center;
}


/* =====================================================
   NAV BUTTON
===================================================== */

.nav-btn{

    width:58px;
    height:58px;

    border:none;

    border-radius:50%;

    background:#FFFDF5;

    font-size:28px;

    color:#111;

    cursor:pointer;

    box-shadow:
        0 5px 15px rgba(0,0,0,.18);

    transition:.2s;
}

.nav-btn:hover{
    transform:scale(1.08);
}


/* =====================================================
   DOTS
===================================================== */

.dots{

    display:flex;

    align-items:center;

    gap:10px;
}

.dot{

    width:12px;
    height:12px;

    border-radius:50%;

    background:#A8B0B0;
}

.dot.active{
    background:#19D400;
}


/* =====================================================
   PAGE FLIP
===================================================== */

.app{

    perspective:1500px;

    transform-style:preserve-3d;

    backface-visibility:hidden;
}

.flip-out-next{

    animation:flipNext .6s ease forwards;

    transform-origin:left center;
}

.flip-out-prev{

    animation:flipPrev .6s ease forwards;

    transform-origin:right center;
}


@keyframes flipNext{

    0%{
        transform:rotateY(0deg);
    }

    100%{
        transform:rotateY(-90deg);
    }
}


@keyframes flipPrev{

    0%{
        transform:rotateY(0deg);
    }

    100%{
        transform:rotateY(90deg);
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:768px){

    html,
    body{

        width:100%;
        height:100%;

        overflow:hidden;
    }

    }

    .main-heading{

    }

}


/* =====================================================

    }

    .word-btn{

    }

    .page-number{
        font-size:12px;
    }

}

</style>

<script>

/* =====================================================
   AUDIO VARIABLES
===================================================== */

let currentAudio = null;

let currentButton = null;

let highlightTimers = [];


/* =====================================================
   AUDIO TIMINGS
===================================================== */

/*
   YOU WILL EDIT THESE LATER.

   Example:

   [0,1500]

   means:

   Word 1 starts at 0 ms
   Word 2 starts at 1500 ms

   Example with 3 words:

   [0,1200,2400]

*/

const timings = {


    /* ==========================
       ஓர் WORDS
    ========================== */

    "or_arasan.mp3":[0,1500],

    "or_aamai.mp3":[0,1500],

    "or_ilai.mp3":[0,1500],

    "or_eesal.mp3":[0,1500],

    "or_ural.mp3":[0,1500],

    "or_oonjal.mp3":[0,1500],

    "or_elumbu.mp3":[0,1500],

    "or_eni.mp3":[0,1500],

    "or_aiyar.mp3":[0,1500],

    "or_ottagam.mp3":[0,1500],

    "or_odam.mp3":[0,1500],

    "or_audhadham.mp3":[0,1500],


    /* ==========================
       ஒரு TITLE
    ========================== */

    "oru_title.mp3":[0,2500,4000],


    /* ==========================
       ஒரு WORDS
    ========================== */

    "oru_puthagam.mp3":[0,1500],

    "oru_vedan.mp3":[0,1500],

    "oru_nari.mp3":[0,1500],

    "oru_siruvan.mp3":[0,1500],

    "oru_methai.mp3":[0,1500],

    "oru_veedu.mp3":[0,1500],

    "oru_kottai.mp3":[0,1500],

    "oru_mothiram.mp3":[0,1500],

    "oru_naarkali.mp3":[0,1500],

    "oru_velli.mp3":[0,1500],

    "oru_sattai.mp3":[0,1500],

    "oru_maanavan.mp3":[0,1500]

};


/* =====================================================
   CLEAR HIGHLIGHTS
===================================================== */

function clearHighlights(button){

    if(!button) return;

    button
        .querySelectorAll(".highlight")
        .forEach(word=>{

            word.classList.remove("active");

        });

}


/* =====================================================
   CLEAR TIMERS
===================================================== */

function clearTimers(){

    highlightTimers.forEach(timer=>{

        clearTimeout(timer);

    });

    highlightTimers=[];

}


/* =====================================================
   HIGHLIGHT WORDS
===================================================== */

function animateWords(button){

    clearTimers();

    clearHighlights(button);


    const words =
        button.querySelectorAll(".highlight");


    const audio =
        button.dataset.audio;


    const times =
        timings[audio];


    if(!times) return;


    times.forEach((time,index)=>{

        const timer=setTimeout(()=>{

            if(currentButton!==button)
                return;


            words.forEach(word=>{

                word.classList.remove("active");

            });


            if(words[index]){

                words[index]
                    .classList.add("active");

            }

        },time);


        highlightTimers.push(timer);

    });

}


/* =====================================================
   STOP AUDIO
===================================================== */

function stopCurrent(){

    clearTimers();


    if(currentAudio){

        currentAudio.pause();

        currentAudio.currentTime=0;

        currentAudio=null;

    }


    if(currentButton){

        currentButton
            .classList.remove("playing");

        clearHighlights(currentButton);

        currentButton=null;

    }

}


/* =====================================================
   AUDIO BUTTONS
===================================================== */

document
    .querySelectorAll("[data-audio]")
    .forEach(button=>{


    button.addEventListener("click",()=>{


        /* SAME BUTTON = STOP */

        if(
            currentButton===button &&
            currentAudio
        ){

            stopCurrent();

            return;

        }


        /* STOP PREVIOUS AUDIO */

        stopCurrent();


        currentButton=button;


        currentAudio =
            new Audio(button.dataset.audio);


        button.classList.add("playing");


        animateWords(button);


        currentAudio
            .play()
            .catch(error=>{

                console.log(
                    "Audio could not be played:",
                    button.dataset.audio
                );

            });


        currentAudio.onended=()=>{

            clearTimers();

            clearHighlights(button);

            button.classList.remove("playing");

            currentAudio=null;

            currentButton=null;

        };


        currentAudio.onerror=()=>{

            console.log(
                "Cannot load audio:",
                button.dataset.audio
            );

            stopCurrent();

        };

    });

});


/* =====================================================
   SPACEBAR
===================================================== */

document.addEventListener("keydown",(e)=>{

    if(e.code!=="Space")
        return;

    e.preventDefault();


    if(!currentAudio)
        return;


    if(currentAudio.paused){

        currentAudio.play();

    }
    else{

        currentAudio.pause();

    }

});


/* =====================================================
   ESC = STOP
===================================================== */

document.addEventListener("keydown",(e)=>{

    if(e.key==="Escape"){

        stopCurrent();

    }

});


/* =====================================================
   STOP AUDIO WHEN LEAVING
===================================================== */

window.addEventListener(
    "beforeunload",
    ()=>{

        stopCurrent();

    }
);


/* =====================================================
   PAGE FLIP
===================================================== */

function nextPage(page,direction){

    stopCurrent();


    const app =
        document.querySelector(".app");


    /* REMOVE OLD FLIP */

    app.classList.remove(
        "flip-out-next",
        "flip-out-prev"
    );


    /* RESTART ANIMATION */

    void app.offsetWidth;


    if(direction==="next"){

        app.classList.add(
            "flip-out-next"
        );

    }
    else{

        app.classList.add(
            "flip-out-prev"
        );

    }


    /* WAIT FOR FLIP */

    setTimeout(()=>{

        window.location.href=page;

    },600);

}


/* =====================================================
   PREVENT DOUBLE TAP ZOOM
===================================================== */

let lastTouchEnd=0;

document.addEventListener(
    "touchend",
    (event)=>{

        const now =
            new Date().getTime();


        if(
            now-lastTouchEnd<=300
        ){

            event.preventDefault();

        }


        lastTouchEnd=now;

    },
    {passive:false}
);

</script>


</body>
