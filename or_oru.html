<!DOCTYPE html>
<html lang="ta">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OR & ORU</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

/* =====================================================
   RESET
===================================================== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:'Noto Sans Tamil',sans-serif;
    background:#111D66;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
    overflow-x:hidden;
    padding:28px 18px;
}

/* =====================================================
   APP
===================================================== */
.app{
    width:100%;
    max-width:1050px;
    display:flex;
    flex-direction:column;
    align-items:center;
    transform-style:preserve-3d;
    perspective:1500px;
    backface-visibility:hidden;
}

/* =====================================================
   BOOK
===================================================== */
.book{
    position:relative;
    width:min(980px,100%);
    background:#FFFDF5;
    border-radius:48px;
    padding:38px 58px 24px;
    box-shadow:0 12px 30px rgba(0,0,0,.18);
    overflow:visible;
    transform-style:preserve-3d;
}

/* Decorative white scallop-style outer frame */
.book::before{
    content:"";
    position:absolute;
    inset:-13px;
    z-index:-1;
    border-radius:58px;
    background:
        radial-gradient(circle at 20px 0,#FFFDF5 0 21px,transparent 22px) 0 0/40px 25px repeat-x,
        radial-gradient(circle at 20px 100%,#FFFDF5 0 21px,transparent 22px) 0 100%/40px 25px repeat-x,
        radial-gradient(circle at 0 20px,#FFFDF5 0 21px,transparent 22px) 0 0/25px 40px repeat-y,
        radial-gradient(circle at 100% 20px,#FFFDF5 0 21px,transparent 22px) 100% 0/25px 40px repeat-y;
}

/* =====================================================
   DECORATIVE CORNERS
===================================================== */
 .book::after{
    content:"";
    position:absolute;
    pointer-events:none;
}


/* =====================================================
   PURPLE FLOWERS - TOP RIGHT
===================================================== */
.purple-flowers{
    position:absolute;
    right:-18px;
    top:-25px;
    width:170px;
    height:145px;
    z-index:10;
    pointer-events:none;
}

.purple-flowers .flower{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#9B3FB6;
    font-family:Arial,sans-serif;
    line-height:1;
    text-shadow:
        8px 0 #C66BD4,
        -6px 5px #7C2E99,
        0 0 3px rgba(255,255,255,.8);
}

.purple-flowers .flower1{
    right:22px;
    top:5px;
    font-size:58px;
    transform:rotate(-15deg);
}

.purple-flowers .flower2{
    right:73px;
    top:36px;
    font-size:43px;
    transform:rotate(18deg);
}

.purple-flowers .flower3{
    right:0;
    top:65px;
    font-size:40px;
    transform:rotate(-12deg);
}

.purple-flowers .flower4{
    right:105px;
    top:2px;
    font-size:30px;
    transform:rotate(25deg);
}

.purple-flowers .stem{
    position:absolute;
    width:3px;
    height:90px;
    background:#648B4A;
    border-radius:5px;
    transform-origin:bottom;
}

.purple-flowers .stem1{
    right:60px;
    top:48px;
    transform:rotate(35deg);
}

.purple-flowers .stem2{
    right:25px;
    top:48px;
    transform:rotate(12deg);
}

/* =====================================================
   GREEN LEAVES - BOTTOM LEFT
===================================================== */
.green-leaves{
    position:absolute;
    left:-16px;
    bottom:-8px;
    width:145px;
    height:145px;
    z-index:10;
    pointer-events:none;
}

.green-leaves .leaf-stem{
    position:absolute;
    left:47px;
    bottom:7px;
    width:4px;
    height:125px;
    background:#4C8C39;
    border-radius:5px;
    transform:rotate(-18deg);
    transform-origin:bottom;
}

.green-leaves .leaf{
    position:absolute;
    width:48px;
    height:22px;
    background:#78B94C;
    border:2px solid #4E9135;
    border-radius:100% 0 100% 0;
    transform-origin:bottom left;
}

.green-leaves .leaf1{
    left:35px;
    bottom:34px;
    transform:rotate(-55deg);
}

.green-leaves .leaf2{
    left:48px;
    bottom:58px;
    transform:rotate(-18deg);
    background:#8CC85B;
}

.green-leaves .leaf3{
    left:52px;
    bottom:83px;
    transform:rotate(25deg);
}

.green-leaves .leaf4{
    left:24px;
    bottom:76px;
    transform:rotate(-78deg);
    background:#69AA43;
}

.green-leaves .leaf5{
    left:70px;
    bottom:103px;
    transform:rotate(40deg);
    background:#9BD66B;
}

.green-leaves .leaf6{
    left:18px;
    bottom:108px;
    transform:rotate(-35deg);
    background:#83C65A;
}

/* Keep both blue title boxes OUTSIDE their coloured sections */
.main-heading{
    position:relative;
    z-index:3;
}

.section-heading{
    position:relative;
    z-index:3;
}

/* =====================================================
   MOBILE DECORATIONS
===================================================== */
@media(max-width:768px){

    .purple-flowers{
        right:-7px;
        top:-10px;
        width:82px;
        height:72px;
    }

    .purple-flowers .flower1{
        right:5px;
        top:0;
        font-size:30px;
    }

    .purple-flowers .flower2{
        right:28px;
        top:18px;
        font-size:23px;
    }

    .purple-flowers .flower3{
        right:-2px;
        top:35px;
        font-size:22px;
    }

    .purple-flowers .flower4{
        right:47px;
        top:0;
        font-size:17px;
    }

    .purple-flowers .stem{
        height:45px;
        width:2px;
    }

    .purple-flowers .stem1{
        right:29px;
        top:25px;
    }

    .purple-flowers .stem2{
        right:12px;
        top:25px;
    }

    .green-leaves{
        left:-7px;
        bottom:-5px;
        width:72px;
        height:72px;
    }

    .green-leaves .leaf-stem{
        left:25px;
        height:65px;
        width:2px;
    }

    .green-leaves .leaf{
        width:27px;
        height:13px;
        border-width:1px;
    }

    .green-leaves .leaf1{
        left:19px;
        bottom:17px;
    }

    .green-leaves .leaf2{
        left:25px;
        bottom:29px;
    }

    .green-leaves .leaf3{
        left:27px;
        bottom:42px;
    }

    .green-leaves .leaf4{
        left:12px;
        bottom:38px;
    }

    .green-leaves .leaf5{
        left:36px;
        bottom:51px;
    }

    .green-leaves .leaf6{
        left:8px;
        bottom:54px;
    }
}

/* =====================================================
   MAIN HEADING
===================================================== */
.main-heading{
    display:block;
    width:78%;
    margin:0 auto 28px;
    padding:10px 28px 12px;

    background:#C7EEF5;
    border:3px solid #C99719;

    color:#111;
    text-align:center;
    font-family:'Noto Sans Tamil',sans-serif;
    font-size:23px;
    line-height:1.28;
    font-weight:700;

    border-radius:0;
    box-shadow:
        -16px 10px 0 #642080,
        16px 10px 0 #642080;

    cursor:pointer;
    position:relative;
}

.main-heading .red{
    color:#FF3030;
}

/* =====================================================
   SECTIONS
===================================================== */
.or-section,
.oru-section{
    position:relative;
    border-radius:24px;
    padding:17px 22px 20px;
}

.or-section{
    background:#F4C7E9;
    border:2px solid #D36ADF;
    margin-bottom:22px;
}

.oru-section{
    background:#E2F5D6;
    border:2px solid #9ACF70;
}

/* =====================================================
   SECTION HEADING
===================================================== */
.section-heading{
    display:block;
    width:88%;
    margin:0 auto 14px;

    padding:9px 18px 10px;

    background:#C7EEF5;
    border:3px solid #C99719;

    color:#111;
    text-align:center;
    font-family:'Noto Sans Tamil',sans-serif;
    font-size:23px;
    line-height:1.28;
    font-weight:700;

    cursor:pointer;
    position:relative;
}

.section-heading::before{
    content:"";
    position:absolute;
    left:-14px;
    top:8px;
    bottom:-10px;
    width:24px;
    background:#57942C;
    z-index:-1;
}

.section-heading .red{
    color:#FF3030;
}

/* =====================================================
   WORD GRID
===================================================== */
.word-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    column-gap:72px;
    row-gap:10px;
}

/* =====================================================
   WORD BUTTONS
===================================================== */
.word-btn{
    position:relative;
    width:100%;
    min-height:62px;

    border-radius:17px;
    padding:7px 25px;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;

    font-family:'Noto Sans Tamil',sans-serif;
    font-size:28px;
    font-weight:500;
    line-height:1.05;
    color:#000;

    cursor:pointer;
    transition:.2s;
}

/* ONLY ஓர் / ஒரு IS BOLD */
.word-btn .highlight{
    font-weight:500;
}

.word-btn .highlight:first-child{
    font-weight:800;
}

/* Pink buttons */
.or-section .word-btn{
    background:#E5B7E5;
    border:2px solid #C95AD8;
    box-shadow:
        0 4px 0 rgba(201,90,216,.20),
        0 5px 9px rgba(0,0,0,.10);
}

/* Green buttons */
.oru-section .word-btn{
    background:#BCE7A9;
    border:2px solid #8BC86C;
    box-shadow:
        0 4px 0 rgba(139,200,108,.20),
        0 5px 9px rgba(0,0,0,.10);
}

/* Soft offset outline */
.or-section .word-btn::before,
.oru-section .word-btn::before{
    content:"";
    position:absolute;
    inset:3px -6px -4px 5px;
    border-radius:18px;
    z-index:-1;
}

.or-section .word-btn::before{
    background:#EAC6EA;
}

.oru-section .word-btn::before{
    background:#C9EFB9;
}

.word-btn:hover{
    transform:translateY(-2px);
}

.word-btn:active{
    transform:scale(.98);
}

/* =====================================================
   AUDIO PLAYING
===================================================== */
.word-btn.playing{
    box-shadow:
        0 0 0 3px rgba(255,255,255,.9),
        0 5px 14px rgba(0,0,0,.18);
}

/* =====================================================
   SPEAKER ICON
===================================================== */
.speaker-icon{
    position:absolute;
    top:5px;
    right:8px;
    font-size:11px;
    opacity:.65;
    pointer-events:none;
}

/* =====================================================
   WORD HIGHLIGHT
===================================================== */
.highlight{
    display:inline-block;
    color:#000;
    transition:.25s;
}

.highlight.active{
    color:#FF1E1E;
    font-weight:800;
    transform:scale(1.07);
    text-shadow:0 0 5px rgba(255,0,0,.25);
}

/* =====================================================
   PAGE NUMBER
===================================================== */
.page-number{
    text-align:center;
    margin-top:12px;
    font-size:22px;
    line-height:1;
    font-weight:800;
    color:#263B80;
}

/* =====================================================
   NAVIGATION
===================================================== */
.navigation{
    width:min(980px,100%);
    margin-top:17px;
    padding:0 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.nav-btn{
    width:55px;
    height:55px;
    border:none;
    border-radius:50%;
    background:#FFFDF5;
    font-size:27px;
    color:#111;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,.18);
    transition:.2s;
}

.nav-btn:hover{
    transform:scale(1.08);
}

.dots{
    display:flex;
    align-items:center;
    gap:9px;
}

.dot{
    width:11px;
    height:11px;
    border-radius:50%;
    background:#A8B0B0;
}

.dot.active{
    background:#19D400;
}

/* =====================================================
   PAGE FLIP
===================================================== */
.flip-out-next{
    animation:flipNext .6s ease forwards;
    transform-origin:left center;
}

.flip-out-prev{
    animation:flipPrev .6s ease forwards;
    transform-origin:right center;
}

@keyframes flipNext{
    0%{transform:rotateY(0deg);}
    100%{transform:rotateY(-90deg);}
}

@keyframes flipPrev{
    0%{transform:rotateY(0deg);}
    100%{transform:rotateY(90deg);}
}

/* =====================================================
   MOBILE
===================================================== */
@media(max-width:768px){

    html,body{
        width:100%;
        height:100%;
        overflow:hidden;
    }

    body{
        min-height:100dvh;
        padding:8px;
        align-items:center;
    }

    .app{
        width:100%;
        max-width:430px;
        height:100dvh;
        padding:6px;
    }

    .book{
        width:100%;
        height:calc(100dvh - 62px);
        padding:11px 9px 6px;
        border-radius:25px;
        display:flex;
        flex-direction:column;
        overflow:hidden;
    }

    .book::before{
        inset:-7px;
        border-radius:31px;
    }

    .book::after{
        right:-8px;
        top:-16px;
        font-size:25px;
    }

    .main-heading{
        width:88%;
        margin:0 auto 8px;
        padding:6px 10px 7px;
        font-size:11px;
        line-height:1.22;
        box-shadow:
            -8px 5px 0 #642080,
            8px 5px 0 #642080;
        flex-shrink:0;
    }

    .or-section,
    .oru-section{
        flex:1;
        min-height:0;
        padding:6px 7px 7px;
        border-radius:17px;
        display:flex;
        flex-direction:column;
    }

    .or-section{
        margin-bottom:7px;
    }

    .section-heading{
        width:88%;
        margin:0 auto 5px;
        padding:5px 7px;
        font-size:11px;
        line-height:1.18;
        flex-shrink:0;
    }

    .section-heading::before{
        left:-7px;
        top:4px;
        bottom:-6px;
        width:13px;
    }

    .word-grid{
        flex:1;
        min-height:0;
        display:grid;
        grid-template-columns:1fr 1fr;
        grid-template-rows:repeat(6,1fr);
        column-gap:7px;
        row-gap:5px;
    }

    .word-btn{
        width:100%;
        height:100%;
        min-height:0;
        padding:0 4px;
        border-radius:9px;
        font-size:15px;
        gap:4px;
        border-width:1px;
        line-height:1;
    }

    .word-btn .highlight:first-child{
        font-weight:800;
    }

    .speaker-icon{
        top:2px;
        right:4px;
        font-size:7px;
    }

    .page-number{
        flex-shrink:0;
        margin-top:4px;
        font-size:13px;
    }

    .navigation{
        width:100%;
        height:34px;
        margin-top:2px;
        padding:0 5px;
        flex-shrink:0;
    }

    .nav-btn{
        width:32px;
        height:32px;
        font-size:17px;
    }

    .dots{
        gap:5px;
    }

    .dot{
        width:7px;
        height:7px;
    }
}

@media(max-width:360px){

    .main-heading{
        font-size:14px;
    }

    .section-heading{
        font-size:12px;
    }

    .word-btn{
        font-size:13px;
    }

    .page-number{
        font-size:12px;
    }
}


/* =====================================================
   MATCH BOTH SECTION HEADINGS
===================================================== */
.section-heading{
    flex-shrink:0;
}

.oru-section{
    margin-top:0;
}

</style>

</head>

<script>

/* =====================================================
   AUDIO VARIABLES
===================================================== */

let currentAudio = null;

let currentButton = null;

let highlightTimers = [];


/* =====================================================
   AUDIO TIMINGS
===================================================== */

/*
   YOU WILL EDIT THESE LATER.

   Example:

   [0,1500]

   means:

   Word 1 starts at 0 ms
   Word 2 starts at 1500 ms

   Example with 3 words:

   [0,1200,2400]

*/

const timings = {

    "title.mp3":[0,2500,4000],

    "or_arasan.mp3":[0,2000],
    "or_elumbu.mp3":[0,2000],
    "or_aamai.mp3":[0,2000],
    "or_eni.mp3":[0,2000],
    "or_ilai.mp3":[0,2000],
    "or_aiyar.mp3":[0,2000],
    "or_eesal.mp3":[0,2000],
    "or_ottagam.mp3":[0,2000],
    "or_ural.mp3":[0,2000],
    "or_odam.mp3":[0,2000],
    "or_unjal.mp3":[0,2000],
    "or_audhadham.mp3":[0,2000],

    "oru_title.mp3":[0,2500,4000],

    "oru_puthagam.mp3":[0,2000],
    "oru_kottai.mp3":[0,2000],
    "oru_vedan.mp3":[0,2000],
    "oru_mothiram.mp3":[0,2000],
    "oru_nari.mp3":[0,2000],
    "oru_naarkali.mp3":[0,2000],
    "oru_siruvan.mp3":[0,2000],
    "oru_velli.mp3":[0,2000],
    "oru_methei.mp3":[0,2000],
    "oru_sattai.mp3":[0,2000],
    "oru_vidu.mp3":[0,2000],
    "oru_manavan.mp3":[0,2000]

};



/* =====================================================
   CLEAR HIGHLIGHTS
===================================================== */

function clearHighlights(button){

    if(!button) return;

    button
        .querySelectorAll(".highlight")
        .forEach(word=>{

            word.classList.remove("active");

        });

}


/* =====================================================
   CLEAR TIMERS
===================================================== */

function clearTimers(){

    highlightTimers.forEach(timer=>{

        clearTimeout(timer);

    });

    highlightTimers=[];

}


/* =====================================================
   HIGHLIGHT WORDS
===================================================== */

function animateWords(button){

    clearTimers();

    clearHighlights(button);


    const words =
        button.querySelectorAll(".highlight");


    const audio =
        button.dataset.audio;


    const times =
        timings[audio];


    if(!times) return;


    times.forEach((time,index)=>{

        const timer=setTimeout(()=>{

            if(currentButton!==button)
                return;


            words.forEach(word=>{

                word.classList.remove("active");

            });


            if(words[index]){

                words[index]
                    .classList.add("active");

            }

        },time);


        highlightTimers.push(timer);

    });

}


/* =====================================================
   STOP AUDIO
===================================================== */

function stopCurrent(){

    clearTimers();


    if(currentAudio){

        currentAudio.pause();

        currentAudio.currentTime=0;

        currentAudio=null;

    }


    if(currentButton){

        currentButton
            .classList.remove("playing");

        clearHighlights(currentButton);

        currentButton=null;

    }

}


/* =====================================================
   AUDIO BUTTONS
===================================================== */

document
    .querySelectorAll("[data-audio]")
    .forEach(button=>{


    button.addEventListener("click",()=>{


        /* SAME BUTTON = STOP */

        if(
            currentButton===button &&
            currentAudio
        ){

            stopCurrent();

            return;

        }


        /* STOP PREVIOUS AUDIO */

        stopCurrent();


        currentButton=button;


        currentAudio =
            new Audio(button.dataset.audio);


        button.classList.add("playing");


        animateWords(button);


        currentAudio
            .play()
            .catch(error=>{

                console.log(
                    "Audio could not be played:",
                    button.dataset.audio
                );

            });


        currentAudio.onended=()=>{

            clearTimers();

            clearHighlights(button);

            button.classList.remove("playing");

            currentAudio=null;

            currentButton=null;

        };


        currentAudio.onerror=()=>{

            console.log(
                "Cannot load audio:",
                button.dataset.audio
            );

            stopCurrent();

        };

    });

});


/* =====================================================
   SPACEBAR
===================================================== */

document.addEventListener("keydown",(e)=>{

    if(e.code!=="Space")
        return;

    e.preventDefault();


    if(!currentAudio)
        return;


    if(currentAudio.paused){

        currentAudio.play();

    }
    else{

        currentAudio.pause();

    }

});


/* =====================================================
   ESC = STOP
===================================================== */

document.addEventListener("keydown",(e)=>{

    if(e.key==="Escape"){

        stopCurrent();

    }

});


/* =====================================================
   STOP AUDIO WHEN LEAVING
===================================================== */

window.addEventListener(
    "beforeunload",
    ()=>{

        stopCurrent();

    }
);


/* =====================================================
   PAGE FLIP
===================================================== */

function nextPage(page,direction){

    stopCurrent();


    const app =
        document.querySelector(".app");


    /* REMOVE OLD FLIP */

    app.classList.remove(
        "flip-out-next",
        "flip-out-prev"
    );


    /* RESTART ANIMATION */

    void app.offsetWidth;


    if(direction==="next"){

        app.classList.add(
            "flip-out-next"
        );

    }
    else{

        app.classList.add(
            "flip-out-prev"
        );

    }


    /* WAIT FOR FLIP */

    setTimeout(()=>{

        window.location.href=page;

    },600);

}


/* =====================================================
   PREVENT DOUBLE TAP ZOOM
===================================================== */

let lastTouchEnd=0;

document.addEventListener(
    "touchend",
    (event)=>{

        const now =
            new Date().getTime();


        if(
            now-lastTouchEnd<=300
        ){

            event.preventDefault();

        }


        lastTouchEnd=now;

    },
    {passive:false}
);

</script>


</body>
