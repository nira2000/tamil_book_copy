<style>
/* ==========================================
   RESET
========================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: 'Noto Sans Tamil', sans-serif;
    background: #111D66;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    padding: 20px;
}

/* ==========================================
   APP
========================================== */

.app {
    width: 100%;
    max-width: 800px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transform-style: preserve-3d;
}

/* ==========================================
   HEADER
========================================== */

.header {
    color: white;
    text-align: center;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 6px;
    text-shadow:
        0 0 8px white,
        0 0 15px #4FC3F7,
        0 0 35px #4FC3F7;
}

/* ==========================================
   BOOK
========================================== */

.book {
    position: relative;
    width: 100%;
    max-width: 900px;
    background: #F8F1E4;
    border-radius: 30px;
    padding: 28px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
}

/* RED SPINE */

.book::before {
    content: "";
    position: absolute;
    left: -10px;
    top: 20px;
    bottom: 20px;
    width: 18px;
    background: #D40C02;
    border-radius: 12px;
    z-index: 3;
    pointer-events: none;
}

/* ==========================================
   BOOK CONTENT
========================================== */

.book-content {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow: hidden;
}

/* ==========================================
   BACKGROUND IMAGE
   CLEAR ON DESKTOP AND MOBILE
========================================== */

.bg-image {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    opacity: 1;
    pointer-events: none;
    user-select: none;
    z-index: 0;
}

/* ==========================================
   PAGE
========================================== */

.page {
    position: relative;
    width: 100%;
    z-index: 2;
}

/* ==========================================
   TITLE
========================================== */

.title {
    display: block;
    margin: 0 auto 28px;
    background: #FFE7A5;
    border: 3px solid #E4C86A;
    border-radius: 40px;
    padding: 12px 34px;
    font-family: inherit;
    font-size: 46px;
    font-weight: 800;
    color: #D94C4C;
    cursor: pointer;
    position: relative;
    transition: .25s;
}

.title:hover {
    transform: translateY(-2px);
}

/* ==========================================
   PROVERB LIST
========================================== */

.proverb-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

/* ==========================================
   BUTTONS
========================================== */

.rule-btn {
    width: 100%;
    background: rgba(255, 255, 255, .78);
    border: 2px solid rgba(0, 0, 0, .12);
    border-radius: 18px;
    padding: 14px 18px;
    text-align: left;
    font-family: inherit;
    font-size: 29px;
    font-weight: 700;
    color: #222;
    cursor: pointer;
    position: relative;
    transition: .25s;
}

.rule-btn:hover {
    background: #FFF;
    transform: translateX(5px);
    box-shadow: 0 6px 18px rgba(0, 0, 0, .15);
}

/* ==========================================
   SPEAKER
========================================== */

.speaker-icon {
    position: absolute;
    top: 8px;
    right: 10px;
    font-size: 13px;
    opacity: .8;
    pointer-events: none;
}

/* ==========================================
   WORD HIGHLIGHT
========================================== */

.highlight {
    display: inline-block;
    padding: 2px 3px;
    border-radius: 6px;
    transition: .25s;
}

.highlight.active {
    background: #FFF59A;
    color: #C62828;
    box-shadow: 0 0 8px rgba(255, 215, 0, .8);
}

/* ==========================================
   ACTIVE BUTTON
========================================== */

.speaker-btn.active {
    background: #FFF7C2;
}

/* ==========================================
   PAGE NUMBER
========================================== */

.page-number {
    margin-top: 18px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    color: #9D68D3;
}

/* ==========================================
   NAVIGATION
========================================== */

.navigation {
    width: 100%;
    margin-top: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.nav-btn {
    width: 60px;
    height: 60px;
    flex-shrink: 0;
    border: none;
    border-radius: 50%;
    background: #F8F1E4;
    font-size: 28px;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0, 0, 0, .2);
}

.dots {
    display: flex;
    gap: 10px;
}

.dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #B0B0B0;
}

.dot.active {
    background: #19D400;
}


.highlight {
    margin: 0 !important;
    padding: 0 !important;
    letter-spacing: 0 !important;
    word-spacing: 0 !important;
}





/* ==========================================
   MOBILE LAYOUT FIX
========================================== */

@media (max-width: 768px) {

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }

    body {
        background: #111D66;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1400px;
    }

    /* APP */

    .app {
        width: 100%;
        height: 100dvh;
        max-width: 100%;
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        min-height: 0;
    }

    /* HEADER */

    .header {
        flex: 0 0 auto;
        width: 100%;
        font-size: 12px;
        line-height: 1.3;
        margin: 0;
        text-align: center;
    }

    /* BOOK */

    .book {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        max-width: 410px;
        margin: 0 auto;
        padding: 10px 9px 6px 12px;
        display: flex;
        flex-direction: column;
        border-radius: 20px;
        overflow: hidden;
    }

    .book::before {
        left: 0;
        top: 10px;
        bottom: 10px;
        width: 5px;
        border-radius: 5px;
    }

    /* CONTENT AREA */

    .book-content {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        display: block;
        overflow: hidden;
    }

    /* CLEAR BACKGROUND IMAGE */

    .bg-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        opacity: 1;
        z-index: 0;
    }

    /* PAGE CONTENT */

    .page {
        position: relative;
        z-index: 2;
        width: 100%;
    }

    /* TITLE */

    .title {
        width: 90%;
        max-width: 300px;
        margin: 0 auto 10px;
        padding: 7px 8px;
        font-size: clamp(19px, 5.5vw, 24px);
        line-height: 1.35;
        border-width: 2px;
        border-radius: 16px;
    }

    /* PROVERBS */

    .proverb-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
    }

    /* PROVERB BUTTONS */

    .rule-btn {
        width: 100%;
        padding: 8px 25px 8px 9px;
        font-size: clamp(13px, 3.7vw, 16px);
        line-height: 1.45;
        border-width: 1px;
        border-radius: 9px;
        text-align: left;
        overflow-wrap: anywhere;
        transition: background-color .2s ease;
    }

    .rule-btn:hover {
        transform: none;
    }

    /* SPEAKER */

    .speaker-icon {
        top: 4px;
        right: 5px;
        font-size: 9px;
    }

    /* WORD HIGHLIGHT */

    .highlight {
        padding: 1px 2px;
        border-radius: 4px;
    }

    .highlight.active {
        box-shadow: 0 0 4px rgba(255, 215, 0, .7);
    }

    /* PAGE NUMBER */

    .page-number {
        flex: 0 0 auto;
        margin: 3px 0 0;
        padding: 0;
        text-align: center;
        font-size: 14px;
        line-height: 1.4;
    }

    /* NAVIGATION */

    .navigation {
        flex: 0 0 auto;
        width: 100%;
        max-width: 410px;
        margin: 0 auto;
        padding: 0 5px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .nav-btn {
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
        font-size: 18px;
    }

    .dots {
        gap: 7px;
        align-items: center;
    }

    .dot {
        width: 8px;
        height: 8px;
        flex: 0 0 8px;
    }
}





/* ==========================================
   PAZHAMOLI PAGE FLIP
========================================== */

body {
    perspective: 1400px;
}

.app {
    transform-style: preserve-3d;
    backface-visibility: hidden;
    will-change: transform, opacity;
}

.flip-out-next {
    animation: pazhamoliFlipNext .6s ease-in-out forwards;
    transform-origin: left center;
}

.flip-out-prev {
    animation: pazhamoliFlipPrev .6s ease-in-out forwards;
    transform-origin: right center;
}

@keyframes pazhamoliFlipNext {
    from {
        transform: rotateY(0deg);
        opacity: 1;
    }

    to {
        transform: rotateY(-85deg);
        opacity: 0;
    }
}

@keyframes pazhamoliFlipPrev {
    from {
        transform: rotateY(0deg);
        opacity: 1;
    }

    to {
        transform: rotateY(85deg);
        opacity: 0;
    }


}
</style>

<script>


/* ===================================
   PAGE 33
   TAMIL MONTHS + AATHICHUDI
=================================== */

let currentAudio = null;
let currentButton = null;
let highlightTimers = [];


/* ==========================
   AUDIO TIMINGS
========================== */

const timings = {

    "title_pazhamozhigal.mp3":[0,2000,3000,4500,5600,6800],

    "pazhamozhi1.mp3":[0,2000,3500,4800],
    "pazhamozhi2.mp3":[0,2000,3500,4800],
    "pazhamozhi3.mp3":[0,2800,4000,5000],
    "pazhamozhi4.mp3":[0,2500],
    "pazhamozhi5.mp3":[0,1600,2500,3300],
    "pazhamozhi6.mp3":[0,2000,3500,4900],
    "pazhamozhi7.mp3":[0,2000,4000,5500]

};

/* ==========================
   CLEAR HIGHLIGHTS
========================== */

function clearHighlights(button){

    if(!button) return;

    button.querySelectorAll(".highlight").forEach(word=>{

        word.classList.remove("active");

    });

}


/* ==========================
   CLEAR TIMERS
========================== */

function clearTimers(){

    highlightTimers.forEach(timer=>{

        clearTimeout(timer);

    });

    highlightTimers=[];

}


/* ==========================
   HIGHLIGHT WORDS
========================== */

function animateWords(button){

    clearTimers();

    clearHighlights(button);

    const words = button.querySelectorAll(".highlight");

    const audio = button.dataset.audio;

    const times = timings[audio];

    if(!times) return;

    times.forEach((time,index)=>{

        const timer = setTimeout(()=>{

            if(currentButton!==button) return;

            words.forEach(w=>{

                w.classList.remove("active");

            });

            if(words[index]){

                words[index].classList.add("active");

            }

        },time);

        highlightTimers.push(timer);

    });

}


/* ==========================
   STOP AUDIO
========================== */

function stopCurrent(){

    clearTimers();

    if(currentAudio){

        currentAudio.pause();

        currentAudio.currentTime=0;

        currentAudio=null;

    }

    if(currentButton){

        currentButton.classList.remove("active");

        clearHighlights(currentButton);

        currentButton=null;

    }

}


/* ==========================
   PLAY AUDIO
========================== */

document.querySelectorAll("[data-audio]").forEach(button=>{

    button.addEventListener("click",()=>{

        /* Click same button again = Stop */

        if(currentButton===button && currentAudio){

            stopCurrent();

            return;

        }

        stopCurrent();

        currentButton=button;

        currentAudio = new Audio(button.dataset.audio);

        button.classList.add("active");

        animateWords(button);

        currentAudio.play();

        currentAudio.onended=()=>{

            clearTimers();

            clearHighlights(button);

            button.classList.remove("active");

            currentAudio=null;

            currentButton=null;

        };

        currentAudio.onerror=()=>{

            console.log("Cannot load audio:",button.dataset.audio);

            stopCurrent();

        };

    });

}); 



/* ==========================
   SPACEBAR
========================== */

document.addEventListener("keydown",(e)=>{

    if(e.code!=="Space") return;

    e.preventDefault();

    if(!currentAudio) return;

    if(currentAudio.paused){

        currentAudio.play();

    }else{

        currentAudio.pause();

    }

});


/* ==========================
   ESC TO STOP
========================== */

document.addEventListener("keydown",(e)=>{

    if(e.key==="Escape"){

        stopCurrent();

    }

});


/* ==========================
   BEFORE UNLOAD
========================== */

window.addEventListener("beforeunload",()=>{

    stopCurrent();

});


/* ==========================
   PREVENT DOUBLE TAP ZOOM
========================== */

let lastTouchEnd=0;

document.addEventListener("touchend",(event)=>{

    const now=(new Date()).getTime();

    if(now-lastTouchEnd<=300){

        event.preventDefault();

    }

    lastTouchEnd=now;

},{passive:false});


/* ==========================
   KEYBOARD NAVIGATION
========================== */

const buttons=[...document.querySelectorAll("[data-audio]")];

buttons.forEach((btn,index)=>{

    btn.setAttribute("tabindex","0");

    btn.addEventListener("keydown",(e)=>{

        if(e.key==="ArrowDown"){

            e.preventDefault();

            if(buttons[index+1]){

                buttons[index+1].focus();

            }

        }

        if(e.key==="ArrowUp"){

            e.preventDefault();

            if(buttons[index-1]){

                buttons[index-1].focus();

            }

        }

        if(e.key==="Enter"){

            e.preventDefault();

            btn.click();

        }

    });

});


/* ==========================
   CLICK ANIMATION
========================== */

document.querySelectorAll(".speaker-btn").forEach(btn=>{

    btn.addEventListener("mousedown",()=>{

        btn.style.transform="scale(.96)";

    });

    btn.addEventListener("mouseup",()=>{

        btn.style.transform="";

    });

    btn.addEventListener("mouseleave",()=>{

        btn.style.transform="";

    });

    btn.addEventListener("touchstart",()=>{

        btn.style.transform="scale(.96)";

    },{passive:true});

    btn.addEventListener("touchend",()=>{

        btn.style.transform="";

    });

});


/* ==========================
   STOP AUDIO WHEN PAGE HIDES
========================== */

document.addEventListener("visibilitychange",()=>{

    if(document.hidden){

        stopCurrent();

    }

});


/* ==========================
   PAGE FLIP
========================== */

function nextPage(page,direction){

    stopCurrent();

    const app=document.querySelector(".app");

    app.classList.remove("flip-out-next","flip-out-prev");

    void app.offsetWidth;

    if(direction==="next"){

        app.classList.add("flip-out-next");

    }else{

        app.classList.add("flip-out-prev");

    }

    setTimeout(()=>{

        window.location.href=page;

    },600);

}


</script>
