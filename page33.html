<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Page 33</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{
    font-family:Arial,sans-serif;
    background:#111D66;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    perspective:1500px;
}

.flip-out-next{
    animation:flipNext .6s ease forwards;
    transform-origin:left center;
}

.flip-out-prev{
    animation:flipPrev .6s ease forwards;
    transform-origin:right center;
}



@keyframes flipNext{

    0%{
        transform:rotateY(0deg);
        opacity:1;
    }

    100%{
        transform:rotateY(-120deg);
        opacity:0;
    }
}

@keyframes flipPrev{

    0%{
        transform:rotateY(0deg);
        opacity:1;
    }

    100%{
        transform:rotateY(120deg);
        opacity:0;
    }
}



/* MAIN APP */

.app{
    width:100%;
    max-width:800px;
    transform-style:preserve-3d;
}

/* HEADER */

.header{
    color:white;
    text-align:center;
    font-size:40px;
    font-weight:bold;
    margin-bottom:15px;

    text-shadow:
        0 0 5px rgba(255,255,255,0.7),
        0 0 12px #4FC3F7,
        0 0 24px #4FC3F7,
        0 0 36px #4FC3F7;

    animation: glowPulse 3s ease-in-out infinite;
}


@keyframes glowPulse{

    0%{
        text-shadow:
            0 0 5px #fff,
            0 0 10px #4FC3F7,
            0 0 20px #4FC3F7;
    }

    50%{
        text-shadow:
            0 0 10px #fff,
            0 0 25px #4FC3F7,
            0 0 50px #4FC3F7,
            0 0 70px #4FC3F7;
    }

    100%{
        text-shadow:
            0 0 5px #fff,
            0 0 10px #4FC3F7,
            0 0 20px #4FC3F7;
    }

}

/* BOOK */

.book{
    position:relative;
    background:#f8f1e4;
    border-radius:30px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

/* RED SPINE */

.book::before{
    content:"";
    position:absolute;
    left:-10px;
    top:25px;
    bottom:25px;
    width:20px;
    background:#D40C02
;
    border-radius:10px;
}

/* CONTENT TITLE */

.page-title{
    text-align:center;
    font-size:40px;
    font-weight:bold;
    margin-bottom:25px;
}

/* CARD */

.audio-card {
        width: 100%;
        background: #efe6d8;
        border: 2px solid #d9a23c;
        border-radius: 12px;
        padding: 8px 10px;
        margin: 0 0 7px;
        cursor: pointer;
        transition: .25s;
    }

.audio-card:hover{
    transform:translateY(-3px);
    box-shadow:0 6px 15px rgba(0,0,0,.15);
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: -30px;
}

.card-title{
    font-size:38px;
    font-weight:bold;
}


/* Make the pictures larger */
.card-image {
    width: 300px;
    height: auto;
    object-fit: contain;
}

.card-content{
    line-height:1.9;
    color:#333;
    font-size:30px;
    font-weight:500;
}


.audio-badge {
    text-align: right;
    margin-top: 8px;
    font-size: 22px;
    line-height: 1;
    pointer-events: none;
}

/* PAGE NUMBER */

.page-number{
    text-align:center;
    color:#9d68d3;
    font-size:22px;
    font-weight:bold;
    margin-top:10px;
}

/* NAVIGATION */

.navigation{
    margin-top:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.nav-btn{
    width:65px;
    height:65px;
    border:none;
    border-radius:50%;
    background:#f8f1e4;
    font-size:28px;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.nav-btn:hover{
    transform:scale(1.05);
}

.dots{
    display:flex;
    gap:10px;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#8da4a4;
}

.dot.active{
    background:#1CFF00;
}

.word {
    transition: 0.3s;
    padding: 0;
    margin: 0;
    border-radius: 0;
}

.highlight {
    background: transparent !important;
    color: #d32f2f;
    font-weight: bold;
    padding: 0;
    margin: 0;
    letter-spacing: 0;
    word-spacing: 0;
}


/* Hanging Board */

.title-board{
    position:relative;
    width:100%;
    display:flex;
    justify-content:center;
    margin-bottom:25px;
    margin-top:-25px;
}

.board {
    position: relative;
    background: #A8D65C;
    color: #000000;
    font-size: 34px;
    font-weight: bold;
    padding: 12px 24px;
    border: 3px solid #000000;
    border-radius: 0;
    text-align: center;
    line-height: 1.3;
    box-shadow: none;
}

.board::before,
.board::after{
    content:"";
    position:absolute;
    width:2px;
    height:18px;
    background:#444;
    top:-18px;
}

.board::before{
    left:18px;
}

.board::after{
    right:18px;
}

.pin {
    position: absolute;
    width: 15px;
    height: 23px;
    background: #30205F;
    border: 2px solid #17112B;
    border-radius: 2px;
    top: -7px;
    z-index: 5;
    transform: rotate(-8deg);
}

.pin.left {
    left: calc(50% - 72px);
}

.pin.right {
    right: calc(50% - 72px);
    transform: rotate(9deg);
}


.title-highlight {
    background: transparent !important;
    color: #d32f2f;
    border-radius: 0;
    padding: 0;
    transition: .3s;
}



/* =========================================================
   MOBILE RESPONSIVE CSS — PAGE 33
   Automatically adapts to different mobile screen sizes
   Desktop layout remains unchanged
   No page scrolling
========================================================= */

@media screen and (max-width: 768px) {

    /* =========================
       PAGE / VIEWPORT
    ========================= */

    html,
    body {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
    }

    body {
        height: 100dvh;
        min-height: 100dvh;
        display: block;
        background: #111D66;
    }


    /* =========================
       MAIN APP
    ========================= */

    .app {
        width: 100%;
        max-width: 520px;
        height: 100dvh;
        min-height: 0;

        margin: 0 auto;

        padding:
            max(4px, env(safe-area-inset-top))
            7px
            max(4px, env(safe-area-inset-bottom));

        display: flex;
        flex-direction: column;
        align-items: stretch;

        gap: 3px;
        overflow: hidden;
    }


    /* =========================
       HEADER
    ========================= */

    .header {
        flex: 0 0 auto;

        margin: 0 0 2px;
        padding: 0;

        font-size: clamp(11px, 3.5vw, 14px);
        line-height: 1.2;

        text-align: center;
    }


    /* =========================
       BOOK
    ========================= */

    .book {
        width: 100%;
        flex: 1 1 auto;
        min-height: 0;

        margin: 0;

        padding:
            clamp(5px, 1.5dvh, 9px)
            clamp(7px, 2vw, 12px)
            3px
            clamp(11px, 3vw, 15px);

        border-radius: 17px;

        display: flex;
        flex-direction: column;

        overflow: hidden;
    }


    /* RED SPINE */

    .book::before {
        width: 6px;
        left: 0;
        top: 9px;
        bottom: 9px;
        border-radius: 6px;
    }


    /* =========================
       BOOK CONTENT
    ========================= */

    .book-content {
        width: 100%;
        flex: 1 1 auto;
        min-height: 0;

        display: flex;
        flex-direction: column;

        overflow: hidden;
    }


    /* =========================
       GREEN TITLE BOARD
    ========================= */

    .title-board {
        flex: 0 0 auto;

        width: 100%;

        margin:
            3px
            auto
            clamp(5px, 1.2dvh, 10px);

        display: flex;
        justify-content: center;
    }

    .board {
        max-width: 95%;

        font-size: clamp(19px, 6vw, 30px);
        line-height: 1.12;

        padding:
            clamp(4px, 1vw, 6px)
            clamp(10px, 3vw, 16px);

        border-width: 2px;
    }

    .pin {
        width: 12px;
        height: 19px;
        top: -6px;
    }

    .pin.left {
        left: calc(50% - 62px);
    }

    .pin.right {
        right: calc(50% - 62px);
    }


    /* =========================
       AUDIO CARDS
    ========================= */

    .audio-card {
        width: 100%;

        flex: 1 1 0;
        min-height: 0;
        min-width: 0;

        margin: 0;

        padding:
            clamp(5px, 1.3dvh, 9px)
            clamp(6px, 2vw, 10px);

        border-radius: 11px;

        display: flex;
        flex-direction: column;

        gap: clamp(2px, 0.5dvh, 5px);

        overflow: hidden;
    }

    .audio-card + .audio-card {
        margin-top: clamp(4px, 0.8dvh, 7px);
    }


    /* =========================
       CARD HEADER
    ========================= */

    .card-header {
        flex: 0 0 auto;

        margin-bottom: 0;

        display: flex;
        align-items: center;
        justify-content: space-between;

        gap: 5px;
        min-width: 0;
    }

    .card-title {
        min-width: 0;

        font-size: clamp(19px, 5.5vw, 27px);
        line-height: 1.15;
    }


    /* =========================
       CARD IMAGES
    ========================= */

    .card-image {
        width: clamp(55px, 21vw, 100px);

        height: auto;

        max-width: 35%;
        max-height: clamp(48px, 12dvh, 90px);

        object-fit: contain;

        flex: 0 1 clamp(55px, 21vw, 100px);
    }


    /* =========================
       CARD TEXT
    ========================= */

    .card-content {
        width: 100%;

        flex: 1 1 auto;
        min-height: 0;
        min-width: 0;

        font-size: clamp(
            12px,
            min(3.7vw, 2dvh),
            17px
        );

        line-height: 1.3;

        font-weight: 500;

        overflow: visible;

        overflow-wrap: normal;
        word-break: normal;
    }


    /* =========================
       HIGHLIGHTED WORDS
    ========================= */

    .word {
        transition: 0.3s;
    }

    .highlight {
        color: #d32f2f;
        font-weight: bold;
    }


    /* =========================
       SPEAKER ICON
    ========================= */

    .audio-badge {
        flex: 0 0 auto;

        font-size: clamp(14px, 4vw, 18px);

        margin-top: 1px;

        line-height: 1;
        text-align: right;
    }


    /* =========================
       PAGE NUMBER
    ========================= */

    .page-number {
        width: 100%;

        flex: 0 0 auto;

        margin: 3px 0 0;
        padding: 0;

        text-align: center;

        font-size: clamp(13px, 3.8vw, 16px);
        line-height: 1.2;

        z-index: 20;
    }


    /* =========================
       NAVIGATION
    ========================= */

    .navigation {
        width: 100%;

        flex: 0 0 39px;

        height: 39px;
        min-height: 39px;

        margin: 0;
        padding: 0 2px 1px;

        display: flex;

        justify-content: space-between;
        align-items: center;

        overflow: hidden;
    }

    .nav-btn {
        width: 34px;
        height: 34px;

        min-width: 34px;
        min-height: 34px;

        flex: 0 0 34px;

        font-size: 18px;
    }


    /* =========================
       NAVIGATION DOTS
    ========================= */

    .dots {
        display: flex;

        gap: 5px;

        align-items: center;
        justify-content: center;
    }

    .dot {
        width: 7px;
        height: 7px;
    }


    /* =========================
       DECORATIONS
    ========================= */

    .swirl {
        left: -8px;
        top: -8px;

        transform: scale(.42);
        transform-origin: top left;

        z-index: 2;
    }

    .curve-top {
        right: -7px;
        top: 3px;

        transform: scale(.52);
        transform-origin: top right;

        z-index: 2;
    }


    /* =========================
       REMOVE HOVER MOVEMENT
    ========================= */

    .audio-card:hover,
    .nav-btn:hover {
        transform: none;
    }

}


/* =========================================================
   EXTRA SMALL / SHORT MOBILE SCREENS
========================================================= */

@media screen and (max-width: 380px) and (max-height: 700px) {

    .board {
        font-size: clamp(18px, 5.5vw, 23px);
    }

    .card-title {
        font-size: clamp(17px, 5vw, 21px);
    }

    .card-image {
        width: clamp(50px, 18vw, 70px);
        max-height: 65px;
        flex-basis: clamp(50px, 18vw, 70px);
    }

    .card-content {
        font-size: 12px;
        line-height: 1.2;
    }

    .audio-card {
        padding: 5px 6px;
    }

}


/* =========================================================
   MOBILE LANDSCAPE
========================================================= */

@media screen and (max-width: 768px) and (orientation: landscape) {

    .header {
        font-size: 11px;
        margin-bottom: 1px;
    }

    .book {
        padding-top: 4px;
    }

    .title-board {
        margin-top: 0;
        margin-bottom: 3px;
    }

    .board {
        font-size: clamp(16px, 3.5vw, 21px);
        padding: 3px 10px;
    }

    .card-title {
        font-size: clamp(16px, 3.5vw, 21px);
    }

    .card-image {
        max-height: 45px;
        width: 65px;
        flex-basis: 65px;
    }

    .card-content {
        font-size: clamp(11px, 2.5vw, 14px);
        line-height: 1.15;
    }

    .audio-card {
        padding: 4px 7px;
        gap: 2px;
    }

}


</style>

<script>

// ===========================================
// VARIABLES
// ===========================================

let highlightTimers = [];
let titleTimer = null;

const audio1 = document.getElementById("audioPlayer1");
const audio2 = document.getElementById("audioPlayer2");

const shopTitle = document.getElementById("shopTitle");
const umbrellaTitle = document.getElementById("umbrellaTitle");


// ===========================================
// INDIVIDUAL WORD TIMINGS
// All values are in milliseconds
// ===========================================

// CARD 1 - கடை
const shopTimings = [

    2000,   // 1. இது
    3000,   // 2. கடை.

    4800,   // 3. இது
    6300,   // 4. ஒரு
    7400,   // 5. சிறிய
    8500,   // 6. கடை.

    10500,   // 7. இது
    11500,  // 8. மாமாவின்
    12600,  // 9. கடை.

    14300,  // 10. மாமாவின்
    16200,  // 11. கடையில்
    17500,  // 12. காடை
    18500,  // 13. முட்டை
    19600   // 14. உள்ளது.

];


// CARD 2 - குடை
const umbrellaTimings = [

    2200,   // 1. இது
    4000,   // 2. என்
    5000,   // 3. குடை.

    6800,   // 4. என்
    7800,   // 5. குடை
    9000,   // 6. ஓடையில்
    10400,   // 7. விழுந்தது.

    12300,  // 8. மழை
    13500,  // 9. பெய்தது;
    15800,  // 10. உடல்
    16800,  // 11. நனைந்தது.

    19000,  // 12. சூரியன்
    20000,  // 13. வந்தது;
    22200,  // 14. உடல்
    23300   // 15. காய்ந்தது.

];


// ===========================================
// CLEAR PARAGRAPH HIGHLIGHTS
// ===========================================

function clearHighlights(container){

    container.querySelectorAll(".word").forEach(word=>{

        word.classList.remove("highlight");

    });

}


// ===========================================
// CLEAR TITLE HIGHLIGHTS
// ===========================================

function clearTitleHighlights(){

    shopTitle.classList.remove("title-highlight");
    umbrellaTitle.classList.remove("title-highlight");

    if(titleTimer){

        clearTimeout(titleTimer);
        titleTimer=null;

    }

}


// ===========================================
// ANIMATE PARAGRAPH
// INDIVIDUAL WORD TIMINGS
// ===========================================

function animateWords(container, timings){

    highlightTimers.forEach(timer=>clearTimeout(timer));

    highlightTimers=[];

    const words=container.querySelectorAll(".word");

    clearHighlights(container);

    words.forEach((word,index)=>{

        if(timings[index] === undefined) return;

        const timer=setTimeout(()=>{

            // Remove highlight from all words first
            words.forEach(w => w.classList.remove("highlight"));

            // Highlight only the current word
            word.classList.add("highlight");

        },timings[index]);

        highlightTimers.push(timer);

    });

}


// ===========================================
// STOP PARAGRAPH
// ===========================================

function stopHighlights(){

    highlightTimers.forEach(timer=>clearTimeout(timer));

    highlightTimers=[];

    clearHighlights(document.getElementById("shopText"));
    clearHighlights(document.getElementById("umbrellaText"));

}


// ===========================================
// STOP EVERYTHING
// ===========================================

function stopAllAudio(){

    audio1.pause();
    audio2.pause();

    audio1.currentTime=0;
    audio2.currentTime=0;

    stopHighlights();

    clearTitleHighlights();

}


// ===========================================
// CARD 1
// ===========================================

function toggleAudio1(){

    if(!audio1.paused){

        stopAllAudio();
        return;

    }

    stopAllAudio();

    shopTitle.classList.add("title-highlight");

    titleTimer=setTimeout(()=>{

        shopTitle.classList.remove("title-highlight");

    },1700);

    audio1.play();

    animateWords(

        document.getElementById("shopText"),

        shopTimings

    );

}


// ===========================================
// CARD 2
// ===========================================

function toggleAudio2(){

    if(!audio2.paused){

        stopAllAudio();
        return;

    }

    stopAllAudio();

    umbrellaTitle.classList.add("title-highlight");

    titleTimer=setTimeout(()=>{

        umbrellaTitle.classList.remove("title-highlight");

    },1700);

    audio2.play();

    animateWords(

        document.getElementById("umbrellaText"),

        umbrellaTimings

    );

}


// ===========================================
// AUDIO ENDED
// ===========================================

audio1.addEventListener("ended",()=>{

    stopHighlights();
    clearTitleHighlights();

});


audio2.addEventListener("ended",()=>{

    stopHighlights();
    clearTitleHighlights();

});


// ===========================================
// PAGE FLIP
// ===========================================

function nextPage(page,direction){

    const app=document.querySelector(".app");

    app.classList.remove("flip-out-next","flip-out-prev");

    void app.offsetWidth;

    if(direction==="next"){

        app.classList.add("flip-out-next");

    }
    else{

        app.classList.add("flip-out-prev");

    }

    setTimeout(()=>{

        window.location.href=page;

    },600);

}

</script>
