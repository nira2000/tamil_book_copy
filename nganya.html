<!DOCTYPE html>
<html lang="ta">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>THOGUTHI 8</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>



<style>
    

/* ===========================================
   RESET
=========================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Noto Sans Tamil',sans-serif;
    background:#1b2c73;
    padding:20px;
    overflow-x:hidden;
    overflow-y:auto;
    perspective:1500px;
}

/* ===========================================
   FLIP ANIMATION
=========================================== */

.flip-out-next{
    animation:flipNext .6s ease forwards;
    transform-origin:left center;
}

.flip-out-prev{
    animation:flipPrev .6s ease forwards;
    transform-origin:right center;
}

@keyframes flipNext{
    from{
        transform:rotateY(0);
        opacity:1;
    }
    to{
        transform:rotateY(-120deg);
        opacity:0;
    }
}

@keyframes flipPrev{
    from{
        transform:rotateY(0);
        opacity:1;
    }
    to{
        transform:rotateY(120deg);
        opacity:0;
    }
}

/* ===========================================
   WRAPPER
=========================================== */

.page-wrapper{

    width:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

}

.container{
    width:100%;
    display:flex;
    justify-content:center;
    transform-style:preserve-3d;
}

.book{

    width:100%;
    max-width:940px;

    background:#fbf8ef;

    border:8px solid #e9dcb8;

    border-radius:24px;

    padding:22px;

    box-shadow:0 18px 40px rgba(0,0,0,.35);

    transition:.5s ease;

    position: relative;

}

.book::before{

    content:"";

    position:absolute;

    left:-10px;
    top:20px;
    bottom:20px;

    width:18px;

    background:#D40C02;

    border-radius:10px;
}

/* ===========================================
   TITLE
=========================================== */

.page-title{
    display:flex;
    justify-content:center;
    margin-bottom:18px;
}

.page-title h1{

    background:#f8c45d;

    border:3px solid #b88214;

    border-radius:15px;

    padding:12px 45px;

    font-size:42px;

    box-shadow:0 6px 12px rgba(0,0,0,.15);

}

.lesson{

    font-size:30px;

    font-weight:700;

    margin-bottom:25px;

}

/* ===========================================
   GRID
=========================================== */

.main{

    display:grid;

    grid-template-columns:60px repeat(3,minmax(120px,1fr));

    gap:22px;

    justify-items:center;

    align-items:start;

}

.sound-column{

    display:flex;

    flex-direction:column;

    gap:15px;

    margin-top:460px;

}

.sound{

    width:60px;

    height:52px;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#f8d8d8;

    border:2px solid #b38c8c;

    border-radius:10px;

    font-size:22px;

    font-weight:bold;

    user-select:none;

}

.empty{
    visibility:hidden;
}

.column{

    display:flex;

    flex-direction:column;

    gap:12px;

}

.group{

    display:flex;

    flex-direction:column;

    gap:12px;

}

/* ===========================================
   BUTTONS
=========================================== */

.head,
.btn{

    width:120px;

    height:54px;

    border:none;

    border-radius:10px;

    font-family:'Noto Sans Tamil',sans-serif;

    font-size:28px;

    font-weight:bold;

    cursor:pointer;

    transition:.25s;

    user-select:none;

    box-shadow:0 4px 10px rgba(0,0,0,.15);

}

.head{

    position:relative;

    font-size:30px;

    cursor:pointer;

}

.head::after{

    content:"🔊";

    position:absolute;

    top:5px;

    right:6px;

    font-size:12px;

    opacity:.85;

    pointer-events:none;

}

button:hover{

    transform:translateY(-4px) scale(1.03);

}

button:active{

    transform:scale(.96);

}

/* ===========================================
   COLORS
=========================================== */

.green{
    background:#b7ef67;
    border:2px solid #709541;
}

.head.green{
    background:#79d15d;
}

.yellow{
    background:#fff29a;
    border:2px solid #b9a548;
}

.blue{
    background:#66d8e8;
    border:2px solid #397f89;
}

.orange{
    background:#ff9d71;
    border:2px solid #ba6c47;
}

/* ===========================================
   GLOW
=========================================== */

.playing{
    animation:glow 1s infinite;
}

@keyframes glow{

0%{
box-shadow:0 0 0 rgba(255,196,0,0);
}

50%{
box-shadow:
0 0 15px rgba(255,196,0,.9),
0 0 30px rgba(255,196,0,.5);
}

100%{
box-shadow:0 0 0 rgba(255,196,0,0);
}

}

/* ===========================================
   PAGE NUMBER
=========================================== */

.page-number{

    margin-top:18px;

    text-align:center;

    font-size:24px;

    font-weight:bold;

    color:#7a42d5;

}

/* ===========================================
   NAVIGATION
=========================================== */

.navigation{

    width:980px;

    max-width:100%;

    margin-top:18px;

    display:flex;

    justify-content:space-between;

    align-items:center;

}

.nav-btn{

    width:64px;

    height:64px;

    border:none;

    border-radius:50%;

    background:#f8f1e4;

    font-size:30px;

    cursor:pointer;

    transition:.25s;

    box-shadow:0 5px 12px rgba(0,0,0,.18);

}

.nav-btn:hover{

    transform:scale(1.08);

}

.dots{

    display:flex;

    gap:10px;

}

.dot{

    width:12px;

    height:12px;

    border-radius:50%;

    background:#a8a8a8;

}

.dot.active{

    background:#32ff3f;

}

.highlight{

    color:#111;

    transition:.25s;

}

.playing .highlight{

    color:#e60000;

}

.eye-box{

    width:60px;
    height:52px;

}

.eye-box img{

    width:60px;
    height:60px;

}

.speaker{
    position:relative;
}

.speaker::after{

    content:"🔊";

    position:absolute;

    top:4px;

    right:5px;

    font-size:11px;

    pointer-events:none;

}









/* ===========================================
   MOBILE & TABLET - THOGUTHI 8
   TWO TAMIL COLUMNS: ங, ஞ
=========================================== */

@media (max-width:900px){

:root{
    --btn-height:clamp(23px, calc((100dvh - 270px) / 14), 44px);
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#1b2c73;
    display:block;
}

/* ---------- WRAPPER ---------- */

.page-wrapper{
    width:100%;
    height:100dvh;
    min-height:0;
    padding:6px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow:hidden;
    gap:6px;
}

.container{
    width:100%;
    flex:1;
    min-height:0;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* ---------- BOOK ---------- */

.book{
    position:relative;
    flex:none;
    width:100%;
    max-width:720px;
    height:100%;
    max-height:100%;
    display:flex;
    flex-direction:column;
    padding:10px 12px 6px 18px;
    border:5px solid #e9dcb8;
    border-radius:18px;
    overflow:hidden;
}

    left:-5px;
    top:12px;
    bottom:12px;

}

/* ---------- TITLE ---------- */

.page-title{

    display:flex;
    justify-content:center;
    margin-bottom:5px;
}

.page-title h1{
    font-size:clamp(18px, 3vw, 28px);
    padding:5px 14px;
}

/* ---------- LESSON ---------- */

.lesson{
    flex:none;
    font-size:clamp(15px, 2.5vw, 22px);
    margin-top:0;
    margin-bottom:7px;
}

/* ---------- MAIN GRID ---------- */

.main{
    flex:1;
    min-height:0;
    width:100%;
    display:grid;
    grid-template-columns:32px repeat(2, minmax(0, 1fr));
    column-gap:clamp(8px, 2vw, 18px);
    justify-content:center;
    align-items:stretch;
    position:relative;
    overflow:visible;
}

/* ---------- PINK PRONUNCIATION COLUMN ---------- */

.sound-column{
    margin-top:calc(6 * var(--btn-height) + 95px);
    gap:5px;
}

.sound{
    width:100%;
    height:var(--btn-height);
    font-size:clamp(10px, 2vw, 16px);
    flex-shrink:0;
}

/* ---------- EYE IMAGE ---------- */

.eye-box{
    width:100%;
    height:var(--btn-height);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-shrink:0;
}

.eye-box img{
    width:clamp(22px, 4vw, 34px);
    height:clamp(22px, 4vw, 34px);
    object-fit:contain;
}

/* ---------- TAMIL COLUMNS ---------- */

.column{
    width:100%;
    height:100%;
    min-height:0;
    display:grid;
    grid-template-rows:repeat(14, minmax(0, 1fr));
    row-gap:4px;
    justify-items:stretch;
}

/* ---------- GROUPS ---------- */

.group{
    display:contents;
}

/* ---------- ALL BUTTONS SAME WIDTH ---------- */

.column .head,
.column .btn{
    width:100%;
    height:100%;
    min-height:0;
    min-width:0;
    margin:0;
    padding:0 3px;
    justify-self:stretch;
    font-size:clamp(15px, 3vw, 25px);
    border-radius:7px;
}

.column .head{
    font-size:clamp(16px, 3.2vw, 26px);
}

/* ---------- SPEAKER ICONS ---------- */

.head::after{
    top:2px;
    right:3px;
    font-size:8px;
}

.speaker::after{
    top:2px;
    right:3px;
    font-size:8px;
}

/* ---------- PAGE NUMBER ---------- */

.page-number{
    flex:none;
    margin-top:4px;
    margin-bottom:2px;
    font-size:clamp(14px, 2.5vw, 20px);
    font-weight:bold;
    color:#7a42d5;
    text-align:center;
}

/* ---------- NAVIGATION ---------- */

.navigation{
    flex:none;
    width:100%;
    max-width:720px;
    margin-top:0;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.nav-btn{
    width:clamp(32px, 5vw, 42px);
    height:clamp(32px, 5vw, 42px);
    font-size:18px;
}

.dots{
    gap:7px;
}

.dot{
    width:7px;
    height:7px;
}


/* ===========================================
   SMALL PHONES
=========================================== */

@media (max-width:480px){

.page-wrapper{
    padding:4px 5px;
    gap:4px;
}

.book{
    padding:7px 7px 4px 13px;
    border-width:4px;
    border-radius:14px;
}

/* TWO-COLUMN GRID */

.main{
    grid-template-columns:27px repeat(2, minmax(0, 1fr));
    column-gap:clamp(8px, 3vw, 14px);
}

.column{
    row-gap:3px;
}

/* Pink pronunciation spacing */

.sound-column{
    gap:4px;
}

.sound{
    font-size:11px;
}

/* ALL BUTTONS SAME WIDTH */

.column .head,
.column .btn{
    width:100%;
    font-size:clamp(15px, 4.2vw, 20px);
    border-radius:6px;
}

.column .head{
    font-size:clamp(16px, 4.5vw, 21px);
}

/* Title */

.page-title h1{
    font-size:clamp(17px, 4.5vw, 22px);
    padding:5px 9px;
}

/* Lesson */

.lesson{
    font-size:15px;
    margin-bottom:5px;
}

}

}




/* ===========================================
   TABLET — LOWER PINK COLUMN
=========================================== */

@media (min-width:481px) and (max-width:1024px){

    .sound-column{
        margin-top:calc(6 * var(--btn-height) + 160px);
    }

}



/* ===========================================

=========================================== */

@media (min-width:481px) and (max-width:900px){

    .column .head,
    .column .btn{
        width:82%;
    }

}



</style>

<script>

    
// ===========================================
// AUDIO PLAYER
// ===========================================

let currentAudio = null;
let currentButton = null;

let highlightTimer = null;
let highlightedButtons = [];


// Stop everything
function stopAudio(){

    // Stop audio
    if(currentAudio){
        currentAudio.pause();
        currentAudio.currentTime = 0;
    }

    // Stop timer
    if(highlightTimer){
        clearInterval(highlightTimer);
        highlightTimer = null;
    }

    // Remove highlights
    highlightedButtons.forEach(btn=>{
        btn.classList.remove("playing");
    });

    highlightedButtons = [];

    // Remove current button highlight
    if(currentButton){
        currentButton.classList.remove("playing");
    }

    currentAudio = null;
    currentButton = null;

}



// ===========================================
// PLAY AUDIO
// ===========================================

function playAudio(button){

    const file = button.dataset.audio;

    if(!file) return;

    // Click same button again = STOP
    if(currentButton === button && currentAudio && !currentAudio.paused){

        stopAudio();
        return;

    }

    // Stop anything already playing
    stopAudio();

    currentAudio = new Audio(file);
    currentButton = button;

    // ===================================
    // DARK GREEN BUTTON
    // ===================================

    if(button.classList.contains("head") &&
       button.classList.contains("green")){

        const column = button.closest(".column");

        const buttons = [

            ...column.querySelectorAll(".group:nth-child(1) .btn.green"),
            ...column.querySelectorAll(".group:nth-child(2) .head.yellow"),
            ...column.querySelectorAll(".group:nth-child(2) .btn.yellow"),
            ...column.querySelectorAll(".group:nth-child(3) .head.blue"),
            ...column.querySelectorAll(".group:nth-child(3) .btn.blue"),
            ...column.querySelectorAll(".group:nth-child(4) .head.orange")

        ];

        highlightedButtons = buttons;

        let index = 0;

        buttons[index].classList.add("playing");

        highlightTimer = setInterval(()=>{

            buttons[index].classList.remove("playing");

            index++;

            if(index < buttons.length){

                buttons[index].classList.add("playing");

            }
            else{

                clearInterval(highlightTimer);
                highlightTimer = null;

            }

        },9800/buttons.length);

    }

    // ===================================
    // NORMAL BUTTON
    // ===================================

    else{

        button.classList.add("playing");
        highlightedButtons = [button];

    }

    currentAudio.onended = stopAudio;

    currentAudio.play();

}



// ===========================================
// CLICK EVENTS
// ===========================================

document.querySelectorAll("[data-audio]").forEach(button=>{

    button.addEventListener("click",()=>{

        playAudio(button);

    });

});



// ===========================================
// PAGE FLIP
// ===========================================

function nextPage(page,direction){

    const pageContainer=document.querySelector(".page-wrapper");

    pageContainer.classList.remove("flip-out-next","flip-out-prev");

    void pageContainer.offsetWidth;

    if(direction==="next"){

        pageContainer.classList.add("flip-out-next");

    }else{

        pageContainer.classList.add("flip-out-prev");

    }

    setTimeout(()=>{

        window.location.href=page;

    },600);

}

</script>
