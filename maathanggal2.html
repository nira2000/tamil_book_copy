<!DOCTYPE html>
<html lang="ta">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>URAKKA VAASI</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">


<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: "Noto Sans Tamil", sans-serif;
    background: #111D66;

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: flex-start;

    padding: 18px 12px;

    overflow-x: hidden;
}


/* =====================================================
   APP
===================================================== */

.app {
    width: 100%;
    max-width: 600px;

    display: flex;
    flex-direction: column;
    align-items: center;

    perspective: 1500px;
}


/* =====================================================
   BOOK
===================================================== */

.book {
    position: relative;

    width: 100%;
    max-width: 560px;

    background: #F9F3E4;

    border-radius: 24px;

    padding: 22px 24px 9px;

    overflow: hidden;

    box-shadow:
        0 12px 30px rgba(0,0,0,.25);

    isolation: isolate;
}


/* =====================================================
   RED SPINE
===================================================== */

.book::before {
    content: "";

    position: absolute;

    left: 0;
    top: 12px;
    bottom: 12px;

    width: 6px;

    background: #D40C02;

    border-radius: 0 8px 8px 0;

    z-index: 120;
}


/* =====================================================
   TOP YELLOW SWIRL
===================================================== */

.swirl {
    position: absolute;

    left: 13px;
    top: 7px;

    width: 82px;
    height: 82px;

    border: 6px solid #F5D36C;

    border-right-color: transparent;
    border-bottom-color: transparent;

    border-radius: 50%;

    transform: rotate(-20deg);

    opacity: .85;

    z-index: 2;

    pointer-events: none;
}

.swirl::after {
    content: "";

    position: absolute;

    left: 14px;
    top: 14px;

    width: 38px;
    height: 38px;

    border: 5px solid #F5D36C;

    border-right-color: transparent;
    border-bottom-color: transparent;

    border-radius: 50%;
}


/* =====================================================
   TOP PINK CURVE
===================================================== */

.curve-top {
    position: absolute;

    right: 8px;
    top: 10px;

    width: 82px;
    height: 32px;

    border-top: 6px solid #F2A5AB;

    border-radius: 60px;

    transform: rotate(8deg);

    z-index: 2;

    pointer-events: none;
}


/* =====================================================
   SPARKLE
===================================================== */

.sparkle {
    position: absolute;

    right: 7px;
    top: 112px;

    width: 42px;
    height: 50px;

    z-index: 10;

    pointer-events: none;
}

.sparkle::before {
    content: "";

    position: absolute;

    left: 50%;
    top: 0;

    width: 4px;
    height: 100%;

    background: #FF817A;

    border-radius: 10px;

    transform:
        translateX(-50%)
        rotate(-12deg);
}

.sparkle::after {
    content: "";

    position: absolute;

    left: 0;
    top: 50%;

    width: 100%;
    height: 4px;

    background: #FF817A;

    border-radius: 10px;

    transform:
        translateY(-50%)
        rotate(-12deg);
}


/* =====================================================
   PURPLE DECORATION
===================================================== */

.purple-swirl {
    position: absolute;

    left: -7px;
    bottom: 88px;

    width: 82px;
    height: 82px;

    border: 6px solid #A97BCB;

    border-right-color: transparent;
    border-bottom-color: transparent;

    border-radius: 50%;

    transform: rotate(30deg);

    z-index: 90;

    pointer-events: none;
}

.purple-swirl::after {
    content: "";

    position: absolute;

    left: 15px;
    top: 15px;

    width: 36px;
    height: 36px;

    border: 5px solid #A97BCB;

    border-right-color: transparent;
    border-bottom-color: transparent;

    border-radius: 50%;
}


/* =====================================================
   ORANGE DECORATION
===================================================== */

.orange-swirl {
    position: absolute;

    right: 0;
    bottom: 30px;

    width: 92px;
    height: 58px;

    border-bottom: 6px solid #F58A64;

    border-radius: 50%;

    transform: rotate(-25deg);

    z-index: 90;

    pointer-events: none;
}

.orange-swirl::before {
    content: "";

    position: absolute;

    right: 36px;
    top: 2px;

    width: 30px;
    height: 30px;

    border: 5px solid #F58A64;

    border-left-color: transparent;
    border-bottom-color: transparent;

    border-radius: 50%;
}


/* =====================================================
   FLOWER
   FRONT OF GREEN CARD
===================================================== */

.flower {
    position: absolute;

    left: -2px;
    bottom: -2px;

    width: 105px;
    height: 140px;

    z-index: 110;

    pointer-events: none;
}


/* STEM */

.flower-stem {
    position: absolute;

    left: 55px;
    bottom: 0;

    width: 7px;
    height: 82px;

    background: #B8C96B;

    border-radius: 10px;

    transform: rotate(-4deg);

    z-index: 2;
}


/* LEAVES */

.flower-leaf-left {
    position: absolute;

    left: 18px;
    bottom: 34px;

    width: 46px;
    height: 22px;

    background: #C5D477;

    border-radius:
        100%
        0
        100%
        0;

    transform: rotate(18deg);

    z-index: 3;
}

.flower-leaf-right {
    position: absolute;

    left: 53px;
    bottom: 53px;

    width: 42px;
    height: 22px;

    background: #C5D477;

    border-radius:
        0
        100%
        0
        100%;

    transform: rotate(-24deg);

    z-index: 3;
}


/* FLOWER HEAD */

.flower-head {
    position: absolute;

    left: 12px;
    bottom: 68px;

    width: 78px;
    height: 68px;

    z-index: 5;
}


/* PETALS */

.flower-petal {
    position: absolute;

    background: #F56E4C;

    border: 4px solid #F99A6F;

    border-radius:
        55%
        45%
        55%
        45%;
}

.flower-petal.one {
    width: 33px;
    height: 48px;

    left: 21px;
    top: 0;

    transform: rotate(-12deg);
}

.flower-petal.two {
    width: 33px;
    height: 47px;

    left: 42px;
    top: 7px;

    transform: rotate(18deg);
}

.flower-petal.three {
    width: 33px;
    height: 45px;

    left: 2px;
    top: 17px;

    transform: rotate(-42deg);
}

.flower-petal.four {
    width: 34px;
    height: 47px;

    left: 23px;
    top: 19px;

    transform: rotate(6deg);
}

.flower-petal.five {
    width: 31px;
    height: 45px;

    left: 45px;
    top: 23px;

    transform: rotate(40deg);
}


/* =====================================================
   TITLE
===================================================== */

.title {
    position: relative;

    width: fit-content;
    max-width: 100%;

    margin:
        3px auto
        18px;

    padding:
        7px 38px;

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 7px;

    background: #FFFFFF;

    color: #111;

    font-family: inherit;

    font-size: clamp(28px, 4.5vw, 39px);

    font-weight: 800;

    line-height: 1.15;

    border:
        2px solid #D0D0D0;

    border-radius: 12px;

    box-shadow:
        0 4px 10px rgba(0,0,0,.14);

    cursor: pointer;

    z-index: 20;

    transition: .2s;
}

.title:hover {
    transform: translateY(-1px);
}

.title .speaker-icon {
    position: absolute;

    right: 10px;
    top: 50%;

    transform: translateY(-50%);

    font-size: 12px;
}


/* =====================================================
   TOP WORD CARDS
===================================================== */

.months-wrapper {

    width: 100%;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 14px;

    margin-bottom: 15px;
}


.card {

    display: flex;

    flex-direction: column;

    gap: 6px;

    padding: 11px;

    border-radius: 20px;

    border: 2px solid rgba(0,0,0,.12);

    box-shadow:
        0 4px 9px rgba(0,0,0,.08);
}

.card.pink {
    background: #F5CFD8;

    border-color: #E5A9B8;
}

.card.yellow {
    background: #F8E3A8;

    border-color: #E3C76F;
}


/* =====================================================
   TOP WORD BUTTONS
===================================================== */

.month-btn {

    position: relative;

    width: 100%;

    min-height: 34px;

    padding:
        4px 25px 4px 7px;

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 0;

    background: rgba(255,255,255,.25);

    border:
        2px solid rgba(0,0,0,.20);

    border-radius: 10px;

    color: #111;

    font-family: inherit;

    font-size: clamp(14px, 2.2vw, 20px);

    line-height: 1.25;

    cursor: pointer;

    transition: .2s;
}

.month-btn:hover {
    background: #FFFFFF;

    border-color: #D97891;

    transform: translateY(-1px);

    box-shadow:
        0 3px 8px rgba(0,0,0,.12);
}

.month-btn:active {
    transform: scale(.97);
}

.month-btn.active {
    background: #FFF59A;

    color: #D12020;

    border-color: #D12020;

    box-shadow:
        0 0 8px rgba(255,215,0,.6);
}


/* =====================================================
   SPEAKER
===================================================== */

.speaker-icon {

    position: absolute;

    right: 6px;
    top: 50%;

    transform: translateY(-50%);

    font-size: 11px;

    opacity: .8;

    pointer-events: none;
}


/* =====================================================
   WEEKDAY TITLE
===================================================== */

.aathichudi-header {

    width: 100%;

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 10px;

    margin:
        3px 0
        10px;

    position: relative;

    z-index: 25;
}


.heading {

    position: relative;

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 2px;

    padding:
        4px 22px;

    background: #F7B9C8;

    color: #111;

    font-family: inherit;

    font-size: clamp(19px, 3vw, 28px);

    font-weight: 800;

    line-height: 1.2;

    border:
        2px solid #E99AAF;

    border-radius: 24px;

    box-shadow:
        0 3px 8px rgba(0,0,0,.10);

    cursor: pointer;

    transition: .2s;
}

.heading:hover {
    transform: translateY(-1px);
}

.heading.active {
    color: #D12020;

    background: #FFF59A;

    border-color: #D12020;
}


/* =====================================================
   SIDE ARROWS
===================================================== */

.line {

    position: relative;

    width: 31px;
    height: 4px;

    background: #000;

    border-radius: 10px;

    flex-shrink: 0;
}

.line::before,
.line::after {

    content: "";

    position: absolute;

    width: 23px;
    height: 4px;

    background: #000;

    border-radius: 10px;
}

.left::before {
    top: -7px;
    left: 0;

    transform: rotate(25deg);
}

.left::after {
    top: 7px;
    left: 0;

    transform: rotate(-25deg);
}

.right::before {
    top: -7px;
    right: 0;

    transform: rotate(-25deg);
}

.right::after {
    top: 7px;
    right: 0;

    transform: rotate(25deg);
}


/* =====================================================
   BOTTOM GREEN WEEKDAY CARD
===================================================== */

.aathichudi-card {

    position: relative;

    width: 100%;

    background: #B8E6A8;

    border:
        2px solid #91C982;

    border-radius: 22px;

    padding:
        10px 12px;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    box-shadow:
        0 4px 10px rgba(0,0,0,.08);

    z-index: 20;
}


/* =====================================================
   WEEKDAY COLUMNS
===================================================== */

.column {

    display: flex;

    flex-direction: column;

    gap: 5px;

    min-width: 0;
}


/* =====================================================
   WEEKDAY BUTTONS
===================================================== */

.rule-btn {

    position: relative;

    width: 100%;

    min-height: 34px;

    padding:
        4px 24px 4px 8px;

    display: flex;

    justify-content: center;
    align-items: center;

    background:
        rgba(255,255,255,.18);

    border:
        2px solid rgba(0,0,0,.18);

    border-radius: 9px;

    color: #111;

    font-family: inherit;

    font-size: clamp(14px, 2vw, 19px);

    line-height: 1.2;

    text-align: center;

    cursor: pointer;

    transition: .2s;
}

.rule-btn:hover {

    background: #FFFFFF;

    border-color: #79A96C;

    transform: translateY(-1px);

    box-shadow:
        0 3px 8px rgba(0,0,0,.12);
}

.rule-btn:active {
    transform: scale(.97);
}

.rule-btn.active {

    background: #FFF59A;

    color: #D12020;

    border-color: #D12020;

    box-shadow:
        0 0 8px rgba(255,215,0,.6);
}


/* =====================================================
   RED TEXT-ONLY WORD HIGHLIGHT
===================================================== */

.highlight {

    display: inline;

    color: #111;

    background: transparent !important;

    padding: 0;

    margin: 0;

    border-radius: 0;

    transition:
        color .15s ease,
        font-weight .15s ease,
        text-shadow .15s ease;
}

.highlight.active {

    color: #D32F2F;

    background: transparent !important;

    font-weight: 800;

    text-shadow:
        0 0 2px rgba(211,47,47,.25);
}


/* =====================================================
   PAGE NUMBER
===================================================== */

.page-number {

    position: relative;

    margin-top: 7px;

    text-align: center;

    font-size: 17px;

    line-height: 1.2;

    font-weight: 800;

    color: #7657C7;

    z-index: 30;
}


/* =====================================================
   NAVIGATION
===================================================== */

.navigation {

    width: 100%;

    max-width: 560px;

    margin-top: 9px;

    display: flex;

    justify-content: space-between;

    align-items: center;
}


.nav-btn {

    width: 36px;
    height: 36px;

    display: flex;

    justify-content: center;
    align-items: center;

    border:
        2px solid rgba(0,0,0,.10);

    border-radius: 50%;

    background: #F9F3E4;

    color: #111;

    font-size: 19px;

    cursor: pointer;

    box-shadow:
        0 4px 10px rgba(0,0,0,.16);

    transition: .2s;
}

.nav-btn:hover {
    transform: scale(1.08);
}


/* =====================================================
   DOTS
===================================================== */

.dots {

    display: flex;

    align-items: center;

    gap: 6px;
}

.dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #AAB0B0;
}

.dot.active {
    background: #19C900;
}


/* =====================================================
   PAGE FLIP
===================================================== */

.flip-out-next {
    animation:
        flipNext .6s ease forwards;

    transform-origin:
        left center;
}

.flip-out-prev {
    animation:
        flipPrev .6s ease forwards;

    transform-origin:
        right center;
}

@keyframes flipNext {

    0% {
        transform: rotateY(0deg);
    }

    100% {
        transform: rotateY(-90deg);
    }
}

@keyframes flipPrev {

    0% {
        transform: rotateY(0deg);
    }

    100% {
        transform: rotateY(90deg);
    }
}



/* =========================================================
   MOBILE ONLY
   DESKTOP COMPLETELY UNTOUCHED
   NO SCROLLING
========================================================= */

@media (max-width: 768px) {

    /* ==============================
       SCREEN
    ============================== */

    html,
    body {
        width: 100%;
        height: 100%;
        min-height: 0;
        margin: 0;
        padding: 0;

        overflow: hidden;
        overscroll-behavior: none;
    }

    body {
        height: 100dvh;
        min-height: 100dvh;

        display: flex;
        justify-content: center;
        align-items: stretch;

        background: #111d66;
    }


    /* ==============================
       APP
    ============================== */

    .app {
        width: 100%;
        max-width: 520px;

        height: 100dvh;
        min-height: 0;

        margin: 0 auto;
        padding: 4px 7px;

        display: flex;
        flex-direction: column;
        align-items: center;

        gap: 3px;

        overflow: hidden;
    }


    /* ==============================
       BOOK
    ============================== */

    .book {
        width: 100%;

        flex: 1 1 auto;
        min-height: 0;

        margin: 0;

        padding:
            9px
            8px
            4px
            11px;

        border-radius: 17px;

        overflow: hidden;

        display: flex;
        flex-direction: column;
        justify-content: flex-start;
    }


    /* ==============================
       RED SPINE
    ============================== */

    .book::before {
        width: 6px;

        left: 0;
        top: 9px;
        bottom: 9px;

        border-radius: 6px;
    }


    /* ==============================
       DECORATIONS
    ============================== */

    .swirl {
        left: -8px;
        top: -7px;

        transform: scale(.43);
        transform-origin: top left;

        z-index: 2;
    }

    .curve-top {
        right: -7px;
        top: 3px;

        transform: scale(.53);
        transform-origin: top right;

        z-index: 2;
    }

    .calendar-sticker {
        right: -8px;
        top: 285px;

        width: 58px;

        transform: rotate(3deg);

        z-index: 8;
    }


    /* ==============================
       TITLE
    ============================== */

    .title {
        position: relative;

        width: min(100%, 290px);
        max-width: 290px;
        min-width: 0;

        flex: 0 0 auto;

        margin:
            5px
            auto
            8px;

        padding:
            6px
            28px
            6px
            10px;

        display: flex;
        justify-content: center;
        align-items: center;

        text-align: center;

        font-size: clamp(21px, 6vw, 28px);
        line-height: 1.15;

        border-radius: 10px;

        z-index: 10;
    }

    .title .speaker-icon {
        right: 7px;
        font-size: 9px;
    }


    /* ==============================
       MONTHS AREA
    ============================== */

    .months-wrapper {
        width: 100%;

        flex: 0 0 auto;

        display: flex;

        gap: clamp(6px, 2vw, 9px);

        margin-bottom: 8px;

        position: relative;

        z-index: 10;
    }


    /* ==============================
       MONTH CARDS
    ============================== */

    .card {
        flex: 1;

        min-width: 0;

        padding:
            7px
            7px;

        gap: 3px;

        border-radius: 15px;
    }


    /* ==============================
       MONTH BUTTONS
    ============================== */

    .month-btn {
        width: 100%;

        min-height: 0;

        height: clamp(27px, 6.7vw, 33px);

        padding:
            1px
            22px
            1px
            3px;

        font-size: clamp(11.5px, 3.4vw, 15px);

        line-height: 1;

        border-width: 1.5px;
        border-radius: 9px;

        display: flex;
        align-items: center;
        justify-content: center;

        white-space: nowrap;
    }

    .month-btn .speaker-icon {
        right: 4px;
        font-size: 8px;
    }


    /* ==============================
       AATHICHUDI HEADER
    ============================== */

    .aathichudi-header {
        width: 100%;

        flex: 0 0 auto;

        display: flex;
        justify-content: center;
        align-items: center;

        gap: 7px;

        margin-bottom: 7px;

        position: relative;

        z-index: 10;
    }


    /* ==============================
       SIDE LINES
    ============================== */

    .line {
        width: 23px;
        height: 3px;

        flex: 0 0 23px;
    }

    .line::before,
    .line::after {
        width: 16px;
        height: 3px;
    }

    .left::before {
        top: -6px;
    }

    .left::after {
        top: 6px;
    }

    .right::before {
        top: -6px;
    }

    .right::after {
        top: 6px;
    }


    /* ==============================
       AATHICHUDI TITLE
    ============================== */

    .heading {
        flex: 0 0 auto;

        font-size: clamp(18px, 5.7vw, 24px);

        line-height: 1.1;

        padding:
            5px
            15px;

        border-radius: 22px;

        white-space: nowrap;
    }

    .heading .speaker-icon {
        right: 5px;
        font-size: 8px;
    }


    /* ==============================
       GREEN AATHICHUDI CARD
    ============================== */

    .aathichudi-card {
        width: 100%;

        flex: 0 0 auto;

        height: auto;
        min-height: 0;

        padding:
            7px
            7px;

        gap: 5px;

        border-radius: 16px;

        overflow: hidden;

        position: relative;

        z-index: 7;
    }


    /* ==============================
       GREEN COLUMNS
    ============================== */

    .aathichudi-card .column {
        flex: 1 1 0;

        min-width: 0;
        min-height: 0;

        display: flex;
        flex-direction: column;

        gap: 3px;

        justify-content: flex-start;
    }


    /* ==============================
       GREEN BUTTONS
    ============================== */

    .aathichudi-card .rule-btn {
        width: 100%;

        flex: 0 0 auto;

        min-height: 0;

        height: clamp(25px, 6.4vw, 31px);

        padding:
            1px
            21px
            1px
            3px;

        font-size: clamp(10px, 3vw, 13.5px);

        line-height: 1;

        border-width: 1.5px;

        border-radius: 8px;

        white-space: nowrap;

        overflow: hidden;

        display: flex;
        align-items: center;

        text-align: left;
    }

    .aathichudi-card .rule-btn .star {
        flex: 0 0 auto;

        font-size: clamp(9px, 2.8vw, 12px);

        margin-right: 2px;
    }

    .aathichudi-card .rule-btn .speaker-icon {
        right: 4px;

        font-size: 7px;
    }


    /* ==============================
       PAGE NUMBER
       KEEP AT BOTTOM OF BOOK
    ============================== */

    .page-number {
        width: 100%;

        flex: 0 0 auto;

        margin:
            3px
            0
            0;

        padding: 0;

        text-align: center;

        font-size: 13px;

<script>

/* =====================================================
   AUDIO
===================================================== */

let currentAudio = null;

let currentButton = null;

let highlightTimers = [];


/* =====================================================
   AUDIO TIMINGS
===================================================== */

const timings = {

    "title_read.mp3":
        [0,2000,3000,4000,5000,6000],

    "weekdays_title.mp3":
        [0,2000],

    "thaipoosam.mp3":
        [0,2000,3000,4000,5000],

    "kadarkanni.mp3":
        [0,2000,3000,4500,5500,6800],

    "pooppanthu.mp3":
        [0,2000,3000,4500,5800],

    "tholaipesi.mp3":
        [0,2000,3500,4500,6000],

    "cheenaputhandu.mp3":
        [0,3000,4000,5500,6800,8500,9600,10800],

    "pallivaasal.mp3":
        [0,2000,3000,4500,5800,7000],

    "tamilmozhi.mp3":
        [0,1800,3000,4300,5500],

    "mudhaluthavi.mp3":
        [0,1800,3000,4500,6000],

    "tholaikkaatchi.mp3":
        [0,2000,3000,4500,5800,7000],

    "thiruvizha.mp3":
        [0,2000,3800,4800],

    "gnayiru.mp3":
        [0,2000,3000],

    "thingal.mp3":
        [0,2000,3000,4500],

    "sevvai.mp3":
        [0,2000,3000,4000],

    "budhan.mp3":
        [0,2000,3000],

    "viyazhan.mp3":
        [0,2000,3000,4200],

    "velli.mp3":
        [0,2000,3200],

    "sani.mp3":
        [0,2000]

};


/* =====================================================
   CLEAR HIGHLIGHTS
===================================================== */

function clearHighlights(button) {

    if (!button) return;

    button
        .querySelectorAll(".highlight")
        .forEach(word => {

            word.classList.remove("active");

        });
}


/* =====================================================
   CLEAR TIMERS
===================================================== */

function clearTimers() {

    highlightTimers.forEach(timer => {

        clearTimeout(timer);

    });

    highlightTimers = [];

}


/* =====================================================
   ANIMATE WORDS
===================================================== */

function animateWords(button) {

    clearTimers();

    clearHighlights(button);


    const words =
        button.querySelectorAll(".highlight");


    const audio =
        button.dataset.audio;


    const times =
        timings[audio];


    if (!times) return;


    times.forEach((time,index) => {

        const timer =
            setTimeout(() => {

                if (currentButton !== button)
                    return;


                words.forEach(word => {

                    word.classList.remove("active");

                });


                if (words[index]) {

                    words[index]
                        .classList.add("active");

                }

            },time);


        highlightTimers.push(timer);

    });

}


/* =====================================================
   STOP AUDIO
===================================================== */

function stopCurrent() {

    clearTimers();


    if (currentAudio) {

        currentAudio.pause();

        currentAudio.currentTime = 0;

        currentAudio = null;

    }


    if (currentButton) {

        currentButton
            .classList.remove("active");

        clearHighlights(currentButton);

        currentButton = null;

    }

}


/* =====================================================
   PLAY AUDIO
===================================================== */

document
    .querySelectorAll("[data-audio]")
    .forEach(button => {


        button.addEventListener("click",() => {


            /* SAME BUTTON = STOP */

            if (
                currentButton === button &&
                currentAudio
            ) {

                stopCurrent();

                return;

            }


            /* STOP PREVIOUS */

            stopCurrent();


            /* NEW AUDIO */

            currentButton = button;


            currentAudio =
                new Audio(
                    button.dataset.audio
                );


            button.classList.add("active");


            animateWords(button);


            currentAudio.play()
                .catch(error => {

                    console.log(
                        "Audio play failed:",
                        error
                    );

                });


            currentAudio.onended = () => {

                clearTimers();

                clearHighlights(button);

                button.classList.remove("active");

                currentAudio = null;

                currentButton = null;

            };


            currentAudio.onerror = () => {

                console.log(
                    "Cannot load audio:",
                    button.dataset.audio
                );

                stopCurrent();

            };

        });

    });


/* =====================================================
   SPACEBAR
===================================================== */

document.addEventListener("keydown",e => {

    if (e.code !== "Space")
        return;

    e.preventDefault();

    if (!currentAudio)
        return;


    if (currentAudio.paused) {

        currentAudio.play();

    } else {

        currentAudio.pause();

    }

});


/* =====================================================
   ESC = STOP
===================================================== */

document.addEventListener("keydown",e => {

    if (e.key === "Escape") {

        stopCurrent();

    }

});


/* =====================================================
   VISIBILITY
===================================================== */

document.addEventListener(
    "visibilitychange",
    () => {

        if (document.hidden) {

            stopCurrent();

        }

    }
);


/* =====================================================
   KEYBOARD ACCESS
===================================================== */

const audioButtons =
    [
        ...document.querySelectorAll("[data-audio]")
    ];


audioButtons.forEach((btn,index) => {

    btn.setAttribute("tabindex","0");


    btn.addEventListener(
        "keydown",
        e => {


            if (e.key === "ArrowDown") {

                e.preventDefault();

                if (audioButtons[index + 1]) {

                    audioButtons[index + 1]
                        .focus();

                }

            }


            if (e.key === "ArrowUp") {

                e.preventDefault();

                if (audioButtons[index - 1]) {

                    audioButtons[index - 1]
                        .focus();

                }

            }


            if (e.key === "Enter") {

                e.preventDefault();

                btn.click();

            }

        }
    );

});


/* =====================================================
   PAGE FLIP
===================================================== */

function nextPage(page,direction) {

    stopCurrent();


    const app =
        document.querySelector(".app");


    app.classList.remove(
        "flip-out-next",
        "flip-out-prev"
    );


    void app.offsetWidth;


    if (direction === "next") {

        app.classList.add(
            "flip-out-next"
        );

    } else {

        app.classList.add(
            "flip-out-prev"
        );

    }


    setTimeout(() => {

        window.location.href = page;

    },600);

}


/* =====================================================
   PREVENT DOUBLE TAP ZOOM
===================================================== */

let lastTouchEnd = 0;


document.addEventListener(
    "touchend",
    event => {

        const now =
            new Date().getTime();


        if (
            now - lastTouchEnd <= 300
        ) {

            event.preventDefault();

        }


        lastTouchEnd = now;

    },
    { passive:false }
);


/* =====================================================
   BEFORE UNLOAD
===================================================== */

window.addEventListener(
    "beforeunload",
    () => {

        stopCurrent();

    }
);

</script>
