<!DOCTYPE html>
<html lang="ta">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tamil e-Book</title>

<style>

/* =======================
   RESET
======================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
}

body {
    font-family: Arial, sans-serif;
    background: #111D66;

    display: flex;
    justify-content: center;
    align-items: center;

    perspective: 1500px;
}


/* =======================
   PAGE ANIMATION
======================= */

.flip-out-next {
    animation: flipNext .6s ease forwards;
    transform-origin: left center;
}

.flip-out-prev {
    animation: flipPrev .6s ease forwards;
    transform-origin: right center;
}

@keyframes flipNext {

    from {
        transform: rotateY(0);
        opacity: 1;
    }

    to {
        transform: rotateY(-120deg);
        opacity: 0;
    }

}

@keyframes flipPrev {

    from {
        transform: rotateY(0);
        opacity: 1;
    }

    to {
        transform: rotateY(120deg);
        opacity: 0;
    }

}


/* =======================
   APP
======================= */

.app {
    width: 100%;
    max-width: 800px;
    transform-style: preserve-3d;
}


/* =======================
   HEADER
======================= */

.header {

    color: #fff;
    text-align: center;

    font-size: 40px;
    font-weight: bold;

    margin-bottom: 15px;

    text-shadow:
        0 0 5px rgba(255,255,255,.7),
        0 0 12px #4FC3F7,
        0 0 24px #4FC3F7,
        0 0 36px #4FC3F7;

    animation: glowPulse 3s ease-in-out infinite;
}

@keyframes glowPulse {

    0%, 100% {
        text-shadow:
            0 0 5px #fff,
            0 0 10px #4FC3F7,
            0 0 20px #4FC3F7;
    }

    50% {
        text-shadow:
            0 0 10px #fff,
            0 0 25px #4FC3F7,
            0 0 50px #4FC3F7,
            0 0 70px #4FC3F7;
    }

}


/* =======================
   BOOK
======================= */

.book {

    position: relative;

    background: #f8f1e4;

    border-radius: 30px;

    padding: 40px;

    box-shadow: 0 10px 30px rgba(0,0,0,.25);
}


/* RED SPINE */

.book::before {

    content: "";

    position: absolute;

    left: -10px;
    top: 25px;
    bottom: 25px;

    width: 20px;

    background: #D40C02;

    border-radius: 10px;
}


/* =======================
   COVER
======================= */

.cover {

    display: flex;
    justify-content: center;
    align-items: center;

}

.cover img {

    width: 100%;
    max-width: 900px;

    display: block;

    border-radius: 15px;
}


/* =======================
   NAVIGATION
======================= */

.navigation {

    margin-top: 20px;

    display: flex;
    justify-content: space-between;
    align-items: center;

}

.nav-btn {

    width: 65px;
    height: 65px;

    border: none;
    border-radius: 50%;

    background: #f8f1e4;

    font-size: 28px;

    cursor: pointer;

    box-shadow: 0 5px 15px rgba(0,0,0,.2);

    transition: .25s;

}

.nav-btn:hover {
    transform: scale(1.05);
}

.dots {

    display: flex;
    gap: 10px;

}

.dot {

    width: 12px;
    height: 12px;

    border-radius: 50%;

    background: #8da4a4;

}

.dot.active {

    background: #1CFF00;

}



/* =========================================
   SWIPE INDICATOR
========================================= */

.swipe-hint {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;

    width: fit-content;
    max-width: 100%;

    margin: 12px auto 0;
    padding: 9px 18px;

    background: #FFF4D6;
    color: #21005B;

    border: 2px solid #FFF4D6;
    border-radius: 50px;

    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;

    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
}

.swipe-hand {
    font-size: 18px;
    animation: handSwipe 1.2s ease-in-out infinite;
}

.swipe-arrows {
    font-size: 23px;
    font-weight: bold;
    line-height: 1;
    animation: arrowSwipe 1.2s ease-in-out infinite;
}

@keyframes handSwipe {
    0%, 100% {
        transform: translateX(0);
    }

    50% {
        transform: translateX(-5px);
    }
}

@keyframes arrowSwipe {
    0%, 100% {
        transform: translateX(0);
    }

    50% {
        transform: translateX(5px);
    }
}




/* ===========================================
   MOBILE
=========================================== */

@media (max-width: 768px) {

    html,
    body {

        width: 100%;
        height: 100dvh;

        margin: 0;
        padding: 0;

        overflow: hidden;

    }

    body {

        background: #111D66;

        display: flex;
        justify-content: center;
        align-items: center;

    }


    /* APP */

    .app {

        width: 100%;
        max-width: 380px;

        height: 100dvh;

        display: flex;
        flex-direction: column;
        justify-content: center;

        padding: 8px;

    }


    /* HEADER */

    .header {

        font-size: 18px;

        margin-bottom: 8px;

        line-height: 1.2;

    }


    /* BOOK */

    .book {

        width: 100%;

        padding: 12px;

        border-radius: 18px;

    }

    .book::before {

        width: 8px;

        left: -4px;

        top: 12px;

        bottom: 12px;

    }


    /* COVER */

    .cover {

        display: flex;
        justify-content: center;
        align-items: center;

    }

    .cover img {

        width: min(100%, 340px);

        height: auto;

        max-height: calc(100dvh - 170px);

        object-fit: contain;

    }


    /* NAVIGATION */

    .navigation {

        margin-top: 10px;

        display: flex;
        justify-content: space-between;
        align-items: center;

    }

    .nav-btn {

        width: 44px;
        height: 44px;

        font-size: 20px;

    }

    .dots {

        gap: 8px;

    }

    .dot {

        width: 8px;
        height: 8px;

    }

    /* MOBILE SWIPE INDICATOR */

    .swipe-hint {
        gap: 7px;
        margin-top: 10px;
        padding: 7px 12px;
        font-size: 11px;
    }

    .swipe-hand {
        font-size: 16px;
    }

    .swipe-arrows {
        font-size: 20px;
    }


}



</style>

</head>


<body>



<!-- YOUR EXISTING BOOK -->

<div class="app">

    <div class="header">
        📚 Tamil e-Book • தமிழ் எழுத்துகள்
    </div>

    <div class="book">

        <div class="cover">
            <img
                src="cover.jpg"
                alt="Tamil Book Cover"
            >
        </div>

    </div>

    <!-- SWIPE INDICATOR -->
    <div class="swipe-hint">
        <span class="swipe-hand">☝</span>
        <span class="swipe-text">SWIPE TO TURN PAGE</span>
        <span class="swipe-arrows">↔</span>
    </div>

    <!-- NAVIGATION -->
    <div class="navigation">

        <button
            class="nav-btn"
            onclick="nextPage('home.html','prev')"
            aria-label="Previous page"
        >
            ❮
        </button>

        <div class="dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <button
            class="nav-btn"
            onclick="nextPage('page2.html','next')"
            aria-label="Next page"
        >
            ❯
        </button>

    </div>

</div>

<script src="swipe.js"></script>


<script src="swipe.js"></script>

<!-- =========================================
     JAVASCRIPT
========================================= -->

<script>


/* =========================================
   PAGE FLIP
========================================= */

function nextPage(page, direction) {

    const app =
        document.querySelector(".app");


    if (direction === "next") {

        app.classList.add("flip-out-next");

    } else {

        app.classList.add("flip-out-prev");

    }


    setTimeout(function() {

        window.location.href = page;

    }, 600);

}

</script>


</body>

</html>
